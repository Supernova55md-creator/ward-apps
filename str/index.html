<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>脳卒中トレーニング</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#9D174D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="脳卒中トレ">
<style>
:root{
  --bg:#F7F3F5; --surface:#FFFFFF; --ink:#24181D; --muted:#6B5A61; --line:#E6D9DF;
  --accent:#9D174D; --accent-strong:#7A1039; --accent-soft:#FBE7EF; --on-accent:#FFFFFF;
  --ok:#2E7D4F; --ok-soft:#E3F3E9; --ng:#B42318; --ng-soft:#FDE8E6; --warn-soft:#FFF4DB;
  --font:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif; --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#171214; --surface:#211A1D; --ink:#F0E8EB; --muted:#B39FA7; --line:#3A2E33;
    --accent:#F0729F; --accent-strong:#F7A8C4; --accent-soft:#3A1E29; --on-accent:#2A0714;
    --ok:#5CC48A; --ok-soft:#163323; --ng:#F27A6E; --ng-soft:#3B1C1A; --warn-soft:#3A3017; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:680px;margin:0 auto;padding:0 calc(14px + env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:50%;border:5px solid var(--accent);flex:none}
.brand h1{font-size:19px;font-weight:900}
.brand small{color:var(--muted);font-size:11px;margin-left:auto;text-align:right;line-height:1.3}
.summary{display:flex;gap:14px;margin-top:6px;font-size:12.5px;color:var(--muted);padding:0 2px}
.summary b{color:var(--ink);font-size:14px}
section.view{display:none;padding-top:12px}
section.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:6px}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
details.set>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary::after{content:"＋";margin-left:auto;color:var(--muted);font-weight:400}
details.set[open]>summary::after{content:"－"}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer;background:var(--bg);user-select:none}
.chip input{margin:0;accent-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:44px}
input[type=search]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-height:44px}
.sw{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.qhead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.lv{letter-spacing:1px;color:var(--accent)}
.regtag{margin-left:auto;background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:1px 10px;font-weight:700}
.stem{font-size:15.5px;margin:0 0 6px}
.ask{font-weight:700;margin:12px 0 8px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;font-size:15.5px;line-height:1.45;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:11px 12px;min-height:48px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.opt .why{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.result{border-radius:10px;padding:9px 12px;font-weight:700;margin:12px 0 10px}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.ng{background:var(--ng-soft);color:var(--ng)}
.exp{font-size:15px;margin:0 0 8px}
ul.kp{margin:6px 0 8px;padding-left:20px;font-size:14.5px}
ul.kp li{margin:3px 0}
.refs{font-size:12.5px;color:var(--muted)}
.refs a{color:var(--accent-strong);margin-right:8px;white-space:nowrap}
.fig{margin:10px 0 2px;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{font-size:11.5px;color:#cfc4c8;background:#111;margin:0;padding:4px 8px;line-height:1.4}
.zoombtn{font-size:12px;color:var(--accent-strong);background:none;border:0;padding:4px 0;cursor:pointer}
#zoom{position:fixed;inset:0;z-index:2147483002;background:#000;display:none;flex-direction:column}
#zoom.on{display:flex}
#zoom .zb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center;padding:calc(48px + env(safe-area-inset-top)) 8px 8px}
#zoom .zb svg{width:100%;max-width:1000px;height:auto}
#zoom button{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));font:inherit;font-size:15px;font-weight:700;background:#fff;color:#111;border:0;border-radius:999px;padding:8px 16px;min-height:40px;cursor:pointer}
body.zoomon #wcClrBtn,body.zoomon #wcQrBtn{display:none!important}
.next{margin-top:12px;display:flex;gap:8px}
details.site{border-top:1px solid var(--line)}
details.site:first-of-type{border-top:0}
details.site>summary{cursor:pointer;padding:9px 0;list-style:none}
details.site>summary::-webkit-details-marker{display:none}
details.site>summary b{display:block;font-size:14.5px}
details.site>summary span{display:block;font-size:12.5px;color:var(--muted)}
.mk{font-size:12px;font-weight:700;margin-left:6px}
.mk.ok{color:var(--ok)}.mk.ng{color:var(--ng)}
table.st{width:100%;border-collapse:collapse;font-size:14.5px}
table.st td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.st td.num{text-align:right;white-space:nowrap;width:1%}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);font-size:14px}
ul.src{margin:0;padding-left:18px;font-size:13.5px}
ul.src li{margin:5px 0;line-height:1.45}
ul.src a{color:var(--accent-strong);word-break:break-all}
.note{font-size:12.5px;color:var(--muted);background:var(--warn-soft);border-radius:9px;padding:8px 10px;margin-top:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.tabs .in{display:flex;max-width:680px;width:100%}
nav.tabs button{flex:1;font:inherit;font-size:13px;background:none;border:0;color:var(--muted);padding:9px 0 10px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:20;display:none;max-width:90%}
.toast.on{display:block}
.foot{font-size:11.5px;color:var(--muted);margin:16px 2px 0}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>脳卒中トレーニング</h1><small>症例と画像で<br>判断を練習</small></div>
  <div class="summary"><span>回答 <b id="sN">0</b></span><span>正答率 <b id="sR">—</b></span><span>連続正解 <b id="sS">0</b></span></div>
</header>

<section class="view active" id="v-q" aria-label="出題">
  <details class="card set" id="setBox">
    <summary>出題範囲・設定 <span class="hint" id="setSum" style="margin:0 0 0 4px"></span></summary>
    <div class="chips" id="catChips"></div>
    <div class="row"><button class="btn sm" id="catAll" type="button">すべて</button><button class="btn sm" id="catNone" type="button">すべて外す</button></div>
    <div class="row" style="margin-top:10px">
      <label for="lvSel" style="font-size:14px">難易度</label>
      <select id="lvSel"><option value="1">基本のみ</option><option value="2">標準まで</option><option value="3" selected>応用まで（すべて）</option></select>
    </div>
    <label class="sw"><input type="checkbox" id="imgOpt">画像のある問題だけ</label>
    <label class="sw"><input type="checkbox" id="hideOpt">選択肢を隠して、先に自分で考える</label>
    <label class="sw"><input type="checkbox" id="weakOpt" checked>間違えた問題・まだ解いていない問題を優先</label>
    <p class="hint" id="setHint"></p>
  </details>
  <div id="qArea"></div>
</section>

<section class="view" id="v-a" aria-label="一覧">
  <div class="card">
    <h2>問題一覧</h2>
    <input type="search" id="aQ" placeholder="キーワードで絞り込み（例：DOAC、ASPECTS）" aria-label="絞り込み">
    <p class="hint">開くと問題・正解・解説が見られます。「この問題を解く」で出題画面に移ります。</p>
  </div>
  <div id="aList"></div>
</section>

<section class="view" id="v-s" aria-label="成績"><div id="sArea"></div></section>
<section class="view" id="v-r" aria-label="出典"><div id="rArea"></div></section>

<p class="foot">自分用の学習ツールです。画像はすべて自作の模式図で、実際の画像ではありません。症例は典型例をまとめたもので、診療の判断は診察・画像と原典（ガイドライン・指針・添付文書）で行ってください。成績はこの端末内にのみ保存されます。</p>
</div>

<div id="zoom" role="dialog" aria-modal="true" aria-label="図の拡大"><button type="button" id="zoomX">閉じる</button><div class="zb" id="zoomB"></div></div>

<nav class="tabs" role="tablist" aria-label="画面切替"><div class="in">
  <button role="tab" aria-selected="true" data-v="v-q" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.2v.1"/></svg>出題</button>
  <button role="tab" aria-selected="false" data-v="v-a" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>一覧</button>
  <button role="tab" aria-selected="false" data-v="v-s" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>成績</button>
  <button role="tab" aria-selected="false" data-v="v-r" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h9l4 4v14H6z M14 3v5h5 M9 13h7M9 17h7"/></svg>出典</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== 模式図（すべて自作のSVG。実際の画像ではない） =====
   座標系：1パネル 240×270。画像の左＝患者の右（放射線学的表示）。
   半球の図形は「画像の右側（患者の左）」の座標で定義し、患者の右は鏡像にする。 */
var IMG = (function () {
  var CX = 120, CY = 138, RX = 92, RY = 116;
  var PAL = {
    ct:    { bg: "#000", skull: "#efefef", br: "#8b8b8b", deep: "#a3a3a3", wm: "#848484", csf: "#262626", early: "#6c6c6c", old: "#3e3e3e", blood: "#ececec", vessel: "#d6d6d6", ic: "#7c7c7c" },
    cta:   { bg: "#000", skull: "#efefef", br: "#8f8f8f", deep: "#989898", wm: "#888", csf: "#2a2a2a", early: "#6c6c6c", old: "#3e3e3e", blood: "#ececec", vessel: "#f4f4f4", ic: "#808080" },
    dwi:   { bg: "#000", skull: "#1c1c1c", br: "#4e4e4e", deep: "#5f5f5f", wm: "#4a4a4a", csf: "#121212", lesion: "#f5f5f5", ic: "#4a4a4a" },
    flair: { bg: "#000", skull: "#202020", br: "#6a6a6a", deep: "#7b7b7b", wm: "#666", csf: "#111", lesion: "#dadada", ic: "#666" },
    ctp:   { bg: "#000", skull: "#3a3a3a", br: "#2c2c2c", deep: "#303030", wm: "#2a2a2a", csf: "#0c0c0c", core: "#ff2d95", pen: "#2bd46b", ic: "#2a2a2a" }
  };
  function P(r) { return Math.round(r * 10) / 10; }
  function ell(s, th) { var t = th * Math.PI / 180; return [CX + RX * s * Math.cos(t), CY + RY * s * Math.sin(t)]; }
  /* 皮質のくさび（画像の右側＝患者の左） */
  function wedge(a1, a2, s1, s2) {
    var d = "", n = 14, i, p;
    for (i = 0; i <= n; i++) { p = ell(s2, a1 + (a2 - a1) * i / n); d += (i ? "L" : "M") + P(p[0]) + "," + P(p[1]); }
    for (i = n; i >= 0; i--) { p = ell(s1, a1 + (a2 - a1) * i / n); d += "L" + P(p[0]) + "," + P(p[1]); }
    return d + "Z";
  }
  /* ASPECTS 領域（患者の左側の座標） */
  var REG = {
    C: "M130,101 Q138,97 144,104 Q146,114 141,122 Q134,124 131,117 Q129,108 130,101Z",
    L: "M152,112 Q171,123 170,160 Q160,168 154,152 Q149,132 152,112Z",
    IC: "M144,123 L149,117 L153,136 L158,166 L151,170 L146,141 Z",
    I: "M173,110 Q182,140 173,172 L178,172 Q188,140 178,110 Z",
    M1: wedge(-62, -22, 0.76, 0.985), M2: wedge(-22, 28, 0.76, 0.985), M3: wedge(28, 62, 0.76, 0.985),
    M4: wedge(-62, -20, 0.42, 0.985), M5: wedge(-20, 25, 0.42, 0.985), M6: wedge(25, 62, 0.42, 0.985),
    ACA_g: wedge(-90, -62, 0.5, 0.985), PCA_g: wedge(62, 90, 0.5, 0.985),
    ACA_s: wedge(-90, -62, 0.2, 0.985), PCA_s: wedge(62, 90, 0.3, 0.985),
    TH: "M122,146 Q140,141 145,157 Q142,172 126,172 Q122,160 122,146Z"
  };
  var LAB = { C: [137, 112], L: [161, 142], IC: [150, 128], I: [181, 152], M1: ell(0.87, -42), M2: ell(0.87, 3), M3: ell(0.87, 45), M4: ell(0.72, -41), M5: ell(0.72, 2), M6: ell(0.72, 43) };
  function mir(svg) { return '<g transform="translate(240,0) scale(-1,1)">' + svg + "</g>"; }
  function side(s, svg) { return s === "R" ? mir(svg) : svg; }
  function both(svg) { return svg + mir(svg); }
  function head(c, mod) {
    var h = '<rect x="0" y="0" width="240" height="270" fill="' + c.bg + '"/>';
    if (mod === "ct" || mod === "cta") h += '<ellipse cx="' + CX + '" cy="' + CY + '" rx="' + (RX + 6) + '" ry="' + (RY + 6) + '" fill="none" stroke="' + c.skull + '" stroke-width="7"/>';
    else h += '<ellipse cx="' + CX + '" cy="' + CY + '" rx="' + (RX + 7) + '" ry="' + (RY + 7) + '" fill="none" stroke="' + c.skull + '" stroke-width="5"/>';
    return h;
  }
  function brainBase(c) {
    return '<ellipse cx="' + CX + '" cy="' + CY + '" rx="' + RX + '" ry="' + RY + '" fill="' + c.br + '"/>' +
      '<path d="M120,22 L120,58 M120,216 L120,254" stroke="' + c.csf + '" stroke-width="2.4"/>';
  }
  /* 脳溝（皮質の目安） */
  function sulci(c) {
    var s = "", a = [-72, -46, -24, -2, 20, 42, 66];
    a.forEach(function (t) { var p = ell(0.985, t), q = ell(0.945, t); s += '<path d="M' + P(p[0]) + "," + P(p[1]) + " L" + P(q[0]) + "," + P(q[1]) + '" stroke="' + c.csf + '" stroke-width="1.6"/>'; });
    return both(s);
  }
  /* 基底核レベル */
  function sliceBG(c, o) {
    var dx = o.shift || 0, sq = o.squeeze || "";
    var vent = function (sd) {
      var comp = (sq === sd) ? 0.45 : 1;
      var fh = "M121,90 Q" + (121 + 13 * comp) + ",93 " + (121 + 14 * comp) + ",107 Q" + (121 + 13 * comp) + ",121 " + (121 + 5 * comp) + ",128 L121,128 Z";
      var at = "M124,184 Q" + (124 + 16 * comp) + ",186 " + (124 + 18 * comp) + ",198 Q" + (124 + 12 * comp) + ",205 124,201 Z";
      return '<path d="' + fh + '" fill="' + (o.ivh ? c.blood : c.csf) + '"/><path d="' + at + '" fill="' + (o.ivh ? c.blood : c.csf) + '"/>';
    };
    var hemi = '<path d="' + REG.C + '" fill="' + c.deep + '"/><path d="' + REG.L + '" fill="' + c.deep + '"/><path d="' + REG.IC + '" fill="' + c.ic + '"/>' +
      '<path d="' + REG.TH + '" fill="' + c.deep + '"/><path d="' + REG.I + '" fill="' + c.deep + '"/>' +
      '<path d="M182,106 Q192,140 182,176" fill="none" stroke="' + c.csf + '" stroke-width="2.6"/><path d="M186,124 L208,116" stroke="' + c.csf + '" stroke-width="2"/>';
    var g = '<g transform="translate(' + dx + ',0)">' + vent("L") + mir(vent("R")) +
      '<rect x="118.5" y="140" width="3" height="26" rx="1.5" fill="' + (o.ivh ? c.blood : c.csf) + '"/></g>';
    return hemi + mir(hemi) + g;
  }
  /* 放線冠レベル */
  function sliceSup(c, o) {
    var dx = o.shift || 0;
    var v = '<path d="M121,98 Q133,104 134,140 Q133,176 121,186 Z" fill="' + (o.ivh ? c.blood : c.csf) + '"/>';
    return '<g transform="translate(' + dx + ',0)">' + v + mir(v) + "</g>";
  }
  /* 鞍上部（中脳）レベル */
  function sliceMid(c, o) {
    var sah = o.sah, f = sah ? c.blood : c.csf;
    var h = '<path d="M120,104 L136,114 L132,132 L108,132 L104,114 Z" fill="' + f + '"/>';
    var sy = '<path d="M134,116 Q160,110 196,98" fill="none" stroke="' + f + '" stroke-width="' + (sah ? 5 : 2.6) + '" stroke-linecap="round"/>';
    h += sy + mir(sy);
    h += '<path d="M120,168 Q100,168 98,150 Q100,134 110,136 L120,146 L130,136 Q140,134 142,150 Q140,168 120,168Z" fill="' + c.deep + '"/>';

  return'<a href="'+u+'" target="_blank" rel="noopener">'+esc(r[2])+'</a>';}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ── 設定 ── */
function pool(){var s=st.set;return QS.filter(function(q){return s.cats.indexOf(q.c)>=0&&q.lv<=s.lv&&(!s.img||q.img);});}
function renderSet(){
  var s=st.set;
  $("catChips").innerHTML=Object.keys(CATS).map(function(c){var n=QS.filter(function(q){return q.c===c;}).length;var on=s.cats.indexOf(c)>=0;
    return'<label class="chip'+(on?" on":"")+'"><input type="checkbox" data-c="'+c+'"'+(on?" checked":"")+'>'+CATS[c]+' <span style="color:var(--muted);font-size:12px">'+n+'</span></label>';}).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#catChips input"),function(i){i.onchange=function(){
    var c=i.getAttribute("data-c");var a=st.set.cats.filter(function(x){return x!==c;});if(i.checked)a.push(c);st.set.cats=a;st.cur=null;save();renderSet();renderQ();};});
  $("lvSel").value=String(s.lv);$("imgOpt").checked=!!s.img;$("hideOpt").checked=!!s.hide;$("weakOpt").checked=s.weak!==false;
  var p=pool();$("setSum").textContent="（"+p.length+"問）";
  $("setHint").textContent=p.length?"":"条件に合う問題がありません。範囲を広げてください。";
}
$("lvSel").onchange=function(){st.set.lv=+this.value;st.cur=null;save();renderSet();renderQ();};
$("imgOpt").onchange=function(){st.set.img=this.checked;st.cur=null;save();renderSet();renderQ();};
$("hideOpt").onchange=function(){st.set.hide=this.checked;save();renderQ();};
$("weakOpt").onchange=function(){st.set.weak=this.checked;save();};
$("catAll").onclick=function(){st.set.cats=Object.keys(CATS);st.cur=null;save();renderSet();renderQ();};
$("catNone").onclick=function(){st.set.cats=[];st.cur=null;save();renderSet();renderQ();};

/* ── 出題の選び方 ── */
function pick(){
  var p=pool();if(!p.length)return null;
  var last=st.hist.slice(-Math.min(6,Math.max(0,p.length-1)));
  var cand=p.filter(function(q){return last.indexOf(q.id)<0;});if(!cand.length)cand=p;
  if(st.set.weak!==false){
    var w=cand.map(function(q){var r=st.st[q.id];var wt=!r?4:(r[0]-r[1]>0?3+(r[0]-r[1]):1/(1+r[0]));return wt;});
    var tot=w.reduce(function(a,b){return a+b;},0),x=Math.random()*tot;
    for(var i=0;i<cand.length;i++){x-=w[i];if(x<=0)return cand[i];}
    return cand[cand.length-1];
  }
  return cand[Math.floor(Math.random()*cand.length)];
}
function newQ(id){var q=id?QMAP[id]:pick();if(!q){st.cur=null;return;}
  st.cur={id:q.id,ord:shuffle(q.o.map(function(_,i){return i;})),ans:null,show:!st.set.hide};save();}

function figHTML(q,after){
  if(!q.img)return"";
  return'<div class="fig">'+IMG.render(q.img,after)+'<p class="cap">模式図（自作）。画像の左＝患者の右'+(after&&hasMarks(q.img)?"。黄色は解答後の注記":"")+'</p></div><button type="button" class="zoombtn" id="zoomOpen">図を拡大する</button>';
}
function hasMarks(sp){var ps=sp.panels||[sp];return ps.some(function(p){return p.lab||p.mark;});}

function renderQ(){
  var a=$("qArea");
  if(!st.cur||!QMAP[st.cur.id])newQ();
  if(!st.cur){a.innerHTML='<div class="card empty">出題できる問題がありません。「出題範囲・設定」で範囲を選んでください。</div>';return;}
  var q=QMAP[st.cur.id],c=st.cur,done=c.ans!==null;
  var r=st.st[q.id];
  var h='<div class="card"><div class="qhead"><span class="lv">'+"★★★".slice(0,q.lv)+"☆☆☆".slice(0,3-q.lv)+'</span>'+(r?'<span>この問題 '+r[1]+'/'+r[0]+'</span>':'<span>はじめて</span>')+'<span class="regtag">'+CATS[q.c]+'</span></div>';
  h+='<p class="stem">'+esc(q.s)+'</p>'+figHTML(q,done);
  h+='<p class="ask">'+esc(q.q)+'</p>';
  if(!c.show&&!done){h+='<button type="button" class="btn primary" id="showOpt">選択肢を見る</button>';}
  else{
    h+='<div class="opts">'+c.ord.map(function(oi,n){var o=q.o[oi];var cls="";
      if(done){if(oi===0)cls=" ok";else if(oi===c.ans)cls=" ng";}
      return'<button type="button" class="opt'+cls+'" data-i="'+oi+'"'+(done?" disabled":"")+'><span class="n">'+(n+1)+'</span><span>'+esc(o[0])+(done&&(oi===0||oi===c.ans)&&o[1]?'<span class="why">'+esc(o[1])+'</span>':"")+'</span></button>';}).join("")+'</div>';
  }
  if(done){
    var ok=c.ans===0;
    h+='<div class="result '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解（正解は緑の選択肢）")+'</div>';
    h+='<p class="exp">'+esc(q.e)+'</p>';
    if(q.k&&q.k.length)h+='<ul class="kp">'+q.k.map(function(x){return"<li>"+esc(x)+"</li>";}).join("")+'</ul>';
    if(q.r&&q.r.length)h+='<div class="refs">出典：'+q.r.map(refLink).join("")+'</div>';
    h+='<div class="next"><button type="button" class="btn primary" id="nextQ">次の問題</button>'+(c.ans!==0?'<button type="button" class="btn" id="retryQ">もう一度解く</button>':"")+'</div>';
  }
  h+='</div>';
  a.innerHTML=h;
  if($("showOpt"))$("showOpt").onclick=function(){c.show=true;save();renderQ();};
  Array.prototype.forEach.call(a.querySelectorAll(".opt:not([disabled])"),function(b){b.onclick=function(){answer(+b.getAttribute("data-i"));};});
  if($("nextQ"))$("nextQ").onclick=function(){newQ();renderQ();window.scrollTo(0,0);};
  if($("retryQ"))$("retryQ").onclick=function(){newQ(q.id);renderQ();};
  if($("zoomOpen"))$("zoomOpen").onclick=function(){openZoom(q,done);};
}
function answer(i){
  var c=st.cur,q=QMAP[c.id];if(c.ans!==null)return;
  c.ans=i;var ok=i===0;
  var r=st.st[q.id]||[0,0];r[0]++;if(ok)r[1]++;r[2]=ok?1:0;st.st[q.id]=r;
  st.cnt++;if(ok){st.ok++;st.streak++;}else st.streak=0;
  st.hist.push(q.id);if(st.hist.length>60)st.hist=st.hist.slice(-60);
  save();renderTop();renderQ();
}
function renderTop(){$("sN").textContent=st.cnt;$("sR").textContent=st.cnt?Math.round(st.ok/st.cnt*100)+"%":"—";$("sS").textContent=st.streak;}

/* ── 拡大 ── */
function openZoom(q,after){$("zoomB").innerHTML=IMG.render(q.img,after);$("zoom").classList.add("on");document.body.classList.add("zoomon");}
$("zoomX").onclick=function(){$("zoom").classList.remove("on");document.body.classList.remove("zoomon");};

/* ── 一覧 ── */
function renderList(){
  var f=($("aQ").value||"").trim().toLowerCase();
  var h="";
  Object.keys(CATS).forEach(function(c){
    var qs=QS.filter(function(q){if(q.c!==c)return false;if(!f)return true;
      var t=(q.s+q.q+q.e+q.o.map(function(o){return o.join(" ");}).join(" ")+(q.k||[]).join(" ")).toLowerCase();return t.indexOf(f)>=0;});
    if(!qs.length)return;
    h+='<div class="card"><h2>'+CATS[c]+' <span style="font-weight:400;color:var(--muted);font-size:13px">'+qs.length+'問</span></h2>';
    qs.forEach(function(q){var r=st.st[q.id];
      h+='<details class="site"><summary><b>'+esc(q.q)+(r?'<span class="mk '+(r[2]?"ok":"ng")+'">'+(r[2]?"前回○":"前回×")+'</span>':"")+'</b><span>'+esc(q.s.slice(0,60))+(q.s.length>60?"…":"")+(q.img?"（画像あり）":"")+'</span></summary>'+
        '<div style="padding:0 0 10px"><p class="stem">'+esc(q.s)+'</p>'+(q.img?'<div class="fig">'+IMG.render(q.img,true)+'</div>':"")+
        '<p style="margin:8px 0 4px"><b>正解：</b>'+esc(q.o[0][0])+'</p><p class="exp">'+esc(q.e)+'</p>'+
        (q.r&&q.r.length?'<div class="refs">出典：'+q.r.map(refLink).join("")+'</div>':"")+
        '<button type="button" class="btn sm" data-go="'+q.id+'" style="margin-top:8px">この問題を解く</button></div></details>';});
    h+='</div>';
  });
  $("aList").innerHTML=h||'<div class="card empty">該当する問題がありません。</div>';
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"),function(b){b.onclick=function(){newQ(b.getAttribute("data-go"));show("v-q");renderQ();};});
}
$("aQ").oninput=renderList;

/* ── 成績 ── */
function renderStats(){
  var h='<div class="card"><h2>分野別の成績</h2><table class="st">';
  Object.keys(CATS).forEach(function(c){
    var qs=QS.filter(function(q){return q.c===c;}),n=0,o=0,tried=0;
    qs.forEach(function(q){var r=st.st[q.id];if(r){n+=r[0];o+=r[1];tried++;}});
    var pct=n?Math.round(o/n*100):0;
    h+='<tr><td>'+CATS[c]+'<div class="hint" style="margin:0">'+tried+'/'+qs.length+'問に回答</div></td><td><div class="bar"><i style="width:'+pct+'%"></i></div></td><td class="num">'+(n?pct+"%":"—")+'</td></tr>';
  });
  h+='</table></div>';
  var wrong=QS.filter(function(q){var r=st.st[q.id];return r&&r[2]===0;});
  h+='<div class="card"><h2>前回まちがえた問題</h2>'+(wrong.length?wrong.map(function(q){return'<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:6px 0"><span style="font-size:14px;flex:1">'+esc(q.q)+'</span><button type="button" class="btn sm" data-go="'+q.id+'">解く</button></div>';}).join(""):'<p class="empty">ありません。</p>')+'</div>';
  h+='<div class="card"><button type="button" class="btn" id="resetSt">成績を消す</button><p class="hint">成績（回答数・正答率・各問題の結果）を消します。</p></div>';
  $("sArea").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("#sArea [data-go]"),function(b){b.onclick=function(){newQ(b.getAttribute("data-go"));show("v-q");renderQ();};});
  $("resetSt").onclick=function(){if(!confirm("成績をすべて消しますか？"))return;st.st={};st.hist=[];st.cnt=0;st.ok=0;st.streak=0;save();renderTop();renderStats();};
}

/* ── 出典 ── */
function renderRefs(){
  var li=function(k){var r=REFS[k];var u=r[1];var lab="";
    if(u&&!/^https?:/.test(u)){lab=u.indexOf("doi:")===0?u:"PMID "+u;u=u.indexOf("doi:")===0?"https://doi.org/"+u.slice(4):"https://pubmed.ncbi.nlm.nih.gov/"+u+"/";}
    else if(u)lab="PDF";
    return"<li>"+esc(r[0])+(u?' <a href="'+u+'" target="_blank" rel="noopener">'+lab+'</a>':"")+"</li>";};
  var gl=["GL","RT","EV"],tr=Object.keys(REFS).filter(function(k){return gl.indexOf(k)<0;});
  var h='<div class="card"><h2>指針・ガイドライン</h2><ul class="src">'+gl.map(li).join("")+'</ul></div>';
  h+='<div class="card"><h2>臨床試験・海外ガイドライン</h2><ul class="src">'+tr.map(li).join("")+'</ul></div>';
  h+='<div class="card"><h2>照合の状況</h2><p class="note">静注血栓溶解の適応外・慎重投与項目、用量、投与後の管理（神経評価・血圧測定の頻度、24時間の抗血栓療法の制限）、DOAC・ワルファリン・ダビガトランの扱い、発症時刻の定義は、rt-PA適正治療指針 第三版の本文と照合しました。血栓回収の推奨度（ASPECTS別・時間別・脳底動脈・M2）は、ガイドライン改訂2025の内容を反映した既存の「再開通療法 適応チェッカー」と同じ整理です。臨床試験の数値は各論文の要旨と照合しました。脳出血・くも膜下出血の手術適応（小脳出血3 cm、被殻出血31 mL）、脳梗塞急性期の降圧基準（220/120）、嚥下・DVT予防（CLOTS）・けいれん予防投与・分水嶺梗塞・分枝粥腫病・出血性変化の分類・ABC/2法の記載は、ガイドラインと一般的な知識による要約で、原典の頁と一つずつ照合したものではありません（未照合）。推奨度の細部は原典で確認してください。</p>';
  h+='<p class="note">図はすべて自作の模式図です。本や論文の画像は使っていません。Dropboxの脳卒中関連書籍は、この版ではrt-PA適正治療指針（第三版）を参照しました。</p>';
  h+='<div class="row" style="margin-top:10px;font-size:12px;color:var(--muted)">アプリの版：<b>'+APP_VER+'</b><button type="button" class="btn sm" id="forceUpdate">最新版に更新</button></div>';
  h+='<p class="hint">収録：'+QS.length+'問（画像つき '+QS.filter(function(q){return q.img;}).length+'問）</p></div>';
  $("rArea").innerHTML=h;
  $("forceUpdate").onclick=async function(){
    var b=this;b.textContent="確認しています…";
    try{if("serviceWorker" in navigator){var r=await navigator.serviceWorker.getRegistration("../");if(r)await r.update();}}catch(e){}
    try{await fetch(location.href,{cache:"reload"});}catch(e){b.textContent="通信できないため確認できません";return;}
    setTimeout(function(){location.reload();},800);
  };
}

/* ── タブ ── */
var tabs=document.querySelectorAll("nav.tabs button");
function show(v){
  Array.prototype.forEach.call(document.querySelectorAll("section.view"),function(s){s.classList.toggle("active",s.id===v);});
  Array.prototype.forEach.call(tabs,function(b){b.setAttribute("aria-selected",b.getAttribute("data-v")===v?"true":"false");});
  if(v==="v-a")renderList();if(v==="v-s")renderStats();if(v==="v-r")renderRefs();if(v==="v-q")renderQ();
  window.scrollTo(0,0);
}
Array.prototype.forEach.call(tabs,function(b){b.onclick=function(){show(b.getAttribute("data-v"));};});
var tt;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on");},2600);}
window.__strToast=toast;

renderSet();renderTop();renderQ();
})();

</script>
