<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>神経局在トレーニング</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F766E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="局在トレーニング">
<style>

:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#1A2422; --muted:#5A6865; --line:#D9E2DF;
  --accent:#0F766E; --accent-strong:#0B5650; --accent-soft:#E1F2EF; --on-accent:#FFFFFF;
  --ok:#2E7D4F; --ok-soft:#E3F3E9; --ng:#B42318; --ng-soft:#FDE8E6; --warn-soft:#FFF4DB;
  --font:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif; --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121716; --surface:#1B2220; --ink:#E7EEEC; --muted:#9FB0AC; --line:#2D3835;
    --accent:#2DBFAF; --accent-strong:#6FDCCF; --accent-soft:#16332F; --on-accent:#06201D;
    --ok:#5CC48A; --ok-soft:#163323; --ng:#F27A6E; --ng-soft:#3B1C1A; --warn-soft:#3A3017; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:680px;margin:0 auto;padding:0 calc(14px + env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:50%;border:5px solid var(--accent);flex:none}
.brand h1{font-size:19px;font-weight:900}
.brand small{color:var(--muted);font-size:11px;margin-left:auto;text-align:right;line-height:1.3}
.summary{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 9px}
.tile .k{font-size:11px;color:var(--muted);display:block}
.tile .v{font-size:17px;font-weight:700;display:block}
section.view{display:none;padding-top:12px}
section.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:6px}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
details.set>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary::after{content:"＋";margin-left:auto;color:var(--muted);font-weight:400}
details.set[open]>summary::after{content:"－"}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer;background:var(--bg);user-select:none}
.chip input{margin:0;accent-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:44px}
input[type=search]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-height:44px}
.sw{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
/* 出題 */
.qhead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.lv{letter-spacing:1px;color:var(--accent)}
.regtag{margin-left:auto;background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:1px 10px;font-weight:700}
.pt{font-size:15.5px;margin:0 0 8px}
ul.fd{margin:0;padding:0;list-style:none}
ul.fd li{position:relative;padding:7px 0 7px 18px;border-top:1px dashed var(--line);font-size:15.5px;line-height:1.5}
ul.fd li:first-child{border-top:0}
ul.fd li::before{content:"";position:absolute;left:3px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ask{font-weight:700;margin:12px 0 8px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;font-size:15.5px;line-height:1.45;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:11px 12px;min-height:48px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.result{border-radius:10px;padding:9px 12px;font-weight:700;margin-bottom:10px}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.ng{background:var(--ng-soft);color:var(--ng)}
.result .ans{display:block;color:var(--ink);font-size:17px;margin-top:2px}
.result .syn{display:block;color:var(--muted);font-weight:400;font-size:13.5px}
.ex h3{font-size:14.5px;margin:12px 0 4px;color:var(--accent-strong)}
.why{margin:0;padding:0;list-style:none}
.why li{padding:7px 0;border-top:1px dashed var(--line);font-size:15px;line-height:1.5}
.why li:first-child{border-top:0}
.why .f{display:block}
.why .w{display:block;color:var(--muted);font-size:13.5px;padding-left:1.2em;text-indent:-1.2em}
.why .w::before{content:"→ ";color:var(--accent)}
.why .dn{font-weight:700;display:block}
.pearl{background:var(--warn-soft);border-radius:10px;padding:9px 12px;font-size:14.5px;margin-top:12px}
.pearl b{display:block;font-size:13px;color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nav .btn{flex:1 1 140px}
/* 一覧 */
details.site{border-top:1px solid var(--line)}
details.site:first-of-type{border-top:0}
details.site>summary{cursor:pointer;padding:9px 0;list-style:none}
details.site>summary::-webkit-details-marker{display:none}
details.site>summary b{display:block;font-size:15px}
details.site>summary span{display:block;font-size:13px;color:var(--muted)}
.lvb{font-size:11px;color:var(--accent);margin-left:6px;font-weight:400}
.sub{font-size:12.5px;color:var(--muted);margin:8px 0 2px;font-weight:700}
/* 成績 */
table.st{width:100%;border-collapse:collapse;font-size:14.5px}
table.st td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.st td.num{text-align:right;white-space:nowrap;width:1%}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);font-size:14px}
/* タブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.tabs .in{display:flex;max-width:680px;width:100%}
nav.tabs button{flex:1;font:inherit;font-size:13px;background:none;border:0;color:var(--muted);padding:9px 0 10px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:20;display:none;max-width:90%}
.toast.on{display:block}
.foot{font-size:11.5px;color:var(--muted);margin:16px 2px 0}

/* モード切替 */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.modes button{font:inherit;font-size:13px;line-height:1.25;border:0;border-radius:8px;background:none;color:var(--muted);padding:7px 4px;min-height:40px;cursor:pointer}
.modes button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:700}
/* 図 */
.fig{margin:10px 0 2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 6px 4px}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{font-size:11.5px;color:var(--muted);margin:2px 4px 0;line-height:1.4}
/* 2段階目 */
.step2{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.types .opt{justify-content:center;text-align:center;font-weight:700}
.badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;margin-right:6px}
.badge.yes{background:var(--ng-soft);color:var(--ng)}
.badge.md{background:var(--warn-soft);color:var(--ink)}
.badge.no{background:var(--ok-soft);color:var(--ok)}
.box{background:var(--bg);border-radius:10px;padding:8px 11px;font-size:14.5px;margin-top:4px}
.mark2{font-weight:700}
.mark2.ok{color:var(--ok)}.mark2.ng{color:var(--ng)}
/* 出典 */
ul.src{margin:0;padding-left:18px;font-size:13.5px}
ul.src li{margin:5px 0;line-height:1.45}
ul.src a{color:var(--accent-strong);word-break:break-all}
.note{font-size:12.5px;color:var(--muted);background:var(--warn-soft);border-radius:9px;padding:8px 10px;margin-top:8px}

.summary{display:flex;gap:14px;margin-top:6px;font-size:12.5px;color:var(--muted);padding:0 2px}
.summary b{color:var(--ink);font-size:14px}
.modes button{min-height:36px;padding:5px 4px}

</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>神経局在トレーニング</h1><small>症候から病巣を当てる<br>病棟アプリ</small></div>
  <div class="modes" role="group" aria-label="出題モード">
    <button type="button" data-m="loc">部位</button>
    <button type="button" data-m="vas">血管支配</button>
    <button type="button" data-m="eye" aria-label="眼球運動・瞳孔・視野">眼・瞳孔・視野</button>
  </div>
  <div class="summary">
    <span>回答 <b id="sN">0</b></span><span>正答率 <b id="sR">—</b></span><span>連続正解 <b id="sS">0</b></span>
  </div>
</header>

<section class="view active" id="v-q" aria-label="出題">
  <details class="card set" id="setBox">
    <summary>出題範囲・設定 <span class="hint" id="setSum" style="margin:0 0 0 4px"></span></summary>
    <div class="chips" id="regChips"></div>
    <div class="row"><button class="btn sm" id="regAll" type="button">すべて</button><button class="btn sm" id="regNone" type="button">すべて外す</button></div>
    <div class="row" style="margin-top:10px">
      <label for="lvSel" style="font-size:14px">難易度</label>
      <select id="lvSel"><option value="1">基本のみ</option><option value="2">標準まで</option><option value="3">応用まで（すべて）</option></select>
    </div>
    <label class="sw" id="pairRow" hidden><input type="checkbox" id="pairOpt">紛らわしいペアを集中して出す（AChAとLSA、Wallenbergと延髄内側、top of the basilarと両側PCA）</label>
    <label class="sw"><input type="checkbox" id="hideOpt">選択肢を隠して、先に自分で考える</label>
    <label class="sw"><input type="checkbox" id="weakOpt">間違えた項目・まだ解いていない項目を優先</label>
    <p class="hint" id="setHint"></p>
  </details>
  <div id="qArea"></div>
</section>

<section class="view" id="v-a" aria-label="一覧">
  <div class="card">
    <h2 id="aTitle">一覧</h2>
    <input type="search" id="aQ" placeholder="名前・所見で絞り込み" aria-label="絞り込み">
    <p class="hint" id="aHint"></p>
  </div>
  <div id="aList"></div>
</section>

<section class="view" id="v-s" aria-label="成績">
  <div id="sArea"></div>
</section>

<section class="view" id="v-r" aria-label="出典">
  <div id="rArea"></div>
</section>

<p class="foot">自分用の学習ツールです。所見の組み合わせは典型例の要約で、実際の症例では画像・経過で確認してください。診療の判断は診察と原典で行ってください。入力と成績はこの端末内にのみ保存されます。</p>
</div>

<nav class="tabs" role="tablist" aria-label="画面切替"><div class="in">
  <button role="tab" aria-selected="true" data-v="v-q" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.2v.1"/></svg>出題</button>
  <button role="tab" aria-selected="false" data-v="v-a" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>一覧</button>
  <button role="tab" aria-selected="false" data-v="v-s" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>成績</button>
  <button role="tab" aria-selected="false" data-v="v-r" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h9l4 4v14H6z M14 3v5h5 M9 13h7M9 17h7"/></svg>出典</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
/* 出題データ
   name/hx の {S}=病巣側、所見の {I}=病巣と同側、{C}=病巣と反対側。
   所見は [所見, 局在上の意味, (任意)病巣側条件 "L"/"R"]。
   near は誤答選択肢にする近い部位。":C" は病巣と反対側、":L"/":R" は側を固定、無指定は同側（非側性の正解ならランダム）。 */
const REGIONS = {
  cx: "大脳皮質・皮質下",
  dc: "基底核・視床・内包",
  bs: "脳幹",
  cb: "小脳",
  cn: "脳神経・眼球運動",
  vis: "視覚路",
  sc: "脊髄",
  rt: "神経根・神経叢",
  pn: "末梢神経",
  nm: "神経筋接合部・筋・びまん性"
};
const SITES = [
/* ───── 大脳 ───── */
{id:"cx_broca",reg:"cx",lvl:1,name:"左下前頭回後部（Broca野）〜中心前回下部",
 hx:"心房細動で抗凝固薬を自己中断していた。会話中に突然言葉が出なくなった。",
 req:[["発語が少なく努力性でたどたどしい（非流暢）。単語レベルの理解は比較的保たれる","非流暢＋理解比較的保持＝前方（運動性）失語。優位半球下前頭回後部"],
      ["復唱も障害される","復唱障害があるので超皮質性失語ではなくBroca型"],
      ["右顔面下部と右上肢の筋力低下（下肢は軽度）","顔・上肢優位＝中心前回外側（中大脳動脈上枝領域）。下肢領域は内側で保たれやすい"]],
 opt:[["自分の言い誤りに気づき、もどかしそうにする","病識の保持はBroca型の特徴"],
      ["発症直後は両眼が左へ共同偏視","前頭眼野の障害で眼は病巣側を向く"],
      ["右手で書く文も文法が崩れる（失書）","失語には書字障害を伴う"]],
 near:["cx_wernicke","cx_cond","dc_ic:L","cx_aca:L"],
 sig:"非流暢・復唱障害＋右顔面・上肢優位の麻痺",
 pearl:"失語の型は『流暢性・理解・復唱』の3軸で分ける。復唱が保たれれば超皮質性（分水嶺・前大脳動脈領域）を考える。"},
{id:"cx_wernicke",reg:"cx",lvl:1,name:"左上側頭回後部（Wernicke野）",
 hx:"高血圧の既往。家族が『話がかみ合わない』と連れて来た。",
 req:[["多弁で流暢だが内容が乏しく、錯語・新造語が多い","流暢＋錯語＝後方（感覚性）失語"],
      ["口頭命令の理解が著しく悪く、復唱もできない","理解障害＋復唱障害＝Wernicke型（優位半球上側頭回後部）"],
      ["四肢の麻痺はない","中心前回・内包から離れた後方病変。麻痺がないため精神疾患・せん妄と誤られやすい"]],
 opt:[["本人は困っている様子がない（病識の欠如）","Wernicke失語の特徴"],
      ["右上1/4の同名性視野欠損","側頭葉を通るMeyer係蹄の障害（対側上四分盲）"]],
 near:["cx_broca","cx_cond","cx_angular","vis_meyer:L"],
 sig:"流暢・理解障害・復唱障害、麻痺なし",
 pearl:"急な『錯乱』に見えて麻痺がない時は流暢性失語を疑い、命令理解と復唱を確かめる。"},
{id:"cx_cond",reg:"cx",lvl:3,name:"左縁上回〜弓状束（伝導失語）",
 hx:"脂質異常症の既往。急に言い間違いが増えた。",
 req:[["流暢に話し、理解は良好","流暢＋理解保持で、Broca野・Wernicke野は保たれる"],
      ["復唱が著しく障害され、音韻性錯語（『とけい』→『とてい』）が目立つ","復唱の選択的障害＝伝導失語（縁上回皮質下・弓状束）"],
      ["言い誤りを自分で何度も修正しようとする（接近行為）","音韻の自己修正は伝導失語の特徴"]],
 opt:[["右上肢の軽い感覚低下","中心後回下部・頭頂弁蓋部の近傍"],
      ["口・舌の観念運動失行","縁上回近傍の病変で合併しやすい"]],
 near:["cx_broca","cx_wernicke","cx_angular","cx_aca:L"],
 sig:"流暢・理解良好・復唱だけ障害",
 pearl:"復唱だけが障害されるのが伝導失語、逆に復唱だけ保たれるのが超皮質性失語。"},
{id:"cx_angular",reg:"cx",lvl:2,name:"左角回（下頭頂小葉）",
 hx:"右利き。計算ができず、字が書けないと訴えて受診。",
 req:[["失書（字が思い出せない）","優位半球角回"],

 fig:{t:"vf",I:["CL"],C:["CL"]},
 near:["e_meyer","e_occ","e_tract","e_chiasm"],
 pearl:"同名半盲で視運動性眼振に左右差があれば頭頂葉が深く関わっている（後頭葉だけなら左右差は目立たない）。"},
{id:"e_occ",grp:"vf",lvl:1,lat:1,name:"{S}後頭葉（鳥距溝の皮質）",
 sig:"対側の調和した同名半盲（黄斑回避）、RAPDなし",

 opt:[],
 acc:["純粋失読（左後頭葉＋脳梁膨大）","視覚性の錯覚・幻視","麻痺はない"],
 fig:{t:"vf",I:["Ch"],C:["Ch"],spare:1},
 near:["e_tract","e_occpole","e_meyer","e_par"],
 pearl:"後ろの病変ほど左右の欠損の形がそろう（調和）。"},
{id:"e_occpole",grp:"vf",lvl:3,lat:1,name:"{S}後頭極",
 sig:"対側の同名性の中心暗点、周辺は保たれる",

 opt:[],
 acc:["後大脳動脈と中大脳動脈の境界（分水嶺）の梗塞・外傷","字を読みにくい"],

 near:["e_occ","e_on","e_tract","e_par"],

];

</script>
<script>
(function(){
"use strict";
var APP_VER="ltr-2026-11-14b";
var KEY="ltr-v1";
var SIDE={L:"左",R:"右"};
function opp(x){return x==="L"?"R":"L";}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fill(t,side){
  if(side) return t.replace(/\{S\}|\{I\}/g,SIDE[side]).replace(/\{C\}/g,SIDE[opp(side)]);
  return t.replace(/\{S\}/g,"").replace(/\{I\}/g,"同側").replace(/\{C\}/g,"対側");
}
function fillAtlas(t){return t.replace(/\{S\}/g,"一側の").replace(/\{I\}/g,"同側").replace(/\{C\}/g,"対側");}
function idx(arr){var o={};arr.forEach(function(s){o[s.id]=s;});return o;}

/* ── モードの定義 ── */
var MODES={
  loc:{key:"loc",title:"部位",items:SITES,by:idx(SITES),cats:REGIONS,ask:"病巣はどこか？",opp:true,sfx:"",
       unit:"部位",hint:"症例は部位ごとの所見から毎回組み立てます（左右・提示する所見・年齢が変わります）。"},
  vas:{key:"vas",title:"血管支配",items:VSITES,by:idx(VSITES),cats:VCATS,ask:"① 閉塞血管はどれか？",opp:false,sfx:"_vas",two:true,
       unit:"項目",hint:"①閉塞血管、②梗塞の型の2段階で答えます。解説に責任病巣・画像所見・血栓回収の対象かを示します。"},
  eye:{key:"eye",title:"眼球運動・瞳孔・視野",items:ESITES,by:idx(ESITES),cats:ECATS,ask:"病変部位はどこか？",opp:true,sfx:"_eye",fig:true,
       unit:"項目",hint:"図は自作の模式図です。眼位は検者から見た9方向、視野は患者から見た向きで描いています。"}
};
function catOf(s){return s.reg||s.grp;}
function allF(s,side){return s.req.map(function(f){return {t:f[0],w:f[1],c:f[2]||null,r:1};}).concat(s.opt.map(function(f){return {t:f[0],w:f[1],c:f[2]||null};}));}
function hasC(s){return /\{C\}/.test(JSON.stringify([s.req,s.opt]));}

/* ── 保存 ── */
var st;
function modeDefaults(m){var o={};o["set"+m.sfx]={reg:Object.keys(m.cats),lvl:3,hide:false,weak:false,pair:false};o["cur"+m.sfx]=null;o["st"+m.sfx]={};o["hist"+m.sfx]=[];o["cnt"+m.sfx]=0;o["streak"+m.sfx]=0;return o;}
try{st=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){st=null;}
if(!st||typeof st!=="object")st={};
if(!MODES[st.mode])st.mode="loc";
Object.keys(MODES).forEach(function(k){var m=MODES[k],d=modeDefaults(m);
  Object.keys(d).forEach(function(x){if(st[x]===undefined||st[x]===null&&x.indexOf("cur")!==0)st[x]=d[x];});
  var s=st["set"+m.sfx];Object.keys(d["set"+m.sfx]).forEach(function(x){if(s[x]===undefined)s[x]=d["set"+m.sfx][x];});
  s.reg=s.reg.filter(function(r){return m.cats[r];});
  var c=st["cur"+m.sfx];if(c&&!m.by[c.id])st["cur"+m.sfx]=null;
});
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function M(){return MODES[st.mode];}
function G(k){return st[k+M().sfx];}
function P(k,v){st[k+M().sfx]=v;}
function label(id,side){var s=M().by[id];return fill(s.name,s.lat?side:null);}

/* ── 症例の組み立て ── */
function pool(){
  var m=M(),set=G("set");
  var c=m.items.filter(function(s){return set.reg.indexOf(catOf(s))>=0&&s.lvl<=set.lvl;});
  if(m.two&&set.pair)c=m.items.filter(function(s){return !!s.pair;});
  return c;
}
function makeCase(id,side,fixedF){
  var m=M(),s=m.by[id];
  side=s.lat?(side||(Math.random()<.5?"L":"R")):null;
  var F=allF(s),req=[],optc=[];
  F.forEach(function(f,i){if(f.c&&f.c!==side)return;if(f.r)req.push(i);else optc.push(i);});
  var k=optc.length?Math.max(1,Math.ceil(optc.length/2)):0;
  var shown=fixedF?fixedF.slice():shuffle(req.concat(shuffle(optc).slice(0,k)));
  var opts=[{id:id,side:side}],seen={};seen[label(id,side)]=1;
  function add(o){var l=label(o.id,o.side);if(seen[l])return;seen[l]=1;opts.push(o);}
  if(m.opp&&s.lat&&hasC(s))add({id:id,side:opp(side)});
  var near=s.near.slice();
  if(m.two&&G("set").pair&&s.pair){m.items.forEach(function(x){if(x.pair===s.pair&&x.id!==s.id)near.unshift(x.id);});}
  near.forEach(function(spec){
    var p=spec.split(":"),n=m.by[p[0]];if(!n)return;
    var sd=null;
    if(n.lat){sd=p[1]==="L"||p[1]==="R"?p[1]:(p[1]==="C"?(side?opp(side):(Math.random()<.5?"L":"R")):(side||(Math.random()<.5?"L":"R")));}
    add({id:n.id,side:sd});
  });
  var pl=shuffle(m.items.filter(function(x){return catOf(x)===catOf(s);}));
  for(var i=0;opts.length<4&&i<pl.length;i++){var x=pl[i];add({id:x.id,side:x.lat?(side||"R"):null});}
  opts=[opts[0]].concat(opts.slice(1,5));
  var age=null,sex=null;
  if(!/歳代/.test(s.hx)){age=35+rnd(50);}
  if(!/女性|男性/.test(s.hx)){sex=Math.random()<.5?"男性":"女性";}
  return {id:id,side:side,f:shown,o:shuffle(opts),age:age,sex:sex,ans:null,tans:null,hint:false,reveal:!G("set").hide,no:G("cnt")+1};
}
function pickSite(){
  var c=pool();if(!c.length)return null;
  var cur=G("cur"),last=cur&&cur.id,stt=G("st"),set=G("set");
  if(c.length>1)c=c.filter(function(s){return s.id!==last;});
  var w=c.map(function(s){if(!set.weak)return 1;var r=stt[s.id];if(!r||!r.n)return 3;return 1+4*(1-r.c/r.n);});
  var sum=w.reduce(function(a,b){return a+b;},0),x=Math.random()*sum;
  for(var i=0;i<c.length;i++){x-=w[i];if(x<=0)return c[i].id;}
  return c[c.length-1].id;
}
function newQ(id,side,fixedF){
  var sid=id||pickSite();
  if(!sid){P("cur",null);save();renderQ();return;}
  P("cur",makeCase(sid,side,fixedF));save();renderQ();
  try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}
}

/* ── 図（自作の模式図） ── */
var FIGN=0;
function eyeSpec(s,side,p){
  var F=s.fig||{},k=s.lat?(p===side?"I":"C"):p,e=F[k]||{};
  return {ab:e.ab===undefined?1:e.ab,ad:e.ad===undefined?1:e.ad,up:e.up===undefined?1:e.up,dn:e.dn===undefined?1:e.dn,h:e.h||0,v:e.v||0,pt:e.pt||0,pu:e.pu||1,so:!!e.so};
}
function drawEye(cx,cy,dx,dy,pt,pr,nys,gy){
  var id="ec"+(++FIGN),lid=(pt>=0?2.4+pt*15:2.4+pt*4)-(gy>0?1.6:0),op=pt>0.5?' fill-opacity=".55"':'';
  var ix=cx+dx*8,iy=cy-dy*5;
  var h='<clipPath id="'+id+'"><ellipse cx="'+cx+'" cy="'+cy+'" rx="17" ry="10"/></clipPath>';
  h+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="17" ry="10" fill="#FFFFFF"/>';
  h+='<g clip-path="url(#'+id+')"><circle cx="'+ix.toFixed(1)+'" cy="'+iy.toFixed(1)+'" r="7" fill="#7A6248"/><circle cx="'+ix.toFixed(1)+'" cy="'+iy.toFixed(1)+'" r="'+pr.toFixed(1)+'" fill="#111"/>';
  h+='<rect x="'+(cx-18)+'" y="'+(cy-11)+'" width="36" height="'+(lid+1).toFixed(1)+'" fill="#E2C2A0"'+op+'/>';
  h+='<line x1="'+(cx-18)+'" x2="'+(cx+18)+'" y1="'+(cy-10+lid).toFixed(1)+'" y2="'+(cy-10+lid).toFixed(1)+'" stroke="#8A6A4E" stroke-width="1.2"/></g>';
  h+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="17" ry="10" fill="none" stroke="#6B7280" stroke-width="1"/>';
  if(nys){var sx=cx+nys*21;h+='<path d="M'+sx+' '+(cy-6)+' l'+(nys*4)+' 3 l'+(-nys*4)+' 3 l'+(nys*4)+' 3 l'+(-nys*4)+' 3" fill="none" stroke="#B42318" stroke-width="1.6"/>';}
  return h;
}
function figMot(s,side){
  var F=s.fig,Iv=side?(side==="R"?-1:1):0,semi=0,h='<svg viewBox="0 0 330 160" role="img" aria-label="9方向の眼位の模式図">';
  for(var r=0;r<3;r++)for(var c=0;c<3;c++){
    var gx=c-1,gy=1-r,px=55+110*c,py=27+52*r;
    h+='<rect x="'+(px-52)+'" y="'+(py-23)+'" width="104" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity=".18"/>';
    ["R","L"].forEach(function(p){
      var e=eyeSpec(s,side,p),abDir=p==="R"?-1:1,ex=p==="R"?px-25:px+25;
      var mH=1;if(gx!==0){mH=gx===abDir?e.ab:e.ad;if(F.lockI&&gx===Iv)mH=0;if(F.lockC&&gx===-Iv)mH=0;}
      var dx=gx*mH,mV=gy>0?e.up:(gy<0?e.dn:1);
      var add=gx===-abDir;
      if(e.so&&gy<0)mV=add?0.2:0.7;
      var dy=gy*mV+e.v+(e.so&&add?0.12:0);
      dx+=e.h*abDir+(F.devI||0)*Iv;
      dx=Math.max(-1.2,Math.min(1.2,dx));dy=Math.max(-1.2,Math.min(1.2,dy));
      var ny=0;if(F.nys&&gx===abDir){var who=F.nys[0],k=s.lat?(p===side?"I":"C"):p;if(who==="B"||who===k)ny=abDir;}
      h+=drawEye(ex,py,dx,dy,e.pt,2.6*e.pu,ny,gy);if(e.pt>0.5)semi=1;
    });
  }
  return h+'</svg><p class="cap">検者から見た9方向（左上の枠＝患者が右上を見たとき）。図の左側の眼が患者の右眼。'+(F.nys?'赤い波線は眼振。':'')+(semi?'下垂した眼瞼は、眼位が見えるよう半透明で描いています。':'')+'</p>';
}
function figPup(s,side){
  var h='<svg viewBox="0 0 330 72" role="img" aria-label="明所と暗所の瞳孔の模式図">';
  [["明るい所","l",0],["暗い所","d",165]].forEach(function(g){
    var ox=g[2];h+='<text x="'+(ox+82)+'" y="12" text-anchor="middle" font-size="11" fill="currentColor">'+g[0]+'</text>';
    ["R","L"].forEach(function(p){
      var k=s.lat?(p===side?"I":"C"):p,e=(s.fig[k]||{}),mm=e[g[1]]||(g[1]==="l"?2.5:4.6),cx=ox+(p==="R"?52:112);
      h+=drawEye(cx,42,0,0,e.pt||0,Math.min(6.6,mm*1.25),0).replace(/r="7" fill="#7A6248"/,'r="8.2" fill="#7A6248"');
    });
  });
  return h+'</svg><p class="cap">検者から見た図（左側の眼が患者の右眼）。数字の目安：明所の正常瞳孔 約2.5mm、暗所 約4.5mm（模式図）。</p>';
}
function sector(cx,cy,r,a0,a1){
  function pt(a){var t=a*Math.PI/180;return (cx+r*Math.cos(t)).toFixed(1)+" "+(cy-r*Math.sin(t)).toFixed(1);}
  return 'M'+cx+' '+cy+' L'+pt(a0)+' A'+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 0 '+pt(a1)+' Z';
}
function figVf(s,side){
  var F=s.fig,R=50,h='<svg viewBox="0 0 330 138" role="img" aria-label="視野の模式図">';
  [["L","左眼",85],["R","右眼",245]].forEach(function(g){
    var p=g[0],cx=g[2],cy=72,k=s.lat?(p===side?"I":"C"):p,toks=F[k]||[];
    h+='<text x="'+cx+'" y="13" text-anchor="middle" font-size="11" fill="currentColor">'+g[1]+'</text>';
    h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="#FFFFFF" stroke="#6B7280"/>';
    toks.forEach(function(t){
      var base=t.replace(/s$/,""),small=/s$/.test(t),f=base.charAt(0),rest=base.slice(1),fs;
      if(f==="C"&&rest==="0"){h+='<circle cx="'+cx+'" cy="'+cy+'" r="13" fill="#374151"/>';return;}
      fs=f==="C"?opp(side):f==="I"?side:f==="T"?p:f==="N"?opp(p):null;
      if(!fs)return;var L=fs==="L";
      if(rest==="c"){h+='<path d="'+(L?sector(cx,cy,17,90,270):sector(cx,cy,17,-90,90))+'" fill="#374151"/>';return;}
      var a0,a1;
      if(rest==="h"||rest===""){a0=L?90:-90;a1=L?270:90;}
      else if(rest==="U"){a0=L?90:0;a1=L?180:90;}
      else if(rest==="L"){a0=L?180:270;a1=L?270:360;if(small){a0=L?225:270;a1=L?270:315;}}
      h+='<path d="'+sector(cx,cy,R,a0,a1)+'" fill="#374151"/>';
    });
    if(F.spare)h+='<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="#FFFFFF"/>';
    h+='<line x1="'+(cx-R)+'" x2="'+(cx+R)+'" y1="'+cy+'" y2="'+cy+'" stroke="#9CA3AF" stroke-width=".6"/><line x1="'+cx+'" x2="'+cx+'" y1="'+(cy-R)+'" y2="'+(cy+R)+'" stroke="#9CA3AF" stroke-width=".6"/><circle cx="'+cx+'" cy="'+cy+'" r="1.8" fill="#B42318"/>';
  });
  return h+'</svg><p class="cap">患者から見た視野（左の円が左眼、円の左側が左の視野）。黒が欠損、赤い点が固視点。</p>';
}
function figure(s,side){
  if(!s.fig)return "";
  var f=s.fig.t==="mot"?figMot(s,side):s.fig.t==="pup"?figPup(s,side):figVf(s,side);
  return '<div class="fig">'+f+'</div>';
}

/* ── 出題画面 ── */
var qArea=document.getElementById("qArea");
function lvDots(n){return "●●●".slice(0,n)+"○○○".slice(0,3-n);}
function renderQ(){
  var m=M(),q=G("cur");
  if(!q){
    var c=pool().length;
    qArea.innerHTML='<div class="card"><h2>はじめる（'+esc(m.title)+'モード）</h2><p class="hint" style="font-size:14px">出題範囲：'+c+m.unit+'。'+esc(m.hint)+'</p><div class="nav"><button class="btn primary" type="button" id="goQ"'+(c?'':' disabled')+'>問題を出す</button></div>'+(c?'':'<p class="hint">出題範囲が空です。設定で系統を選んでください。</p>')+'</div>';
    var g=document.getElementById("goQ");if(g)g.onclick=function(){newQ();};
    return;
  }
  var s=m.by[q.id],F=allF(s),side=q.side,done=m.two?(q.tans!==null||q.ans&&q.ans.k<0):!!q.ans;
  var who=[];if(q.age)who.push(q.age+"歳");if(q.sex)who.push(q.sex);
  var h='<div class="card"><div class="qhead"><span>第'+q.no+'問</span><span class="lv" title="難易度">'+lvDots(s.lvl)+'</span>'+((q.hint||q.ans)?'<span class="regtag">'+esc(m.cats[catOf(s)])+'</span>':'')+'</div>';
  h+='<p class="pt">'+(who.length?esc(who.join("・"))+"。":"")+esc(fill(s.hx,side))+'</p>';
  h+='<ul class="fd">'+q.f.map(function(i){return '<li>'+esc(fill(F[i].t,side))+'</li>';}).join("")+'</ul>';
  if(m.fig)h+=figure(s,side);
  h+='<p class="ask">'+esc(m.ask)+'</p>';
  if(!q.reveal&&!q.ans){
    h+='<div class="nav"><button class="btn primary" type="button" id="revBtn">考えたら選択肢を表示</button></div>';
  }else{
    h+='<div class="opts">'+q.o.map(function(o,k){
      var cls="";
      if(q.ans){if(label(o.id,o.side)===label(q.id,q.side))cls=" ok";else if(k===q.ans.k)cls=" ng";}
      return '<button type="button" class="opt'+cls+'" data-k="'+k+'"'+(q.ans?' disabled':'')+'><span class="n">'+(k+1)+'</span><span>'+esc(label(o.id,o.side))+'</span></button>';
    }).join("")+'</div>';
  }
  if(m.two&&q.ans&&q.ans.k>=0){
    h+='<div class="step2"><p class="ask" style="margin-top:0">② 梗塞の型はどれか？</p><div class="types">'+Object.keys(VTYPES).map(function(t){
      var cls="";if(q.tans!==null){if(t===s.type)cls=" ok";else if(t===q.tans)cls=" ng";}
      return '<button type="button" class="opt'+cls+'" data-t="'+t+'"'+(q.tans!==null?' disabled':'')+'>'+esc(VTYPES[t])+'</button>';
    }).join("")+'</div></div>';
  }
  if(!done){
    h+='<div class="nav"><button class="btn sm" type="button" id="hintBtn"'+(q.hint?' disabled':'')+'>ヒント（系統）</button><button class="btn sm" type="button" id="giveBtn">わからない（解説へ）</button><button class="btn sm" type="button" id="skipBtn">別の問題</button></div>';
  }
  h+='</div>';
  if(done)h+=explain(q);
  qArea.innerHTML=h;
  var b;
  if((b=document.getElementById("revBtn")))b.onclick=function(){q.reveal=true;save();renderQ();};
  if((b=document.getElementById("hintBtn")))b.onclick=function(){q.hint=true;save();renderQ();};
  if((b=document.getElementById("giveBtn")))b.onclick=function(){answer(-1);};
  if((b=document.getElementById("skipBtn")))b.onclick=function(){newQ();};
  Array.prototype.forEach.call(qArea.querySelectorAll(".opt[data-k]"),function(el){el.onclick=function(){answer(+el.getAttribute("data-k"));};});

<script>
(function(){
  var KEYS=[{"k":"ltr-v1","keep":["st","hist","cnt","st_vas","hist_vas","cnt_vas","st_eye","hist_eye","cnt_eye"]}];

  var btn=document.getElementById("wcClrBtn"),dlg=document.getElementById("wcClrDlg");

    try{
      var ls=window.localStorage,orig=ls.setItem.bind(ls);

    });}catch(e){}
