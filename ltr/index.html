<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>神経局在トレーニング</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F766E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="局在トレーニング">
<style>
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#1A2422; --muted:#5A6865; --line:#D9E2DF;
  --accent:#0F766E; --accent-strong:#0B5650; --accent-soft:#E1F2EF; --on-accent:#FFFFFF;
  --ok:#2E7D4F; --ok-soft:#E3F3E9; --ng:#B42318; --ng-soft:#FDE8E6; --warn-soft:#FFF4DB;
  --font:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif; --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121716; --surface:#1B2220; --ink:#E7EEEC; --muted:#9FB0AC; --line:#2D3835;
    --accent:#2DBFAF; --accent-strong:#6FDCCF; --accent-soft:#16332F; --on-accent:#06201D;
    --ok:#5CC48A; --ok-soft:#163323; --ng:#F27A6E; --ng-soft:#3B1C1A; --warn-soft:#3A3017; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:680px;margin:0 auto;padding:0 calc(14px + env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:50%;border:5px solid var(--accent);flex:none}
.brand h1{font-size:19px;font-weight:900}
.brand small{color:var(--muted);font-size:11px;margin-left:auto;text-align:right;line-height:1.3}
.summary{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 9px}
.tile .k{font-size:11px;color:var(--muted);display:block}
.tile .v{font-size:17px;font-weight:700;display:block}
section.view{display:none;padding-top:12px}
section.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:6px}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
details.set>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary::after{content:"＋";margin-left:auto;color:var(--muted);font-weight:400}
details.set[open]>summary::after{content:"－"}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer;background:var(--bg);user-select:none}
.chip input{margin:0;accent-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:44px}
input[type=search]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-height:44px}
.sw{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
/* 出題 */
.qhead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.lv{letter-spacing:1px;color:var(--accent)}
.regtag{margin-left:auto;background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:1px 10px;font-weight:700}
.pt{font-size:15.5px;margin:0 0 8px}
ul.fd{margin:0;padding:0;list-style:none}
ul.fd li{position:relative;padding:7px 0 7px 18px;border-top:1px dashed var(--line);font-size:15.5px;line-height:1.5}
ul.fd li:first-child{border-top:0}
ul.fd li::before{content:"";position:absolute;left:3px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ask{font-weight:700;margin:12px 0 8px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;font-size:15.5px;line-height:1.45;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:11px 12px;min-height:48px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.result{border-radius:10px;padding:9px 12px;font-weight:700;margin-bottom:10px}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.ng{background:var(--ng-soft);color:var(--ng)}
.result .ans{display:block;color:var(--ink);font-size:17px;margin-top:2px}
.result .syn{display:block;color:var(--muted);font-weight:400;font-size:13.5px}
.ex h3{font-size:14.5px;margin:12px 0 4px;color:var(--accent-strong)}
.why{margin:0;padding:0;list-style:none}
.why li{padding:7px 0;border-top:1px dashed var(--line);font-size:15px;line-height:1.5}
.why li:first-child{border-top:0}
.why .f{display:block}
.why .w{display:block;color:var(--muted);font-size:13.5px;padding-left:1.2em;text-indent:-1.2em}
.why .w::before{content:"→ ";color:var(--accent)}
.why .dn{font-weight:700;display:block}
.pearl{background:var(--warn-soft);border-radius:10px;padding:9px 12px;font-size:14.5px;margin-top:12px}
.pearl b{display:block;font-size:13px;color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nav .btn{flex:1 1 140px}
/* 一覧 */
details.site{border-top:1px solid var(--line)}
details.site:first-of-type{border-top:0}
details.site>summary{cursor:pointer;padding:9px 0;list-style:none}
details.site>summary::-webkit-details-marker{display:none}
details.site>summary b{display:block;font-size:15px}
details.site>summary span{display:block;font-size:13px;color:var(--muted)}
.lvb{font-size:11px;color:var(--accent);margin-left:6px;font-weight:400}
.sub{font-size:12.5px;color:var(--muted);margin:8px 0 2px;font-weight:700}
/* 成績 */
table.st{width:100%;border-collapse:collapse;font-size:14.5px}
table.st td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.st td.num{text-align:right;white-space:nowrap;width:1%}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);font-size:14px}
/* タブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.tabs .in{display:flex;max-width:680px;width:100%}
nav.tabs button{flex:1;font:inherit;font-size:13px;background:none;border:0;color:var(--muted);padding:9px 0 10px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:20;display:none;max-width:90%}
.toast.on{display:block}
.foot{font-size:11.5px;color:var(--muted);margin:16px 2px 0}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>神経局在トレーニング</h1><small>症候から病巣を当てる<br>病棟アプリ</small></div>
  <div class="summary">
    <div class="tile"><span class="k">回答数</span><span class="v" id="sN">0</span></div>
    <div class="tile"><span class="k">正答率</span><span class="v" id="sR">—</span></div>
    <div class="tile"><span class="k">連続正解</span><span class="v" id="sS">0</span></div>
  </div>
</header>

<section class="view active" id="v-q" aria-label="出題">
  <details class="card set" id="setBox">
    <summary>出題範囲・設定 <span class="hint" id="setSum" style="margin:0 0 0 4px"></span></summary>
    <div class="chips" id="regChips"></div>
    <div class="row"><button class="btn sm" id="regAll" type="button">すべて</button><button class="btn sm" id="regNone" type="button">すべて外す</button></div>
    <div class="row" style="margin-top:10px">
      <label for="lvSel" style="font-size:14px">難易度</label>
      <select id="lvSel"><option value="1">基本のみ</option><option value="2">標準まで</option><option value="3">応用まで（すべて）</option></select>
    </div>
    <label class="sw"><input type="checkbox" id="hideOpt">選択肢を隠して、先に自分で考える</label>
    <label class="sw"><input type="checkbox" id="weakOpt">間違えた部位・まだ解いていない部位を優先</label>
    <p class="hint">症例は部位ごとの所見から毎回組み立てます（左右・提示する所見・年齢が変わります）。</p>
  </details>
  <div id="qArea"></div>
</section>

<section class="view" id="v-a" aria-label="部位一覧">
  <div class="card">
    <h2>部位一覧（局在の要点）</h2>
    <input type="search" id="aQ" placeholder="部位名・所見で絞り込み（例：Horner、下垂足）" aria-label="絞り込み">
    <p class="hint">「同側」「対側」は病巣からみた側です。各部位から、その部位の問題を出せます。</p>
  </div>
  <div id="aList"></div>
</section>

<section class="view" id="v-s" aria-label="成績">
  <div id="sArea"></div>
</section>

<p class="foot">自分用の学習ツールです。所見の組み合わせは典型例の要約で、実際の症例では画像・経過で確認してください。入力と成績はこの端末内にのみ保存されます。</p>
</div>

<nav class="tabs" role="tablist" aria-label="画面切替"><div class="in">
  <button role="tab" aria-selected="true" data-v="v-q" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.2v.1"/></svg>出題</button>
  <button role="tab" aria-selected="false" data-v="v-a" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>一覧</button>
  <button role="tab" aria-selected="false" data-v="v-s" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>成績</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
/* 出題データ
   name/hx の {S}=病巣側、所見の {I}=病巣と同側、{C}=病巣と反対側。
   所見は [所見, 局在上の意味, (任意)病巣側条件 "L"/"R"]。
   near は誤答選択肢にする近い部位。":C" は病巣と反対側、":L"/":R" は側を固定、無指定は同側（非側性の正解ならランダム）。 */
const REGIONS = {
  cx: "大脳皮質・皮質下",
  dc: "基底核・視床・内包",
  bs: "脳幹",
  cb: "小脳",
  cn: "脳神経・眼球運動",
  vis: "視覚路",
  sc: "脊髄",
  rt: "神経根・神経叢",
  pn: "末梢神経",
  nm: "神経筋接合部・筋・びまん性"
};
const SITES = [
/* ───── 大脳 ───── */
{id:"cx_broca",reg:"cx",lvl:1,name:"左下前頭回後部（Broca野）〜中心前回下部",
 hx:"心房細動で抗凝固薬を自己中断していた。会話中に突然言葉が出なくなった。",
 req:[["発語が少なく努力性でたどたどしい（非流暢）。単語レベルの理解は比較的保たれる","非流暢＋理解比較的保持＝前方（運動性）失語。優位半球下前頭回後部"],
      ["復唱も障害される","復唱障害があるので超皮質性失語ではなくBroca型"],
      ["右顔面下部と右上肢の筋力低下（下肢は軽度）","顔・上肢優位＝中心前回外側（中大脳動脈上枝領域）。下肢領域は内側で保たれやすい"]],
 opt:[["自分の言い誤りに気づき、もどかしそうにする","病識の保持はBroca型の特徴"],
      ["発症直後は両眼が左へ共同偏視","前頭眼野の障害で眼は病巣側を向く"],
      ["右手で書く文も文法が崩れる（失書）","失語には書字障害を伴う"]],
 near:["cx_wernicke","cx_cond","dc_ic:L","cx_aca:L"],
 sig:"非流暢・復唱障害＋右顔面・上肢優位の麻痺",
 pearl:"失語の型は『流暢性・理解・復唱』の3軸で分ける。復唱が保たれれば超皮質性（分水嶺・前大脳動脈領域）を考える。"},
{id:"cx_wernicke",reg:"cx",lvl:1,name:"左上側頭回後部（Wernicke野）",
 hx:"高血圧の既往。家族が『話がかみ合わない』と連れて来た。",
 req:[["多弁で流暢だが内容が乏しく、錯語・新造語が多い","流暢＋錯語＝後方（感覚性）失語"],
      ["口頭命令の理解が著しく悪く、復唱もできない","理解障害＋復唱障害＝Wernicke型（優位半球上側頭回後部）"],
      ["四肢の麻痺はない","中心前回・内包から離れた後方病変。麻痺がないため精神疾患・せん妄と誤られやすい"]],
 opt:[["本人は困っている様子がない（病識の欠如）","Wernicke失語の特徴"],
      ["右上1/4の同名性視野欠損","側頭葉を通るMeyer係蹄の障害（対側上四分盲）"]],
 near:["cx_broca","cx_cond","cx_angular","vis_meyer:L"],
 sig:"流暢・理解障害・復唱障害、麻痺なし",
 pearl:"急な『錯乱』に見えて麻痺がない時は流暢性失語を疑い、命令理解と復唱を確かめる。"},
{id:"cx_cond",reg:"cx",lvl:3,name:"左縁上回〜弓状束（伝導失語）",
 hx:"脂質異常症の既往。急に言い間違いが増えた。",
 req:[["流暢に話し、理解は良好","流暢＋理解保持で、Broca野・Wernicke野は保たれる"],
      ["復唱が著しく障害され、音韻性錯語（『とけい』→『とてい』）が目立つ","復唱の選択的障害＝伝導失語（縁上回皮質下・弓状束）"],
      ["言い誤りを自分で何度も修正しようとする（接近行為）","音韻の自己修正は伝導失語の特徴"]],
 opt:[["右上肢の軽い感覚低下","中心後回下部・頭頂弁蓋部の近傍"],
      ["口・舌の観念運動失行","縁上回近傍の病変で合併しやすい"]],
 near:["cx_broca","cx_wernicke","cx_angular","cx_aca:L"],
 sig:"流暢・理解良好・復唱だけ障害",
 pearl:"復唱だけが障害されるのが伝導失語、逆に復唱だけ保たれるのが超皮質性失語。"},
{id:"cx_angular",reg:"cx",lvl:2,name:"左角回（下頭頂小葉）",
 hx:"右利き。計算ができず、字が書けないと訴えて受診。",
 req:[["失書（字が思い出せない）","優位半球角回"],
      ["失算","Gerstmann症候群の一つ"],
      ["手指の名前を言えず指せない（手指失認）","Gerstmann症候群の一つ"],
      ["左右の区別ができない","4徴がそろえば優位半球角回"]],
 opt:[["読字も障害される（失読失書）","角回は文字の形と音・意味をつなぐ"],
      ["四肢の麻痺・感覚障害はない","中心前回・中心後回から離れた病変"]],
 near:["cx_wernicke","cx_rpar","cx_pca:L","cx_cond"],
 sig:"失書・失算・手指失認・左右失認（Gerstmann）",
 pearl:"失読失書は左角回、書字が保たれる純粋失読は左後頭葉＋脳梁膨大。"},
{id:"cx_rpar",reg:"cx",lvl:1,name:"右下頭頂小葉（劣位半球頭頂葉）",
 hx:"高血圧の既往。食事で左側の皿だけ手をつけないことに家族が気づいた。",
 req:[["左半側空間無視（線分二等分で右へ偏る、左側を見落とす）","劣位（右）半球の頭頂葉・側頭頭頂接合部"],
      ["左片麻痺があっても『動く』と言う（病態失認）","右頭頂葉病変で生じやすい"]],
 opt:[["着衣失行（服の左右・裏表がわからない）","劣位半球頭頂葉"],
      ["両側同時に触れると左を感じない（消去現象）","頭頂葉の注意障害"],
      ["左下1/4の同名性視野欠損","頭頂葉を通る視放線上部（対側下四分盲）"],
      ["立方体の模写ができない（構成障害）","右頭頂葉で目立つ"]],
 near:["cx_angular","cx_pca:R","dc_thal:R","dc_put:R"],
 sig:"左半側空間無視・病態失認・着衣失行",
 pearl:"無視は右半球病変で目立ち、左半球病変の右無視は軽く短い。左同名半盲（後頭葉）とは、注意を向けさせると見えるかどうかで区別する。"},
{id:"cx_handknob",reg:"cx",lvl:3,lat:1,name:"{S}中心前回の手の領域（hand knob）",
 hx:"高血圧・喫煙歴。朝から{C}手の指が動かしにくい。",

  if(side) return t.replace(/\{S\}|\{I\}/g,SIDE[side]).replace(/\{C\}/g,SIDE[opp(side)]);
  return t.replace(/\{S\}/g,"").replace(/\{I\}/g,"同側").replace(/\{C\}/g,"対側");
}

    add({id:n.id,side:sd});
  });
  var pool=shuffle(SITES.filter(function(x){return x.reg===s.reg;}));
  for(var i=0;opts.length<4&&i<pool.length;i++){var x=pool[i];add({id:x.id,side:x.lat?(side||"R"):null});}
  opts=[opts[0]].concat(opts.slice(1,5));
  var age=null,sex=null;
  if(!/歳代/.test(s.hx)){age=35+rnd(50);}
  if(!/女性|男性/.test(s.hx)){sex=Math.random()<.5?"男性":"女性";}
  return {id:id,side:side,f:shown,o:shuffle(opts),age:age,sex:sex,ans:null,hint:false,reveal:!st.set.hide,no:st.cnt+1};
}
function pickSite(){
  var c=SITES.filter(function(s){return st.set.reg.indexOf(s.reg)>=0&&s.lvl<=st.set.lvl;});
  if(!c.length)return null;
  var last=st.cur&&st.cur.id;
  if(c.length>1)c=c.filter(function(s){return s.id!==last;});
  var w=c.map(function(s){if(!st.set.weak)return 1;var r=st.st[s.id];if(!r||!r.n)return 3;return 1+4*(1-r.c/r.n);});
  var sum=w.reduce(function(a,b){return a+b;},0),x=Math.random()*sum;
  for(var i=0;i<c.length;i++){x-=w[i];if(x<=0)return c[i].id;}
  return c[c.length-1].id;
}
function newQ(id,side,fixedF){
  var sid=id||pickSite();
  if(!sid){st.cur=null;save();renderQ();return;}
  st.cur=makeCase(sid,side,fixedF);save();renderQ();
  try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}
}

/* ── 出題画面 ── */
var qArea=document.getElementById("qArea");
function lvDots(n){return "●●●".slice(0,n)+"○○○".slice(0,3-n);}
function renderQ(){
  var q=st.cur;
  if(!q){
    var c=SITES.filter(function(s){return st.set.reg.indexOf(s.reg)>=0&&s.lvl<=st.set.lvl;}).length;
    qArea.innerHTML='<div class="card"><h2>はじめる</h2><p class="hint" style="font-size:14px">出題範囲：'+c+'部位。症候を読み、病巣部位を選んでください。答えると、所見ごとの局在の意味と、ほかの選択肢との違いを解説します。</p><div class="nav"><button class="btn primary" type="button" id="goQ"'+(c?'':' disabled')+'>問題を出す</button></div>'+(c?'':'<p class="hint">出題範囲が空です。設定で系統を選んでください。</p>')+'</div>';
    var g=document.getElementById("goQ");if(g)g.onclick=function(){newQ();};
    return;
  }
  var s=byId[q.id],F=allF(s),side=q.side;
  var who=[];if(q.age)who.push(q.age+"歳");if(q.sex)who.push(q.sex);
  var h='<div class="card"><div class="qhead"><span>第'+q.no+'問</span><span class="lv" title="難易度">'+lvDots(s.lvl)+'</span>'+((q.hint||q.ans)?'<span class="regtag">'+esc(REGIONS[s.reg])+'</span>':'')+'</div>';
  h+='<p class="pt">'+(who.length?esc(who.join("・"))+"。":"")+esc(fill(s.hx,side))+'</p>';
  h+='<ul class="fd">'+q.f.map(function(i){return '<li>'+esc(fill(F[i].t,side))+'</li>';}).join("")+'</ul>';
  h+='<p class="ask">病巣はどこか？</p>';
  if(!q.reveal&&!q.ans){
    h+='<div class="nav"><button class="btn primary" type="button" id="revBtn">考えたら選択肢を表示</button></div>';
  }else{
    h+='<div class="opts">'+q.o.map(function(o,k){
      var cls="";
      if(q.ans){if(o.id===q.id&&o.side===q.side)cls=" ok";else if(k===q.ans.k)cls=" ng";}
      return '<button type="button" class="opt'+cls+'" data-k="'+k+'"'+(q.ans?' disabled':'')+'><span class="n">'+(k+1)+'</span><span>'+esc(label(o.id,o.side))+'</span></button>';
    }).join("")+'</div>';
  }
  if(!q.ans){
    h+='<div class="nav"><button class="btn sm" type="button" id="hintBtn"'+(q.hint?' disabled':'')+'>ヒント（系統）</button><button class="btn sm" type="button" id="giveBtn">わからない（解説へ）</button><button class="btn sm" type="button" id="skipBtn">別の問題</button></div>';
  }
  h+='</div>';
  if(q.ans)h+=explain(q);
  qArea.innerHTML=h;
  var b;
  if((b=document.getElementById("revBtn")))b.onclick=function(){q.reveal=true;save();renderQ();};
  if((b=document.getElementById("hintBtn")))b.onclick=function(){q.hint=true;save();renderQ();};
  if((b=document.getElementById("giveBtn")))b.onclick=function(){answer(-1);};
  if((b=document.getElementById("skipBtn")))b.onclick=function(){newQ();};
  Array.prototype.forEach.call(qArea.querySelectorAll(".opt"),function(el){el.onclick=function(){answer(+el.getAttribute("data-k"));};});
  if((b=document.getElementById("nextBtn")))b.onclick=function(){newQ();};
  if((b=document.getElementById("sameBtn")))b.onclick=function(){newQ(q.id,s.lat?opp(q.side):null);};
}
function answer(k){
  var q=st.cur;if(!q||q.ans)return;
  var ok=k>=0&&q.o[k].id===q.id&&q.o[k].side===q.side;
  q.ans={k:k,ok:ok};q.reveal=true;
  var r=st.st[q.id]||(st.st[q.id]={n:0,c:0});r.n++;if(ok)r.c++;
  st.cnt++;st.streak=ok?st.streak+1:0;
  st.hist.unshift({id:q.id,side:q.side,f:q.f,ok:ok,t:Date.now()});
  if(st.hist.length>60)st.hist.length=60;
  save();renderQ();renderTop();
  setTimeout(function(){var e=document.getElementById("exCard");if(e)try{e.scrollIntoView({behavior:"smooth",block:"start"});}catch(x){}},60);
}
function explain(q){
  var s=byId[q.id],F=allF(s),side=q.side;
  var h='<div class="card ex" id="exCard">';
  h+='<div class="result '+(q.ans.ok?'ok':'ng')+'">'+(q.ans.ok?'正解':(q.ans.k<0?'解説':'不正解'))+'<span class="ans">'+esc(label(q.id,side))+'</span><span class="syn">'+esc(s.sig)+'</span></div>';
  h+='<h3>所見ごとの局在の意味</h3><ul class="why">'+q.f.map(function(i){return '<li><span class="f">'+esc(fill(F[i].t,side))+'</span><span class="w">'+esc(fill(F[i].w,side))+'</span></li>';}).join("")+'</ul>';
  var others=q.o.filter(function(o){return !(o.id===q.id&&o.side===q.side);});
  if(others.length){
    var ipsi=null;q.f.some(function(i){if(/\{I\}/.test(F[i].t)){ipsi=fill(F[i].t,side);return true;}return false;});
    h+='<h3>ほかの選択肢との違い</h3><ul class="why">'+others.map(function(o){
      var t;
      if(o.id===q.id)t="同じ部位で左右が逆。"+(ipsi?"病巣と同じ側に出る所見（「"+ipsi+"」）から側を決める。":"所見の左右から病巣側を決める。");
      else t="この部位なら："+byId[o.id].sig;
      return '<li><span class="dn">'+esc(label(o.id,o.side))+'</span><span class="w">'+esc(t)+'</span></li>';
    }).join("")+'</ul>';
  }
  var rest=F.map(function(f,i){return i;}).filter(function(i){return q.f.indexOf(i)<0&&(!F[i].c||F[i].c===side);});
  if(rest.length)h+='<h3>この部位でほかにみられる所見</h3><ul class="why">'+rest.map(function(i){return '<li><span class="f">'+esc(fill(F[i].t,side))+'</span><span class="w">'+esc(fill(F[i].w,side))+'</span></li>';}).join("")+'</ul>';
  h+='<div class="pearl"><b>ポイント</b>'+esc(s.pearl)+'</div>';
  h+='<div class="nav"><button class="btn primary" type="button" id="nextBtn">次の問題</button><button class="btn" type="button" id="sameBtn">'+(s.lat?'同じ部位を反対側で':'同じ部位をもう一度')+'</button></div>';
  return h+'</div>';
}

/* ── 設定 ── */
var regChips=document.getElementById("regChips");
function renderSet(){
  regChips.innerHTML=REGKEYS.map(function(k){var on=st.set.reg.indexOf(k)>=0;var n=SITES.filter(function(s){return s.reg===k;}).length;
    return '<label class="chip'+(on?' on':'')+'"><input type="checkbox" data-r="'+k+'"'+(on?' checked':'')+'>'+esc(REGIONS[k])+'<span class="hint" style="margin:0">'+n+'</span></label>';}).join("");
  Array.prototype.forEach.call(regChips.querySelectorAll("input"),function(el){el.onchange=function(){
    var k=el.getAttribute("data-r"),i=st.set.reg.indexOf(k);
    if(el.checked&&i<0)st.set.reg.push(k);if(!el.checked&&i>=0)st.set.reg.splice(i,1);
    save();renderSet();if(!st.cur)renderQ();};});
  document.getElementById("lvSel").value=String(st.set.lvl);

}
document.getElementById("regAll").onclick=function(){st.set.reg=REGKEYS.slice();save();renderSet();if(!st.cur)renderQ();};
document.getElementById("regNone").onclick=function(){st.set.reg=[];save();renderSet();if(!st.cur)renderQ();};
document.getElementById("lvSel").onchange=function(){st.set.lvl=+this.value;save();renderSet();if(!st.cur)renderQ();};
document.getElementById("hideOpt").onchange=function(){st.set.hide=this.checked;save();};
document.getElementById("weakOpt").onchange=function(){st.set.weak=this.checked;save();};

/* ── 一覧 ── */
var aList=document.getElementById("aList"),aQ=document.getElementById("aQ");
function siteText(s){return [s.name,s.sig,s.pearl].concat(s.req.map(function(f){return f[0]+f[1];}),s.opt.map(function(f){return f[0]+f[1];})).join(" ");}
function renderAtlas(){
  var q=aQ.value.trim();
  var h="";
  REGKEYS.forEach(function(k){
    var list=SITES.filter(function(s){return s.reg===k&&(!q||siteText(s).indexOf(q)>=0||fillAtlas(siteText(s)).indexOf(q)>=0);});
    if(!list.length)return;
    h+='<div class="card"><h2>'+esc(REGIONS[k])+'</h2>'+list.map(function(s){
      var r=st.st[s.id];
      return '<details class="site"><summary><b>'+esc(fillAtlas(s.name))+'<span class="lvb">'+lvDots(s.lvl)+(r&&r.n?'　'+r.c+'/'+r.n:'')+'</span></b><span>'+esc(s.sig)+'</span></summary>'+
        '<div class="sub">必須の所見</div><ul class="why">'+s.req.map(function(f){return '<li><span class="f">'+esc(fillAtlas(f[0]))+'</span><span class="w">'+esc(fillAtlas(f[1]))+'</span></li>';}).join("")+'</ul>'+
        (s.opt.length?'<div class="sub">伴いうる所見</div><ul class="why">'+s.opt.map(function(f){return '<li><span class="f">'+esc(fillAtlas(f[0]))+(f[2]?'（'+SIDE[f[2]]+'病変）':'')+'</span><span class="w">'+esc(fillAtlas(f[1]))+'</span></li>';}).join("")+'</ul>':'')+
        '<div class="pearl"><b>ポイント</b>'+esc(s.pearl)+'</div><div class="nav"><button class="btn sm" type="button" data-q="'+s.id+'">この部位で出題</button></div></details>';
    }).join("")+'</div>';
  });
  aList.innerHTML=h||'<div class="card empty">該当する部位がありません。</div>';
  Array.prototype.forEach.call(aList.querySelectorAll("[data-q]"),function(b){b.onclick=function(){newQ(b.getAttribute("data-q"));show("v-q");};});

/* ── 成績 ── */
var sArea=document.getElementById("sArea"),resetArm=false;
function renderStats(){
  var tot=0,cor=0;Object.keys(st.st).forEach(function(k){if(byId[k]){tot+=st.st[k].n;cor+=st.st[k].c;}});
  var h='<div class="card"><h2>系統別の正答率</h2>';
  if(!tot)h+='<p class="empty">まだ回答がありません。</p>';
  else{
    h+='<table class="st">'+REGKEYS.map(function(k){var n=0,c=0;SITES.forEach(function(s){if(s.reg===k&&st.st[s.id]){n+=st.st[s.id].n;c+=st.st[s.id].c;}});
      var p=n?Math.round(c/n*100):null;
      return '<tr><td>'+esc(REGIONS[k])+'</td><td style="width:34%"><div class="bar"><i style="width:'+(p||0)+'%"></i></div></td><td class="num">'+(n?p+'%':'—')+'</td><td class="num hint" style="margin:0">'+c+'/'+n+'</td></tr>';}).join("")+'</table>';
  }
  h+='</div>';
  var weak=Object.keys(st.st).filter(function(k){return byId[k]&&st.st[k].n&&st.st[k].c<st.st[k].n;}).sort(function(a,b){return st.st[a].c/st.st[a].n-st.st[b].c/st.st[b].n||st.st[b].n-st.st[a].n;}).slice(0,10);
  h+='<div class="card"><h2>苦手な部位</h2>'+(weak.length?'<table class="st">'+weak.map(function(k){var r=st.st[k];return '<tr><td>'+esc(fillAtlas(byId[k].name))+'</td><td class="num">'+r.c+'/'+r.n+'</td><td class="num"><button class="btn sm" type="button" data-w="'+k+'">出題</button></td></tr>';}).join("")+'</table>':'<p class="empty">間違えた部位はまだありません。</p>')+'</div>';
  var wr=st.hist.filter(function(x){return !x.ok&&byId[x.id];}).slice(0,15);
  h+='<div class="card"><h2>最近間違えた問題</h2>'+(wr.length?'<table class="st">'+wr.map(function(x,i){var d=new Date(x.t);return '<tr><td>'+esc(label(x.id,x.side))+'<span class="hint" style="display:block;margin:0">'+(d.getMonth()+1)+'/'+d.getDate()+'</span></td><td class="num"><button class="btn sm" type="button" data-h="'+i+'">同じ問題</button></td></tr>';}).join("")+'</table><p class="hint">「同じ問題」は前回と同じ所見で出題します（選択肢の順は変わります）。</p>':'<p class="empty">まだありません。</p>')+'</div>';
  h+='<div class="card"><button class="btn sm" type="button" id="resetBtn">'+(resetArm?'もう一度押すと成績を消去':'成績を消去')+'</button><p class="hint">成績と履歴だけを消します。右上の「入力クリア」は設定と出題中の問題を消し、成績は残します。</p></div>';
  sArea.innerHTML=h;
  Array.prototype.forEach.call(sArea.querySelectorAll("[data-w]"),function(b){b.onclick=function(){newQ(b.getAttribute("data-w"));show("v-q");};});
  Array.prototype.forEach.call(sArea.querySelectorAll("[data-h]"),function(b){b.onclick=function(){var x=wr[+b.getAttribute("data-h")];newQ(x.id,x.side,x.f);show("v-q");};});
  document.getElementById("resetBtn").onclick=function(){
    if(!resetArm){resetArm=true;renderStats();setTimeout(function(){resetArm=false;if(document.getElementById("v-s").classList.contains("active"))renderStats();},4000);return;}
    resetArm=false;st.st={};st.hist=[];st.cnt=0;st.streak=0;save();renderStats();renderTop();toast("成績を消去しました");
  };
}
function renderTop(){
  var tot=0,cor=0;Object.keys(st.st).forEach(function(k){tot+=st.st[k].n;cor+=st.st[k].c;});
  document.getElementById("sN").textContent=tot;
  document.getElementById("sR").textContent=tot?Math.round(cor/tot*100)+"%":"—";
  document.getElementById("sS").textContent=st.streak||0;
}

/* ── タブ ── */
var tabs=document.querySelectorAll("nav.tabs button");
function show(v){
  Array.prototype.forEach.call(document.querySelectorAll("section.view"),function(s){s.classList.toggle("active",s.id===v);});
  Array.prototype.forEach.call(tabs,function(b){b.setAttribute("aria-selected",b.getAttribute("data-v")===v?"true":"false");});

}
Array.prototype.forEach.call(tabs,function(b){b.onclick=function(){show(b.getAttribute("data-v"));};});
var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on");},2600);}
window.__ltrToast=toast;

renderSet();renderTop();renderQ();
})();

<script>
(function(){
  var KEYS=[{"k":"ltr-v1","keep":["st","hist","cnt"]}];
  try{document.querySelectorAll("header.top .brand").forEach(function(e){e.setAttribute("data-wc-pad","");if(true)e.setAttribute("data-wc-hs","");});}catch(e){}
  var btn=document.getElementById("wcClrBtn"),dlg=document.getElementById("wcClrDlg");
  function close(){dlg.classList.remove("on");}
  btn.addEventListener("click",function(){dlg.classList.add("on");document.getElementById("wcClrNo").focus();});
  document.getElementById("wcClrNo").addEventListener("click",close);
  dlg.addEventListener("click",function(e){if(e.target===dlg)close();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")close();});
  document.getElementById("wcClrYes").addEventListener("click",function(){
    try{
      var ls=window.localStorage,orig=ls.setItem.bind(ls);
      var names=[];
      KEYS.forEach(function(k){try{
        if(typeof k==="string"){ls.removeItem(k);names.push(k);return;}
        /* 保存した記録・ケースなど keep に挙げた項目は残し、入力だけ消す */
        var o=null;try{o=JSON.parse(ls.getItem(k.k)||"null");}catch(e){}
        var n={};if(o&&k.keep)k.keep.forEach(function(f){if(f in o)n[f]=o[f];});
        if(Object.keys(n).length)orig(k.k,JSON.stringify(n));else ls.removeItem(k.k);
        names.push(k.k);
      }catch(e){}});
      /* 再読み込み前の自動保存で書き戻されないように止める */
      Storage.prototype.setItem=function(k,v){if(this===ls&&names.indexOf(k)>=0)return;return orig(k,v);};
    }catch(e){}
    try{Array.prototype.forEach.call(document.querySelectorAll("input,select,textarea"),function(el){
      if(el.closest&&el.closest("#wcClrDlg"))return;
      if(el.type==="checkbox"||el.type==="radio")el.checked=el.defaultChecked;
      else if(el.tagName==="SELECT")el.selectedIndex=Math.max(0,Array.prototype.findIndex.call(el.options,function(o){return o.defaultSelected;}));
      else if(el.type!=="button"&&el.type!=="submit"&&el.type!=="hidden"&&el.type!=="file")el.value=el.defaultValue;
    });}catch(e){}
    try{window.scrollTo(0,0);}catch(e){}
    location.reload();
  });
})();
</script>
<!-- wc-clear:end -->
<script src="../share.js" defer></script>
