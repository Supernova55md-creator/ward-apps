<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>髄液所見 鑑別トレーニング</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F766E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="髄液トレーニング">
<style>
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#1A2422; --muted:#5A6865; --line:#D9E2DF;
  --accent:#0F766E; --accent-strong:#0B5650; --accent-soft:#E1F2EF; --on-accent:#FFFFFF;
  --ok:#2E7D4F; --ok-soft:#E3F3E9; --ng:#B42318; --ng-soft:#FDE8E6; --warn-soft:#FFF4DB;
  --font:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif; --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121716; --surface:#1B2220; --ink:#E7EEEC; --muted:#9FB0AC; --line:#2D3835;
    --accent:#2DBFAF; --accent-strong:#6FDCCF; --accent-soft:#16332F; --on-accent:#06201D;
    --ok:#5CC48A; --ok-soft:#163323; --ng:#F27A6E; --ng-soft:#3B1C1A; --warn-soft:#3A3017; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:680px;margin:0 auto;padding:0 calc(14px + env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:50%;border:5px solid var(--accent);flex:none}
.brand h1{font-size:19px;font-weight:900}
.brand small{color:var(--muted);font-size:11px;margin-left:auto;text-align:right;line-height:1.3}
.summary{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 9px}
.tile .k{font-size:11px;color:var(--muted);display:block}
.tile .v{font-size:17px;font-weight:700;display:block}
section.view{display:none;padding-top:12px}
section.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:6px}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
details.set>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary::after{content:"＋";margin-left:auto;color:var(--muted);font-weight:400}
details.set[open]>summary::after{content:"－"}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer;background:var(--bg);user-select:none}
.chip input{margin:0;accent-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:44px}
input[type=search]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-height:44px}
.sw{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
/* 出題 */
.qhead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.lv{letter-spacing:1px;color:var(--accent)}
.regtag{margin-left:auto;background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:1px 10px;font-weight:700}
.pt{font-size:15.5px;margin:0 0 8px}
ul.fd{margin:0;padding:0;list-style:none}
ul.fd li{position:relative;padding:7px 0 7px 18px;border-top:1px dashed var(--line);font-size:15.5px;line-height:1.5}
ul.fd li:first-child{border-top:0}
ul.fd li::before{content:"";position:absolute;left:3px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ask{font-weight:700;margin:12px 0 8px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;font-size:15.5px;line-height:1.45;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:11px 12px;min-height:48px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.result{border-radius:10px;padding:9px 12px;font-weight:700;margin-bottom:10px}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.ng{background:var(--ng-soft);color:var(--ng)}
.result .ans{display:block;color:var(--ink);font-size:17px;margin-top:2px}
.result .syn{display:block;color:var(--muted);font-weight:400;font-size:13.5px}
.ex h3{font-size:14.5px;margin:12px 0 4px;color:var(--accent-strong)}
.why{margin:0;padding:0;list-style:none}
.why li{padding:7px 0;border-top:1px dashed var(--line);font-size:15px;line-height:1.5}
.why li:first-child{border-top:0}
.why .f{display:block}
.why .w{display:block;color:var(--muted);font-size:13.5px;padding-left:1.2em;text-indent:-1.2em}
.why .w::before{content:"→ ";color:var(--accent)}
.why .dn{font-weight:700;display:block}
.pearl{background:var(--warn-soft);border-radius:10px;padding:9px 12px;font-size:14.5px;margin-top:12px}
.pearl b{display:block;font-size:13px;color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nav .btn{flex:1 1 140px}
/* 一覧 */
details.site{border-top:1px solid var(--line)}
details.site:first-of-type{border-top:0}
details.site>summary{cursor:pointer;padding:9px 0;list-style:none}
details.site>summary::-webkit-details-marker{display:none}
details.site>summary b{display:block;font-size:15px}
details.site>summary span{display:block;font-size:13px;color:var(--muted)}
.lvb{font-size:11px;color:var(--accent);margin-left:6px;font-weight:400}
.sub{font-size:12.5px;color:var(--muted);margin:8px 0 2px;font-weight:700}
/* 成績 */
table.st{width:100%;border-collapse:collapse;font-size:14.5px}
table.st td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.st td.num{text-align:right;white-space:nowrap;width:1%}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);font-size:14px}
/* タブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.tabs .in{display:flex;max-width:680px;width:100%}
nav.tabs button{flex:1;font:inherit;font-size:13px;background:none;border:0;color:var(--muted);padding:9px 0 10px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:20;display:none;max-width:90%}
.toast.on{display:block}
.foot{font-size:11.5px;color:var(--muted);margin:16px 2px 0}
</style>
<style>
.sub{font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:700;display:flex;align-items:center;gap:8px}
.legend{margin-left:auto;font-weight:400;display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;background:var(--key);border:1px solid var(--key-line)}
:root{--key:#FFF1C2;--key-line:#E0A800;--fu:#B42318;--fd:#1D5FD1}
@media (prefers-color-scheme: dark){:root{--key:#3D3410;--key-line:#C99A12;--fu:#F27A6E;--fd:#7FB0FF}}
dl.clin{display:grid;grid-template-columns:5.2em 1fr;gap:3px 8px;margin:0;font-size:14.5px;line-height:1.5;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
dl.clin dt{color:var(--muted);font-size:12.5px;padding-top:1px}
dl.clin dd{margin:0}
dl.clin.key{background:var(--key);border-color:var(--key-line)}
table.csf{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.4}
table.csf th{font-size:11.5px;color:var(--muted);font-weight:700;text-align:left;padding:3px 6px;border-bottom:1px solid var(--line)}
table.csf td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
table.csf td:first-child{color:var(--muted);font-size:13px}
table.csf tr.sr td:first-child{padding-left:16px;font-size:12.5px}
table.csf{table-layout:fixed}
table.csf col.c1{width:30%}table.csf.done col.c1{width:24%}table.csf.done col.c3{width:36%}
table.csf td:nth-child(2){font-weight:700}
table.csf .ref{font-size:12px;color:var(--muted);font-weight:400}
table.csf tr.key td{background:var(--key)}
table.csf tr.key td:first-child{box-shadow:inset 4px 0 0 var(--key-line);color:var(--ink);font-weight:700}
.abs{font-weight:400;color:var(--muted);font-size:12.5px}
.na{font-weight:400;color:var(--muted)}
.fu{color:var(--fu)}.fd{color:var(--fd)}
.nc{display:inline-block;margin-left:4px;font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:0 4px;color:var(--muted)}
.calc{background:var(--accent-soft);border-radius:10px;padding:9px 12px;font-size:14px;margin-top:10px;line-height:1.6}
.calc>b:first-child{display:block;font-size:13px;color:var(--accent-strong)}
.why .kp{display:inline-block;background:var(--key);border:1px solid var(--key-line);border-radius:6px;padding:0 6px;font-size:12.5px;font-weight:700;margin-right:6px}
.why .pick{margin-left:6px;font-size:11px;font-weight:700;color:var(--ng);border:1px solid var(--ng);border-radius:6px;padding:0 4px}
ul.nx{margin:0;padding-left:1.2em;font-size:14.5px;line-height:1.55}
ul.nx li{margin:2px 0}
.tx{background:var(--ng-soft);border:1px solid var(--ng);border-radius:10px;padding:9px 12px;margin-top:12px;font-size:14.5px}
.tx>b{display:block;color:var(--ng);font-size:13.5px}
.tx ul{margin:4px 0 0;padding-left:1.2em}
.tx.soft{background:var(--accent-soft);border-color:var(--accent)}
.tx.soft>b{color:var(--accent-strong)}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg button{flex:1 1 30%;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 8px;min-height:40px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:700}
.urg{font-size:10.5px;color:var(--ng);border:1px solid var(--ng);border-radius:6px;padding:0 4px;margin-left:6px;font-weight:700}
p.rng{font-size:13px;margin:0 0 4px;line-height:1.5}
table.st.ref td{font-size:13.5px}
table.st.ref td:first-child{white-space:nowrap;color:var(--muted);width:1%}
ul.src{margin:0;padding-left:1.1em;font-size:13.5px;line-height:1.5}
ul.src li{margin:6px 0}
ul.src a{color:var(--accent-strong)}
</style>

</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>髄液所見 鑑別トレーニング</h1><small>髄液から診断を推論<br>病棟アプリ</small></div>
  <div class="summary">
    <div class="tile"><span class="k">回答数</span><span class="v" id="sN">0</span></div>
    <div class="tile"><span class="k">正答率</span><span class="v" id="sR">—</span></div>
    <div class="tile"><span class="k">連続正解</span><span class="v" id="sS">0</span></div>
  </div>
</header>

<section class="view active" id="v-q" aria-label="出題">
  <details class="card set" id="setBox">
    <summary>出題範囲・設定 <span class="hint" id="setSum" style="margin:0 0 0 4px"></span></summary>
    <div class="seg" id="modeSeg" role="group" aria-label="モード">
      <button type="button" data-m="inf" aria-pressed="false">感染症のみ</button><button type="button" data-m="non" aria-pressed="false">非感染性のみ</button><button type="button" data-m="mix" aria-pressed="true">混合</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label for="lvSel" style="font-size:14px">難易度</label>
      <select id="lvSel"><option value="1">基本（典型例・選択肢4）</option><option value="2">標準（選択肢5）</option><option value="3">応用（紛らわしい例を含む・選択肢6）</option></select>
    </div>
    <label class="sw"><input type="checkbox" id="hideOpt">選択肢を隠して、先に自分で考える</label>
    <label class="sw"><input type="checkbox" id="weakOpt">間違えた疾患・まだ解いていない疾患を優先</label>
    <p class="hint">応用では、抗菌薬前投与の細菌性、早期に多核球優位のウイルス性、結核とクリプトコックス、traumatic tapの補正などが出ます。基準値は答えたあとに表示します。</p>
  </details>
  <div id="qArea"></div>
</section>

<section class="view" id="v-a" aria-label="早見表">
  <div id="aList"></div>
</section>

<section class="view" id="v-s" aria-label="成績">
  <div id="sArea"></div>
</section>

<section class="view" id="v-r" aria-label="出典">
  <div id="srcArea"></div>
</section>

<p class="foot">自分用の学習ツールです。症例は自動生成した架空のもので、数値は典型像の目安です。実際の診療では原典・診察で判断してください。成績はこの端末内にのみ保存されます。</p>
</div>

<nav class="tabs" role="tablist" aria-label="画面切替"><div class="in">
  <button role="tab" aria-selected="true" data-v="v-q" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.2v.1"/></svg>出題</button>
  <button role="tab" aria-selected="false" data-v="v-a" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>早見表</button>
  <button role="tab" aria-selected="false" data-v="v-s" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>成績</button>
  <button role="tab" aria-selected="false" data-v="v-r" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>出典</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
<script>
/* 髄液所見 鑑別トレーニング：出題データ
   数値の範囲はガイドライン・原著（出典タブ）と成書の一般的な目安から作った典型像。実症例の分布そのものではない。 */
var CATS={inf:"感染症",non:"非感染性"};
var DX={
bact:{name:"細菌性髄膜炎",cat:"inf",urg:true,
 sig:"急性・発熱、多核球優位の著増（数百〜数千/μL）、糖比<0.4、乳酸・蛋白の上昇",
 near:["tb","viral","drug","lm","crypto"],
 next:["血液培養2セット（抗菌薬の前に。ただし抗菌薬を遅らせない）","髄液グラム染色・細菌培養","FilmArray 髄膜炎・脳炎パネル（約1時間。感受性は出ないので培養と並行）","肺炎球菌抗原（尿・髄液）","LP前の頭部CT：意識障害・局所神経徴候・けいれん・乳頭浮腫・免疫不全があるとき"],
 tx:[
  "来院1時間以内に抗菌薬。CT・腰椎穿刺で遅れるなら先に投与する",
  "16〜49歳・免疫正常：セフトリアキソン（ロセフィン）2 g 12時間ごと＋バンコマイシン（塩酸バンコマイシン）15〜20 mg/kg 8〜12時間ごと（TDM）。代替はメロペネム（メロペン）2 g 8時間ごと＋バンコマイシン",
  "50歳以上：上記にアンピシリン（ビクシリン）2 g 4時間ごとを加える（リステリア）",
  "免疫不全・慢性消耗疾患：アンピシリン＋セフタジジム（モダシン）＋バンコマイシン、またはメロペネム＋バンコマイシン。脳外科術後・頭部外傷後：メロペネム（またはセフタジジム）＋バンコマイシン",
  "デキサメタゾン（デキサート）0.15 mg/kg 6時間ごと 4日間を、初回抗菌薬の前か同時に。肺炎球菌・インフルエンザ菌以外なら中止、リステリアなら直ちに中止"],
 txNote:"レジメンの組み合わせは『細菌性髄膜炎・単純ヘルペス脳炎診療ガイドライン2026』の学会講演要旨（ケアネット報道）で確認。1回量・間隔は成書・ESCMID 2016の標準量で、添付文書・GL本文とは未照合。腎機能で調整する。",
 pearl:"糖比<0.23、細胞>2000/μL、多核球>1180/μL、蛋白>220 mg/dL のどれか1つで細菌性をほぼ確定できるが、どれも『否定』には使えない（Spanos 1989）。"},
tb:{name:"結核性髄膜炎",cat:"inf",
 sig:"亜急性（週単位）、単核球優位（数十〜数百/μL）、蛋白の著増、糖比低下、ADA上昇",
 near:["crypto","bact","viral","lm","syph"],

<script>
(function(){
"use strict";
var KEY="csf-v1",VER="2026-11-14a";
var tById={};T.forEach(function(t){tById[t.id]=t;});
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),x=a[i];a[i]=a[j];a[j]=x;}return a;}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var R={u:function(a,b){return a+Math.random()*(b-a);},i:function(a,b){return a+rnd(b-a+1);},p:function(a){return a[rnd(a.length)];},
  k:function(a,n){return shuffle(a).slice(0,Math.min(n,a.length));},ch:function(p){return Math.random()<p;},
  lg:function(a,b){if(a<=0)a=0.5;return Math.exp(Math.log(a)+Math.random()*(Math.log(b)-Math.log(a)));}};
function pickv(x){return Array.isArray(x)?x[rnd(x.length)]:x;}
function fmt(n){return Math.round(n).toLocaleString("ja-JP");}

/* ── 症例の生成 ── */
function gen(tid){
  var t=tById[tid],v=t.v,c=t.clin(R),o={};
  if(!c.sex)c.sex=R.ch(.5)?"男性":"女性";
  var bg=R.i(88,150);if(/糖尿病/.test(c.immuno||""))bg=R.i(160,240);
  o.op=Math.round(R.u(v.op[0],v.op[1]));
  o.rbc=v.rbc?Math.round(v.rbc[1]<=30?R.u(v.rbc[0],v.rbc[1]):R.lg(Math.max(v.rbc[0],1),v.rbc[1])):0;
  if(o.rbc<3&&R.ch(.6))o.rbc=0;
  var exp=0;
  if(c.bw&&o.rbc){exp=o.rbc*c.bw/c.br;}
  if(t.tap){
    var w=exp*(v.wf?R.u(v.wf[0],v.wf[1]):1)+(v.addw?R.lg(v.addw[0],v.addw[1]):0)+R.i(0,2);
    o.wbc=Math.max(0,Math.round(w));
  }else{
    o.wbc=Math.round(v.wbc[1]<=15?R.u(v.wbc[0],v.wbc[1]):R.lg(Math.max(v.wbc[0],1),v.wbc[1]));
  }
  if(o.wbc<=2){o.pmn=0;o.eos=0;}
  else{o.pmn=Math.round(R.u(v.pmn[0],v.pmn[1]));o.eos=Math.round(R.u(v.eos[0],v.eos[1]));}
  if(o.pmn+o.eos>100)o.eos=100-o.pmn;
  o.mono=o.wbc<=2?(o.wbc?100:0):100-o.pmn-o.eos;
  var pr=R.u(v.prot[0],v.prot[1]);if(t.tap)pr+=o.rbc/1000;
  o.prot=Math.round(pr);
  var ratio=R.u(v.ratio[0],v.ratio[1]);
  o.bg=bg;o.glu=Math.max(1,Math.round(bg*ratio));o.ratio=Math.round(o.glu/bg*100)/100;
  o.lac=Math.round(R.u(v.lac[0],v.lac[1]));
  o.ada=Math.round(R.u(v.ada[0],v.ada[1])*10)/10;
  o.ocb=v.ocb==null?null:pickv(v.ocb);
  o.igg=v.igg==null?null:Math.round(R.u(v.igg[0],v.igg[1])*100)/100;
  if(o.ocb==null&&v.igg)o.igg=null;
  o.cyto=v.cyto==null?null:pickv(v.cyto);
  o.app=v.app||appearance(o);
  return {tid:tid,dx:t.dx,c:c,v:o,exp:exp?Math.round(exp*10)/10:0};
}
function appearance(o){
  var a;
  if(o.rbc>=20000)a="血性";else if(o.rbc>=1500)a="淡血性";
  else if(o.wbc>=1000)a="混濁";else if(o.wbc>=300)a="微混濁";else if(o.wbc>=80)a="日光微塵";else a="水様透明";
  if(o.prot>=250&&o.rbc<1500)a+="・淡黄色";
  return a;
}

/* ── 状態 ── */
var st;
function defaults(){return {set:{mode:"mix",lvl:3,hide:false,weak:false},cur:null,st:{},hist:[],cnt:0,streak:0};}
try{st=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){st=null;}
if(!st||typeof st!=="object")st=defaults();
var d0=defaults();
Object.keys(d0).forEach(function(k){if(st[k]===undefined)st[k]=d0[k];});
Object.keys(d0.set).forEach(function(k){if(st.set[k]===undefined)st.set[k]=d0.set[k];});
if(st.cur&&(!tById[st.cur.tid]||!DX[st.cur.dx]))st.cur=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

function inMode(dx){var m=st.set.mode;return m==="mix"||DX[dx].cat===m;}
function pool(){return T.filter(function(t){return inMode(t.dx)&&t.lvl<=st.set.lvl;});}
function pickT(){
  var c=pool();if(!c.length)return null;
  var last=st.cur&&st.cur.tid;
  if(c.length>1)c=c.filter(function(t){return t.id!==last;});
  /* 疾患ごとに均等になるよう、テンプレート数で割る */
  var nT={};c.forEach(function(t){nT[t.dx]=(nT[t.dx]||0)+1;});
  var w=c.map(function(t){var b=1/nT[t.dx];if(!st.set.weak)return b;var r=st.st[t.dx];if(!r||!r.n)return b*3;return b*(1+4*(1-r.c/r.n));});
  var sum=w.reduce(function(a,b){return a+b;},0),x=Math.random()*sum;
  for(var i=0;i<c.length;i++){x-=w[i];if(x<=0)return c[i].id;}
  return c[c.length-1].id;
}
function options(dx){
  var n=st.set.lvl+3,opts=[dx];
  DX[dx].near.forEach(function(d){if(opts.length<n&&opts.indexOf(d)<0&&inMode(d))opts.push(d);});
  var rest=shuffle(DXKEYS.filter(function(d){return opts.indexOf(d)<0&&inMode(d);}));
  while(opts.length<n&&rest.length)opts.push(rest.shift());
  return shuffle(opts);
}
function newQ(tid,fixed){
  var id=tid||pickT();
  if(!id){st.cur=null;save();renderQ();return;}
  var q=fixed?JSON.parse(JSON.stringify(fixed)):gen(id);
  q.o=options(q.dx);q.ans=null;q.hint=false;q.reveal=!st.set.hide;q.no=st.cnt+1;
  st.cur=q;save();renderQ();
  try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}
}

/* ── 表示用 ── */
function val(k,o){
  var x=o[k];
  switch(k){
    case"op":return x+" cmH₂O";
    case"app":return x;
    case"wbc":return fmt(x)+" /μL";
    case"pmn":case"mono":case"eos":return o.wbc?x+"%"+(o.wbc>=20&&x>0?'<span class="abs">（'+fmt(o.wbc*x/100)+'/μL）</span>':""):"—";
    case"rbc":return fmt(x)+" /μL";
    case"prot":return x+" mg/dL";
    case"glu":return x+' mg/dL<span class="abs">（同時血糖 '+o.bg+'）</span>';
    case"ratio":return x.toFixed(2);
    case"lac":return x+" mg/dL";
    case"ada":return x.toFixed(1)+" U/L";
    case"ocb":return x==null?'<span class="na">未提出</span>':x;
    case"igg":return x==null?'<span class="na">未提出</span>':x.toFixed(2);
    case"cyto":return x==null?'<span class="na">未提出</span>':esc(x);
  }
  return esc(x);
}
/* 異常の向き：1=高い/陽性、-1=低い、0=正常 */
function flag(k,o){
  var x=o[k];
  switch(k){
    case"op":return x>20?1:0;
    case"app":return /透明/.test(x)?0:1;
    case"wbc":return x>5?1:0;
    case"pmn":return o.wbc>5&&x>=10?1:0;
    case"mono":return 0;
    case"eos":return o.wbc>2&&x>=3?1:0;
    case"rbc":return x>=50?1:0;
    case"prot":return x>45?1:0;
    case"glu":return x<45?-1:0;
    case"ratio":return x<0.5?-1:0;
    case"lac":return x>=25?1:0;
    case"ada":return x>4?1:0;
    case"ocb":return x==="陽性"?1:0;
    case"igg":return x!=null&&x>0.7?1:0;
    case"cyto":return x&&/Ⅴ|悪性細胞あり|腺癌|酵母/.test(x)&&!/なし/.test(x)?1:0;
  }
  return 0;
}
function keysOf(q){var t=tById[q.tid];return t.why.map(function(w){return w[0];});}
function table(q){
  var o=q.v,ans=!!q.ans,keys=ans?keysOf(q):[];
  var kk=keys.slice();if(kk.indexOf("mono")>=0||kk.indexOf("pmn")>=0||kk.indexOf("eos")>=0)kk.push("wbc");
  var h='<table class="csf'+(ans?' done':'')+'"><colgroup><col class="c1"><col class="c2">'+(ans?'<col class="c3">':'')+'</colgroup><thead><tr><th>項目</th><th>結果</th>'+(ans?'<th>基準・目安</th>':'')+'</tr></thead><tbody>';
  ROWS.forEach(function(k){
    var f=ans?flag(k,o):0,key=ans&&keys.indexOf(k)>=0;
    var mk=f>0?'<b class="fu">↑</b>':(f<0?'<b class="fd">↓</b>':'');
    if(k==="app"||k==="ocb"||k==="cyto")mk=f?'<b class="fu">＊</b>':'';
    h+='<tr class="'+(key?'key':'')+(k==="pmn"||k==="mono"||k==="eos"?' sr':'')+'"><td>'+REF[k].l+'</td><td>'+val(k,o)+(ans?' '+mk:'')+'</td>'+(ans?'<td class="ref">'+esc(REF[k].s||REF[k].ref)+(REF[k].chk?'':'<span class="nc">目安</span>')+'</td>':'')+'</tr>';
  });
  return h+'</tbody></table>';
}
function clinBox(q){
  var c=q.c,ans=!!q.ans,key=ans&&keysOf(q).indexOf("clin")>=0;
  var rows=[["年齢・性別",c.age+"歳・"+c.sex],["発症",c.onset],["発熱",c.fever],["免疫抑制",c.immuno],["随伴症状",(c.sx||[]).join("、")]];
  if(c.bw)rows.push(["血液","白血球 "+fmt(c.bw)+"/μL、赤血球 "+(c.br/1e4).toFixed(0)+"万/μL"]);
  return '<dl class="clin'+(key?' key':'')+'">'+rows.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>';}).join("")+'</dl>';
}

/* ── 出題画面 ── */
var qArea=document.getElementById("qArea");
function lvDots(n){return "●●●".slice(0,n)+"○○○".slice(0,3-n);}
var MODEL={mix:"混合",inf:"感染症のみ",non:"非感染性のみ"};
function renderQ(){

    var g=document.getElementById("goQ");if(g)g.onclick=function(){newQ();};
    return;
  }
  var t=tById[q.tid];

  }else{
    h+='<div class="opts">'+q.o.map(function(d,k){

      return '<button type="button" class="opt'+cls+'" data-k="'+k+'"'+(q.ans?' disabled':'')+'><span class="n">'+(k+1)+'</span><span>'+esc(DX[d].name)+'</span></button>';
    }).join("")+'</div>';
  }
  if(!q.ans)h+='<div class="nav"><button class="btn sm" type="button" id="hintBtn"'+(q.hint?' disabled':'')+'>ヒント（感染／非感染）</button><button class="btn sm" type="button" id="giveBtn">わからない（解説へ）</button><button class="btn sm" type="button" id="skipBtn">別の問題</button></div>';
  h+='</div>';
  if(q.ans)h+=explain(q);

  if((b=document.getElementById("hintBtn")))b.onclick=function(){q.hint=true;save();renderQ();};

function tapCalc(q){
  var o=q.v,c=q.c,e=q.exp,corr=Math.max(0,Math.round(o.wbc-e));
  return '<div class="calc"><b>血液混入の補正</b>予想される白血球 ＝ 髄液赤血球 '+fmt(o.rbc)+' × 血液白血球 '+fmt(c.bw)+' ÷ 血液赤血球 '+(c.br/1e4).toFixed(0)+'万 ＝ <b>約'+fmt(e)+'/μL</b><br>実測 '+fmt(o.wbc)+'/μL − 予想 '+fmt(e)+' ＝ <b>補正後 約'+fmt(corr)+'/μL</b>'+(corr>5?'（髄液そのものに細胞増多あり）':'（正常範囲）')+'<br><span class="hint" style="margin:0">蛋白も赤血球1,000/μLにつき約1 mg/dL上乗せされる（成書の目安、未照合）。</span></div>';
}
function answer(k){
  var q=st.cur;if(!q||q.ans)return;
  var ok=k>=0&&q.o[k]===q.dx;
  q.ans={k:k,ok:ok};q.reveal=true;
  var r=st.st[q.dx]||(st.st[q.dx]={n:0,c:0});r.n++;if(ok)r.c++;
  st.cnt++;st.streak=ok?st.streak+1:0;
  var hq={tid:q.tid,dx:q.dx,c:q.c,v:q.v,exp:q.exp};
  st.hist.unshift({q:hq,ok:ok,pick:k>=0?q.o[k]:null,t:Date.now()});
  if(st.hist.length>60)st.hist.length=60;
  save();renderQ();renderTop();
  setTimeout(function(){var e=document.getElementById("exCard");if(e)try{e.scrollIntoView({behavior:"smooth",block:"start"});}catch(x){}},60);
}
function explain(q){
  var t=tById[q.tid],d=DX[q.dx];
  var h='<div class="card ex" id="exCard">';
  h+='<div class="result '+(q.ans.ok?'ok':'ng')+'">'+(q.ans.ok?'正解':(q.ans.k<0?'解説':'不正解'))+'<span class="ans">'+esc(d.name)+'</span>'+(t.label?'<span class="syn">'+esc(t.label)+'</span>':'')+'</div>';
  h+='<h3>決め手になった所見</h3><ul class="why">'+t.why.map(function(w){
    var lab=w[0]==="clin"?"臨床情報":REF[w[0]].l.trim();
    return '<li><span class="kp">'+esc(lab)+'</span>'+esc(w[1])+'</li>';}).join("")+'</ul>';
  var others=q.o.filter(function(x){return x!==q.dx;});
  if(q.ans.k>=0&&!q.ans.ok){var p=q.o[q.ans.k];others=[p].concat(others.filter(function(x){return x!==p;}));}
  h+='<h3>ほかの選択肢との違い</h3><ul class="why">'+others.map(function(x){
    return '<li><span class="dn">'+esc(DX[x].name)+(q.ans.k>=0&&q.o[q.ans.k]===x?'<span class="pick">あなたの解答</span>':'')+'</span><span class="w">この疾患なら：'+esc(DX[x].sig)+'</span></li>';}).join("")+'</ul>';
  h+='<h3>次に出す検査・対応</h3><ul class="nx">'+(t.next||d.next).map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>';
  if(d.tx){
    h+='<div class="tx"><b>すぐ治療を始める：経験的治療の要点</b><ul>'+d.tx.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul><p class="hint" style="margin:4px 0 0">'+esc(d.txNote)+'</p></div>';
  }else if(d.txShort){
    h+='<div class="tx soft"><b>治療の一言</b>'+esc(d.txShort)+'<span class="hint" style="display:block;margin:2px 0 0">用量は原典・添付文書で確認（ここでは未照合）。</span></div>';
  }
  h+='<div class="pearl"><b>ポイント</b>'+esc(t.pearl||d.pearl)+'</div>';
  h+='<div class="nav"><button class="btn primary" type="button" id="nextBtn">次の問題</button><button class="btn" type="button" id="sameBtn">同じパターンで数値を変えて</button></div>';
  return h+'</div>';
}

<script>
(function(){
  var KEYS=[{"k":"csf-v1","keep":["st","hist","cnt"]}];
  try{document.querySelectorAll("header.top .brand").forEach(function(e){e.setAttribute("data-wc-pad","");if(true)e.setAttribute("data-wc-hs","");});}catch(e){}
  var btn=document.getElementById("wcClrBtn"),dlg=document.getElementById("wcClrDlg");
  function close(){dlg.classList.remove("on");}
  btn.addEventListener("click",function(){dlg.classList.add("on");document.getElementById("wcClrNo").focus();});
  document.getElementById("wcClrNo").addEventListener("click",close);
  dlg.addEventListener("click",function(e){if(e.target===dlg)close();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")close();});
  document.getElementById("wcClrYes").addEventListener("click",function(){
    try{
      var ls=window.localStorage,orig=ls.setItem.bind(ls);
      var names=[];
      KEYS.forEach(function(k){try{
        if(typeof k==="string"){ls.removeItem(k);names.push(k);return;}
        /* 保存した記録・ケースなど keep に挙げた項目は残し、入力だけ消す */
        var o=null;try{o=JSON.parse(ls.getItem(k.k)||"null");}catch(e){}
        var n={};if(o&&k.keep)k.keep.forEach(function(f){if(f in o)n[f]=o[f];});
        if(Object.keys(n).length)orig(k.k,JSON.stringify(n));else ls.removeItem(k.k);
        names.push(k.k);
      }catch(e){}});
      /* 再読み込み前の自動保存で書き戻されないように止める */
      Storage.prototype.setItem=function(k,v){if(this===ls&&names.indexOf(k)>=0)return;return orig(k,v);};

      else if(el.type!=="button"&&el.type!=="submit"&&el.type!=="hidden"&&el.type!=="file")el.value=el.defaultValue;
    });}catch(e){}

  });
})();
