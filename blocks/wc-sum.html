<!-- wc-sum:start（病棟アプリ共通の結果の固定表示。編集時はこのブロックごと差し替える。書き換えるのは SRC と HOST だけ） -->
<style>
#wcSum{display:none;align-items:center;gap:8px;width:100%;box-sizing:border-box;margin:6px 0 0;padding:6px 10px;min-height:34px;border:0;border-left:5px solid #6B7A86;border-radius:8px;background:#FFFFFF;color:#1B2428;font:700 13.5px/1.35 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#wcSum.on{display:flex}
#wcSum .t{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#wcSum .p{flex:none;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:#6B7A86;color:#fff}
#wcSum .g{flex:none;font-size:12px;color:#6B7A86;font-weight:500}
#wcSum.ok{border-left-color:#1F7A4D;background:#E9F6EF}#wcSum.ok .p{background:#1F7A4D}
#wcSum.warn{border-left-color:#B7791F;background:#FFF5E0}#wcSum.warn .p{background:#B7791F}
#wcSum.crit{border-left-color:#B42318;background:#FDECEA}#wcSum.crit .p{background:#B42318}
#wcSum.info{border-left-color:#1E5FA8;background:#EAF2FB}#wcSum.info .p{background:#1E5FA8}
@media (prefers-color-scheme: dark){
  #wcSum{background:#1F2427;color:#ECEFF0}#wcSum .g{color:#A9B3B6}
  #wcSum.ok{background:#12301F}#wcSum.warn{background:#3A2C0C}#wcSum.crit{background:#3A1512}#wcSum.info{background:#122A45}
}
@media print{#wcSum{display:none!important}}
</style>
<script>
(function(){
  /* ① 要約の元にする要素（CSSセレクタ）。画面に見えている最初の1つを使う。.big があればその文、.pill があれば先頭に付ける */
  var SRC=[".verdict"];
  /* ② 固定表示を置く場所（sticky のヘッダー）。共通プロファイルの帯があればその下に入る */
  var HOST="header.top";
  var h=document.querySelector(HOST)||document.querySelector("body>header")||document.querySelector("header");
  if(!h||document.getElementById("wcSum"))return;
  var b=document.createElement("button");b.type="button";b.id="wcSum";b.setAttribute("aria-live","polite");
  b.innerHTML='<span class="p"></span><span class="t"></span><span class="g">▼</span>';
  h.appendChild(b);
  var manual=null,cur=null,last="";
  function vis(e){return !!(e&&e.getClientRects().length)&&!e.closest("[hidden]");}
  function tone(e){var c=" "+(e.className||"")+" ";
    if(/ (crit|red|danger|ng|bad) /.test(c))return"crit";if(/ (warn|caution|yellow|amber) /.test(c))return"warn";
    if(/ (ok|green|safe|good) /.test(c))return"ok";if(/ (info|blue) /.test(c))return"info";return"";}
  function txt(n){var w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,null),a=[],x;while((x=w.nextNode()))a.push(x.nodeValue);return a.join(" ");}
  function clean(s){return String(s||"").replace(/\s+/g," ").trim();}
  function pick(){
    for(var i=0;i<SRC.length;i++){var l=document.querySelectorAll(SRC[i]);
      for(var j=0;j<l.length;j++)if(vis(l[j])&&!b.contains(l[j]))return l[j];}
    return null;
  }
  function draw(){
    var t="",p="",tn="",e=null;
    if(manual){t=manual.text;p=manual.pill||"";tn=manual.tone||"";}
    else{e=pick();if(e){var bg=e.querySelector(".big"),pl=e.querySelector(".pill");
      t=clean(txt(bg||e));if(t.length>120)t=t.slice(0,118)+"…";p=clean(pl?pl.textContent:"");tn=tone(e);}}
    cur=e;var key=t+"|"+p+"|"+tn;if(key===last)return;last=key;
    if(!t){b.className="";return;}
    b.className="on "+tn;b.querySelector(".t").textContent=t;
    var pe=b.querySelector(".p");pe.textContent=p;pe.style.display=p?"":"none";
    b.querySelector(".g").style.display=e?"":"none";
  }
  var q=false;function sched(){if(q)return;q=true;requestAnimationFrame(function(){q=false;draw();});}
  try{new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){if(!b.contains(ms[i].target)){sched();return;}}})
    .observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["hidden","class","style","aria-selected"]});}catch(e){}
  document.addEventListener("input",sched,true);document.addEventListener("change",sched,true);document.addEventListener("click",function(){setTimeout(sched,0);},true);
  b.addEventListener("click",function(){if(!cur)return;try{cur.scrollIntoView({block:"center",behavior:"smooth"});}catch(e){cur.scrollIntoView();}});
  /* アプリ側から直接指定するとき：wcSum.set("文", {tone:"crit", pill:"レッド"})、自動に戻す：wcSum.set(null) */
  window.wcSum={set:function(t,o){manual=t?{text:String(t),tone:o&&o.tone,pill:o&&o.pill}:null;last="";draw();},refresh:function(){last="";draw();}};
  draw();
})();
</script>
<!-- wc-sum:end -->
