最大屈曲位を保持させる。","fixation":"非検査手の母指と他指で、調べる指の中節より近位をしっかり保持する。","technique":"検査手の示指を末節屈側にあてDIP伸展方向へ力を加え、breakされるかを見る。2未満は中節を固定したままDIP伸展位から自力で曲げられるかを見る。","grading":"重力なしのgrading。","pitfalls":["1指ずつ調べるべきで、筆者は示指（FDP1）と小指（FDP4）を主に評価する。","PIP伸展位で調べる方法ではDIP屈曲に十分な力が入りにくい。MP・PIPもまとめて屈曲させる方が最大収縮を得られる。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、肘をベッドについて90度以上屈曲、前腕は回外～回内回外中間位。検者の非検査手で前腕遠位をつかんで空中に保持する。","insertion":"尺側の指を小さく丸めるように強く握るのを繰り返させ、尺骨後縁の内側（前方）に浮き出るFDP3/4の筋腹を同定。肘頭から約10cm、前腕近位1/3の高さで刺入。起始に近く筋腹の動きは小さいので、針先の傾きは原則と逆でも差し支えない。","activation":"自分で尺側の指を握らせるか、検者の指1本を尺側指の屈側にあてて握らせる。","notes":["表在で調べやすいのは尺骨神経支配のFDP3/4。正中神経支配のFDP1/2はFDP3/4を貫いた深部にあり、深さと痛みから容易ではない。","針が前方に寄るとFCUに入る。","近位すぎると尺骨神経に当たることがあり、小指への放散痛に注意する。肘からある程度遠位に刺せば避けられる。","IBMなどのミオパチーで高度萎縮し筋腹が同定しにくい時は、尺骨後縁から1cm程度前方を中心に萎縮筋腹が残っていることが多い。"]},"clinical":["示指・中指は正中-前骨間神経、環指・小指は尺骨神経支配で、その解離は末梢神経障害を示唆するとされるが、特に中指・環指で変異が大きい。前骨間神経麻痺でもFPLとFDP1のみ障害される例が多い。変異の少ないFDP1とFDP4を主に調べるのが推奨される。","筆者らは筋力評価からFDP1は主にT1、FDP4は主にC8支配であることを示した。FDP1/FDP4の解離は髄節性障害でも生じ、TN-TOS（T1主体）ではFDP1優位、遠位型CSA（C8主体）ではFDP4優位に障害される。","封入体筋炎（IBM）ではFDPが選択的に強く障害される。他筋では高振幅MUPが主体となり神経原性と誤られやすいが、FDP3/4では著明な低振幅MUPが主体でミオパチーと容易に診断できる。","FDPの強い障害はIBMに限らず、筋強直性ジストロフィーやBecker型筋ジストロフィーなど他の多くのミオパチーでも見られる。"],"page":104,"headText":"示指（FDP1）＝T1，小指（FDP4）＝C8","rootSrc":"表","short":"深指屈筋 環・小","split":true,"nk":"uln","nshort":"尺骨","bookPage":100},{"id":"fpl","kind":"muscle","ja":"長母指屈筋","en":"Flexor pollicis longus","abbr":"FPL","region":"前腕","roots":{"C8":2,"T1":3},"rootText":"T1＋C8","nerve":"正中神経（前骨間神経）","action":"母指の指節間関節（IP関節）の屈曲","mmt":{"position":"肘屈曲・手関節は自然な位置・手掌を天井に向ける。「親指の先を曲げて」と指示し、IP最大屈曲位を保持させる。","fixation":"非検査手の母指と他指で、母指の基節より近位をしっかり保持する。","technique":"検査手の示指を母指末節の屈側にあてIP伸展方向へ力を加え、breakされるかを見る。2未満は基節を固定したままIP伸展位から自力で曲げられるかを見る。","grading":"重力なしのgrading。","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位、肘伸展、前腕回外位でベッド上に置く。","insertion":"指を握り、母指末節の屈側を示指中節～PIP背側にあてて母指IPを強く曲げるのを繰り返させる。手関節から約8cm近位（前腕遠位1/4～1/3）、橈骨の尺側前方・FCR腱の1～1.5cm橈側に浮く筋腹に、針をあまり傾けずゆっくり刺入する。","activation":"検者の指で母指末節とIP関節を保持し、等尺性を保ちながらIPを曲げる力を入れさせる。","notes":["大きな筋だが、周囲に他構造がなく刺しやすいのは上記の部位のみ。近位に寄るとFDSが表面にかぶさる。","刺入点の橈側に橈骨神経浅枝、尺側に橈骨動脈があり、その間の狭い範囲に刺す。動脈は拍動で同定できるが、浅枝や外側前腕皮神経は触知が難しいので、遠位への放散痛が出たらすぐ刺入点をずらす。","同定が難しく重要構造も近いので、うまく入らない時は無理をしない。針を不用意に動かして橈骨動脈を損傷しないよう注意する。"]},"clinical":["神経痛性筋萎縮症を含む前骨間神経麻痺の代表的障害筋。FPL単独の麻痺は腱断裂でも起こり、前骨間神経麻痺でFPL単独に見える例との鑑別に針筋電図が役立つ。腱断裂では筋腹が近位に偏位していることがあるので注意。","従来C8示準筋とされることが多かったが、筆者らはT1優位を示した。FDS・APBより若干C8支配があり、C8障害で変化が出ることもあるが、全く変化しないことも多い。遠位型CSAを含むC8障害の典型は尺骨＋後骨間神経の障害で、FPLは保たれることの方が多い。","IBMなどFDPが障害される疾患では、同じlong flexorであるFPLも同時に障害されることが多い。"],"page":108,"headText":"C8,T1","rootSrc":"表","nk":"med","nshort":"正中","bookPage":104},{"id":"pq","kind":"muscle","ja":"方形回内筋","en":"Pronator quadratus","abbr":"PQ","region":"前腕","roots":{"C8":1,"T1":3},"rootText":"T1,(C8)","nerve":"正中神経（前骨間神経）","action":"前腕回内","mmt":{"position":"座位、肘伸展・前腕回外位で「腕を内側に回して」と指示し、回内の力を入れさせる。円回内筋（PT）が協働筋だが、肘伸展・回外位で検査するとPQ優位となる（筆者の経験）。","fixation":"","technique":"前腕遠位部を持ち、回外方向へ力を加えて上記肢位がbreakされるかを見る。","grading":"重力なしのgrading。","pitfalls":["検者の両手で被検者の両手をそれぞれ持ち同時に回内させる方法と、被検者の片手を検者の両手で持って回外方向に力を加える方法がある。","PTとの分離は難しい。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、肘伸展・前腕回内位・手関節中間位でベッド上に置く。","insertion":"前腕遠位でED腱、EPB筋腹、橈骨遠位部を同定し、ED腱の橈側縁・EPB筋腹の尺側縁・橈骨尺側縁で囲まれる細長い三角形の中央（手関節の約5cm近位）からほぼ垂直に刺入。1cm前後で骨間膜を貫く感触があり、その直後がPQ。","activation":"手関節部を保持し、安静位からわずかに回内方向へ力を入れさせ、等尺性を保つ。","notes":["骨間膜を貫いたら2～3mm進めるだけで十分。それ以上深く進めると正中神経などがあり危険。","等尺性が崩れ大きく回内すると、針が骨間膜で固定されているため筋断裂を起こしやすい。"]},"clinical":["前骨間神経の最遠位の支配筋で、神経痛性筋萎縮症を含む前骨間神経麻痺で障害される。通常はFPL・FDP1の障害で診断できるが、PQの障害を示したい場合はMMTではPTとの分離が難しいので針筋電図が役立つ。","筋節は十分な経験がないが、他の前骨間神経支配筋同様T1優位との印象（筆者）。"],"page":112,"headText":"T1","rootSrc":"表","nk":"med","nshort":"正中","bookPage":108},{"id":"apb","kind":"muscle","ja":"短母指外転筋","en":"Abductor pollicis brevis","abbr":"APB","region":"手","roots":{"C8":1,"T1":3},"rootText":"T1,(C8)","nerve":"正中神経","action":"母指の垂直外転（掌側外転）","mmt":{"position":"手掌を天井に向け、「親指を天井に向かって持ち上げて」と指示し、手掌に垂直に持ち上げた最大外転位を保持させる。","fixation":"非検査手で手掌、特に示指MP関節部をしっかりつかむ。","technique":"検査手の示指を母指MP関節部にあて、手掌面に戻す（内転）方向へ力を加えbreakされるかを見る。2未満は手掌から垂直に自力で持ち上げられるかを見る。","grading":"重力なしのgrading。","pitfalls":["母指末節など遠位に手をあてると検者の力が強すぎ、正常者でもbreakされるので避ける。","高度の橈骨/後骨間神経麻痺やC8障害でEPB・EPL・APLが弱いと、母指が尺側手掌方向に倒れる形でbreakされ、APBが弱いと誤りやすい。母指球の尺側に検者の対側の手をあてて母指を橈側へ支え、垂直外転の力だけを評価する。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、前腕回外位で手背をベッドにつける。","insertion":"母指を垂直外転させ、母指球中央の最前面を紡錘状に走る筋腹に、針をあまり傾けず刺入。皮下すぐにAPBに入る。","activation":"対側の手指で母指MP付近を保持し、「親指を天井に向かって持ち上げて」と等尺性に垂直外転の力を入れさせる。","notes":["かなり痛い検査なので、どうしても必要な時以外は避ける。"]},"clinical":["母指球で最も純粋な正中神経支配筋。高度の手根管症候群（CTS）では尺骨神経も入る他の母指球筋が保たれても、APBは必ず筋力低下・萎縮を示し、APB部のみ陥凹した萎縮となる。","高度CTSでAPBの筋力低下が強くても、長掌筋などの作用で若干の垂直外転ができることがある。","CTSの診断はNCSで十分で、軸索障害の評価もAPB-CMAP振幅でできるため、筆者はAPBの針筋電図は不要との意見。対立再建の要否には第二虫様筋のMCSが有用で、ガイドライン上もAPB針筋電図の推奨度は高くない。","APBは主にT1支配で、TN-TOSでは強く障害されAPB-CMAPが高度低下する。CTSとの鑑別ではSCSが正常であることが重要。C8神経根症やT1が保たれることの多い遠位型CSAではAPBは保たれる。","前骨間神経支配筋の多くもT1支配だがAPBは正中神経本幹支配なので、T1障害と前骨間神経麻痺の鑑別にはAPBが保たれているかがポイントになる。","これらの診断にはMMT（必要ならAPB-CMAP）で通常十分。針筋電図で確認したいなら、同じT1・正中神経本幹支配のFDSで代用できることが多い。"],"page":114,"headText":"T1","rootSrc":"表","nk":"med","nshort":"正中","bookPage":110},{"id":"op","kind":"muscle","ja":"母指対立筋","en":"Opponens pollicis","abbr":"OP","region":"手","roots":{"T1":2},"rootText":"T1","nerve":"正中神経","action":"母指の対立","mmt":{"position":"手掌を天井に向け、母指を垂直に持ち上げた外転位から「その状態で小指側に寄せて」と指示し、最大対立位を保持させる。","fixation":"非検査手で手掌をしっかりつかむ。","technique":"検査手の指を母指球～母指MP付近にあて、対立を戻す方向（橈側）へ力を加えbreakされるかを見る。","grading":"重力なしのgrading。","pitfalls":["母指と小指の指腹を合わせ、その間を検者の指がすり抜けられるかを見る方法は、FPL・FDP4・小指対立筋など多くの筋の複合筋力を見ている。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、前腕回外位で手背をベッドにつける。","insertion":"母指を対立させ、APBの橈側で盛り上がるOPの筋腹を触れ、そこに刺入。","activation":"検者の母指を被検者の母指球に添え、対立運動をさせる。","notes":["APB同様かなり痛いので、どうしても必要な時以外は避ける。"]},"clinical":["正中神経支配とされるが、APBほど純粋な正中神経支配ではない可能性が高い。診断的意義はAPBと同じで、OPを特に調べる必要がある例は稀。"],"page":118,"headText":"(T1)","rootSrc":"見出し","nk":"med","nshort":"正中","bookPage":114},{"id":"ap","kind":"muscle","ja":"母指内転筋","en":"Adductor pollicis","abbr":"AP","region":"手","roots":{"C8":2,"T1":2},"rootText":"C8,T1","nerve":"尺骨神経","action":"母指の内転","mmt":{"position":"手掌を軽く天井に向け、「親指を手のひらに付けて」と指示し、母指橈側を手掌橈側端～示指基部に密着させた内転位を保持させる。","fixation":"非検査手で手掌から示指基部をしっかりつかむ。","technique":"検査手の示指を母指基節の尺側にあて垂直外転方向へ力を加え、母指と手掌で検者の指をはさむ力がbreakされるかを見る。","grading":"重力なしのgrading。","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":["手掌に刺すことになり痛みが強いので、筆者は行っていない。"]},"clinical":["尺骨神経支配の母指球筋だが、FDIが高度に障害されていても筋力低下が軽い例をしばしば見る。"],"page":122,"headText":"(C8/T1)","rootSrc":"見出し","nk":"uln","nshort":"尺骨","bookPage":118},{"id":"fdi","kind":"muscle","ja":"第一背側骨間筋","en":"First dorsal interosseous","abbr":"FDI","region":"手","roots":{"C8":3,"T1":3},"rootText":"C8,T1","nerve":"尺骨神経","action":"示指の外転","mmt":{"position":"手掌を床に向け、「指をパーに開いて」と指示し、指を伸ばして2～5指を開かせ、示指の母指側への最大外転位を保持させる。","fixation":"非検査手で示指の中手骨～MP関節部をつかむ（EDが弱い場合は後述）。","technique":"検査手の示指を示指PIP関節部にあて内転方向（尺側）へ力を加えbreakされるかを見る。2未満は自然な位置から外転方向（橈側）へ動かせるかを見る。","grading":"重力なしのgrading。","pitfalls":["DIP関節部や末節など遠位に手をあてると正常者でもbreakされるので避ける。PIPにあてる上記手技ならbreakされる健常者はおらず、ADMと違い信頼性が高い。","高度の橈骨/後骨間神経麻痺やC8障害でEDが弱い（特に完全麻痺）と、FDIに力を入れること自体ができず弱いと誤りやすい。対側の手で示指基節～PIPを掌側・背側からはさみMPを伸展位に保ってEDを代償する。手掌を机に置くだけでは代償として不十分。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、前腕回内位で手掌をベッドにつける。","insertion":"示指を橈側に外転させ、第1・2指間に硬く盛り上がる筋腹に、近位側やや尺側へ向けて刺入。","activation":"検者の指で示指を保持し、「指をパーに広げて、人差し指を親指の方に寄せて」と等尺性に外転の力を入れさせる。","notes":["手背にあり手掌側の筋より痛みが少ないため、被検筋に選ばれやすい。","表面を走る静脈を避ける。","小さい筋で終板密度が高く、終板電位（終板雑音・終板棘波）が頻出し痛みも伴う。当たったら少し引いて方向を変える。","終板電位を線維自発電位と間違えないこと。多部位（通常20カ所）サンプリングの妨げにもなる。","健常者でも比較的高振幅MUPが見られ、神経原性でも動員減少が目立たないことがあり、正常と異常の差が小さい。神経原性の診断感度は高くない印象。"]},"clinical":["C8・尺骨神経支配の代表筋で、多くの疾患で筋力低下・萎縮の評価が重要。ADMと違いphysiological weaknessがない点でも有用。","下垂指を主徴とするC8障害（遠位型CSA）と後骨間神経麻痺の鑑別に、FDIの筋力低下の有無が役立つ。","ADM正常でFDI低下が明確な解離があれば、手首部尺骨神経障害（UNW）のWu分類タイプ4（小指球枝分岐後の深枝障害）を考える。","ALSのsplit handからも推測されるように、FDIはALSで最も早く障害される筋の一つ。下肢・球症状初発例でもFDIの筋力低下でALSと診断できることがあり、評価は極めて重要。","錐体路障害でもED・FDI・ADMは障害されやすく、APBや指屈筋は保たれやすい。これはC8障害・T1保存のパターンに似ており、筋萎縮も伴い得るため鑑別に注意。高度筋力低下で中枢性か末梢性か迷う時は針筋電図の動員パターンが役立つ。","終板活動が多い、正常と異常の差が小さい、痛みも強いなどの限界から、筆者はFDIの針筋電図をあまり好まず、C8障害の証明にはFCUを用いる。ただしFDIにはT1、FCUにはC7が多少入り、筋節がやや異なる点に注意。"],"page":124,"headText":"C8,T1","rootSrc":"表","nk":"uln","nshort":"尺骨","bookPage":120},{"id":"adm","kind":"muscle","ja":"小指外転筋","en":"Abductor digiti minimi","abbr":"ADM","region":"手","roots":{"C8":3,"T1":3},"rootText":"C8,T1","nerve":"尺骨神経","action":"小指の外転","mmt":{"position":"手掌を床に向け、「指をパーに開いて」と指示し、2～5指を伸ばして開き、小指を尺側へ最大外転させる。","fixation":"非検査手で小指の中手骨～MP関節部をつかむ（EDが弱い場合は後述）。","technique":"検査手の示指を小指PIP関節部にあて内転方向（橈側）へ力を加えbreakされるかを見る。2未満は自然な位置から尺側へ動かせるかを見る。","grading":"重力なしのgrading。","pitfalls":["健常者でもbreakされる人とされない人がいる典型的な筋。高齢女性でbreakされやすい傾向はあるが正常変異と捉え、左右差を見る。両側でbreakされるなら問題なく、筆者は4/4とし「physiological」と注記する。","DIP部や末節など遠位にあてると、さらに多くの健常者がbreakされるので避ける。","検者も小指で調べるべきという意見があるが「力比べ」になり、break testとしては不要。筆者は示指で調べる。","高度の橈骨/後骨間神経麻痺やC8障害でEDが弱いとADMに力が入らず弱いと誤りやすい。対側の手で小指基節～PIPをはさみMPを伸展位に保ってEDを代償する。"]},"normalMayBreak":true,"emg":{"position":"仰臥位、前腕回内位で手掌をベッドにつける。","insertion":"小指を外転させ、手の尺側縁に硬く盛り上がる筋腹に手背側から刺入。","activation":"対側の手指で小指を保持し、「指をパーに広げて、私の指を小指で押して」と等尺性に尺側への外転の力を入れさせる。","notes":["被覆皮膚は手掌から手背にまたがり、手背側から刺す方が痛みが少ない。","終板活動が多い、正常でも高振幅MUPが出やすいなど小手筋共通の限界があり、FDIに加えて行う意義は少なく施行頻度は低い。"]},"clinical":["C8・尺骨神経支配でFDIと同様の意義を持つが、physiological weaknessがあるため有用性は一般にFDIに劣る。","UNWのWuタイプ4ではFDIが障害されADMは保たれる。これを示すことが、筆者がADMの針筋電図を行う数少ないケース。","ALSではsplit handのため比較的障害されにくい。physiological weaknessのため軽度の低下が捉えにくい点もFDIに劣る。","錐体路障害ではFDIよりさらに障害されやすい。ヒステリー性麻痺でもFDIが保たれADMが弱くなるのが特徴の一つと考えられ、左右比較でこれを示し、指屈筋反射（Trömner・Hoffmann徴候）に左右差がなければ一側上肢のヒステリー性麻痺を示唆する。"],"page":128,"headText":"C8,T1","rootSrc":"表","nk":"uln","nshort":"尺骨","bookPage":124},{"id":"fpi","kind":"muscle","ja":"第一掌側骨間筋","en":"First palmar interosseous","abbr":"FPI","region":"手","roots":{"C8":3,"T1":1},"rootText":"C8,(T1)","nerve":"尺骨神経","action":"示指の内転","mmt":{"position":"手掌を床に向け、「指を伸ばしたままくっつけて、人差し指を中指側に寄せて」と指示し、MP伸展のまま2～5指を寄せ、検者の示指を被検者の示指と中指ではさませる。","fixation":"非検査手で中指のMP関節部をつかむ。","technique":"検査手の示指を被検者の示指PIP関節の尺側にあて外転方向（橈側）へ力を加え、内転位がbreakされるかを見る。","grading":"重力なしのgrading。","pitfalls":["個人差で健常者でもbreakされることがあり、左右比較が重要。","MPを屈曲すると虫様筋・骨間筋群など他筋による内転力が加わり低下を検出しにくくなる。MP伸展位を保ち、左右でMPの角度を揃えて調べる。"]},"normalMayBreak":true,"emg":{"position":"","insertion":"","activation":"","notes":["筆者は行っていない。"]},"clinical":["錐体路障害で最も早く障害される筋（故中野今治先生の私信として紹介）。"],"page":132,"headText":"(C8,T1)","rootSrc":"見出し","nk":"uln","nshort":"尺骨","bookPage":128},{"id":"lumbricales","kind":"muscle","ja":"虫様筋","en":"Lumbricals","abbr":"","region":"手","roots":{"C8":3,"T1":1},"rootText":"C8,(T1)","nerve":"第一・第二（示指・中指）＝正中神経、第三・第四（環指・小指）＝尺骨神経","action":"各指のMP関節屈曲とPIP・DIP関節伸展","mmt":{"position":"示指～小指のMPを屈曲し、PIP・DIPを伸展した肢位を作れるかで、おおよその筋力を評価する。","fixation":"","technique":"その肢位でPIP伸展保持やMP屈曲保持をbreakする方法もあるが、固定が不十分で他筋との分離も困難なため筆者は行っていない。","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":["筆者は行っていない。"]},"clinical":["尺骨神経麻痺の鷲手（MP過伸展・PIP/DIP屈曲）は虫様筋の筋力低下によるとして有名だが、実際には背側・掌側骨間筋も関与する。","第二虫様筋（2L）はCTS評価のNCSで用いられる。正中神経支配の2Lと尺骨神経支配の第一掌側骨間筋の潜時を比べる2L-IO法は比較法の一つで、2L-CMAPはAPB-CMAPが消失した最重症CTSでも保たれることが多い。"],"page":134,"headText":"(C8,T1)","rootSrc":"見出し","nk":"med","nshort":"正中","bookPage":130},{"id":"neck_flexion","kind":"movement","ja":"頸部前屈","en":"Neck flexors","abbr":"","region":"頸部・体幹","roots":{},"rootText":"C1〜C5（本書見出し）","nerve":"種々","action":"頸部前屈（胸鎖乳突筋・頸長筋・頭長筋・前斜角筋などの複合作用）","mmt":{"position":"仰臥位。「おへそを見るように首を持ち上げて」と指示し、頸部最大前屈位を保持させる。","fixation":"被検者の体重が固定の役割を果たす。","technique":"検査手の示指1本を前額部にあて、breakされるかを見る。","grading":"MMT5・4・3が正確に評価できる。2は座位でおおよそ評価できる。","pitfalls":["何で押すかで健常者がbreakされるかが変わる。手掌を用いるKendallは健常者でも多くbreakされるとし、示指2本を用いる成書もある。筆者は示指1本で、健常者はbreakされず病的低下ならbreakされる閾値を捉えられると感じている。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":["胸鎖乳突筋の項を参照。"]},"clinical":["頸部前屈の障害の有無は多くの疾患で重要な所見となる。","筋炎では最も早く低下する筋の一つだが、多くの筋ジストロフィーでは障害されにくく鑑別に役立つ。ただし筋強直性ジストロフィーとrimmed vacuoleを伴う遠位型ミオパチーでは早期から障害される。","ALSでは障害され得るが、ほとんどの頸椎症では障害されないので鑑別に役立つ。ただしC3/4中心のミエロパチーなど上位頸髄を含む広範な障害では低下し得る。","ALSでは頸部前屈の障害の有無が予後に関係することが示されている。"],"page":137,"rootSrc":"見出し","rec":true,"nk":"cx","nshort":"頸部","bookPage":133},{"id":"scm","kind":"muscle","ja":"胸鎖乳突筋","en":"Sternocleidomastoid","abbr":"SCM","region":"頸部・体幹","roots":{"C3":3,"C4":3,"C5":3},"rootText":"C3,C4,C5","nerve":"副神経脊髄根（いわゆる脊髄副神経 spinal accessory nerve）","action":"頸部回旋","mmt":{"position":"仰臥位。「首を横に回して」と指示し、検査側SCMの反対方向へ回旋した位置を保持させる。","fixation":"非検査手で被検者の対側の肩あたりを押さえる。","technique":"検査手の手掌を頬～下顎部にあて、回旋を戻す方向へ力を加えbreakされるかを見る。","grading":"MMT5・4・2・1・0を評価できる。3の評価として側方回旋位で頭部を前屈させる方法もあるが、SCMだけの正確な筋力ではない。","pitfalls":["頸部回旋には多くの筋が関与するため、回旋力でのSCM評価は参考にとどまる。SCMが強く萎縮する疾患でも回旋力は保たれることがある。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、頸部を側方に軽く回旋した位置。","insertion":"首を回す力を入れさせて同定したSCM筋腹に刺入。","activation":"首を回す力を入れてもらう。","notes":[]},"clinical":["ALSでは脳神経筋あるいは上位頸髄筋として評価対象にできるが、筆者らの検討では僧帽筋より有用性が低く、筆者は対象にしていない。","筋強直性ジストロフィー、rimmed vacuoleを伴う遠位型ミオパチーでは早期から障害される。"],"page":139,"headText":"C3,C4,C5","rootSrc":"見出し","nk":"xi","nshort":"副神経","bookPage":135},{"id":"neck_extension","kind":"movement","ja":"頸部後屈","en":"Neck extensors","abbr":"","region":"頸部・体幹","roots":{},"rootText":"C1〜C8（本書見出し）","nerve":"脊髄神経後枝","action":"頸部後屈（頭板状筋・頸板状筋・頭半棘筋・頸半棘筋・頭最長筋・頸最長筋などの傍脊柱筋群の複合作用）","mmt":{"position":"座位、頭部前後屈中間位で「首を後ろに反らして」と指示する。","fixation":"非検査手で肩を保持する。","technique":"検査手を後頭部にあて前屈方向へ力を加え、breakされるかを見る。","grading":"MMT5・4が評価できる。2もおおまかに評価できる。","pitfalls":["MMT3のための腹臥位での評価は生理的でなく首への負担も大きい。首下がり例では、座位の前屈位から自力で中間位まで戻せるかをMMT3の指標とするのが望ましい。","この方法でも頸部に負担があるので、頸椎症疑いでは急速な粗大運動を起こさないよう注意する。","軽度の低下は見逃し得るが、首下がり症候群で後屈筋力低下の有無をみるにはこれで十分。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":["頭板状筋の項を参照。"]},"clinical":["首下がり症候群（DHS）は比較的多い症候で、Parkinson病、Lewy小体型認知症、ALS、重症筋無力症、筋炎などの炎症性筋疾患、ネマリンミオパチー、顔面肩甲上腕型筋ジストロフィーなど原因は多い。","DHSの鑑別は頸部後屈の筋力低下の有無が出発点となり、Parkinson病に代表されるジストニアによるDHSでは後屈の筋力低下は見られない。"],"page":141,"rootSrc":"見出し","rec":true,"nk":"dr","nshort":"後枝","bookPage":137},{"id":"splenius_capitis","kind":"muscle","ja":"頭板状筋","en":"Splenius capitis","abbr":"","region":"頸部・体幹","roots":{"C2":3,"C3":3},"rootText":"C2,C3","nerve":"脊髄神経後枝","action":"頸部後屈（頭部後屈）","mmt":{"position":"頸部後屈の項を参照。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"側臥位、枕で後頭部～脊柱のラインをまっすぐにし、頸部は軽度前屈位。","insertion":"頭を軽く後ろに反らさせ、後頭骨の上項線から斜め下方に走る筋腹を同定し、中位頸椎棘突起の外方約3cm（髪の生え際付近～髪の中）で刺入。","activation":"対側の手を後頭部にあて、首を軽く後ろに反らしてもらう。","notes":["安静時は頸部前屈位で力を抜かせ、活動が残れば他動的に前屈を強めると消えることが多い。"]},"clinical":["DHSの評価で重要な筋。ALSでは明確な神経原性変化を示し、それ以外の疾患では筋原性変化が多い。","豊富な安静時活動があれば筋炎やisolated neck extensor myopathyなど炎症性筋疾患を疑う。安静時活動がほとんどなく単線維筋電図（SFEMG）で強い異常があれば重症筋無力症を考える。","Parkinson病の首下がりでも頭板状筋に安静時活動と筋原性変化を認め、炎症性筋疾患の関与を示唆した報告がある。"],"page":143,"headText":"C2,C3","rootSrc":"見出し","nk":"dr","nshort":"後枝","bookPage":139},{"id":"cervical_paraspinal","kind":"muscle","ja":"頸部傍脊柱筋","en":"Cervical paraspinal muscles","abbr":"PSM","region":"頸部・体幹","roots":{},"rootText":"各髄節（C5〜T1を検査）","nerve":"脊髄神経後枝","action":"","mmt":{"position":"MMTは対象外。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"調べたい側を天井側にした側臥位、枕使用。「おへそを見るように」と頸部をなるべく強く前屈し、頸部後面を床面に正確に垂直にする。","insertion":"MRI矢状断も参考に対象髄節の棘突起を同定し、その1.5～2cm外側（天井側）から刺入。頭尾方向は皮膚面に垂直、内外側方向はわずか（約15度）内方へ進める。","activation":"随意収縮は評価していない（安静時活動のみ）。","notes":["針を徐々に進めて安静時活動を探し、椎弓の骨に当たったらそこまで。骨の直前数mm～1cmが多裂筋。","約9割で十分な弛緩が得られる。収縮が残れば身体を揺する、前額部に手をあてて軽く前屈させるなどが有効なことがある。","随意収縮MUPが小さく線維自発電位と紛らわしいことがあり、終板棘波も比較的多い。規則的に発火する電位のみを線維自発電位とする。"]},"clinical":["頸部神経根症の証明でPSMの脱神経は大きな価値がある。対応する上肢筋と同一髄節に脱神経があれば、後枝分岐部より近位の髄節性障害、すなわち神経根症（ないし脊髄症）の直接的証明となる。頸椎症性筋萎縮症（CSA）の診断にも有用。","多裂筋は隣接する椎骨に対応する単一髄節支配と考えられ、想定髄節に対応する棘突起（C8障害ならT1椎、T1障害ならT2椎）の真横で調べる。脱神経がなければ1つ下の椎体レベルで試すか、やや外側へ向ける（外側ほど頭側髄節支配）。"],"page":145,"rootSrc":"見出し","nk":"dr","nshort":"後枝","bookPage":141},{"id":"thoracic_paraspinal","kind":"muscle","ja":"胸部傍脊柱筋","en":"Thoracic paraspinal muscles","abbr":"PSM","region":"頸部・体幹","roots":{},"rootText":"各髄節（著者はT10で施行）","nerve":"脊髄神経後枝","action":"","mmt":{"position":"MMTは対象外。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"調べたい側をベッド側にした側臥位。腰椎穿刺と同様に頸部前屈・背中を丸め股・膝を屈曲（天井側の下肢を強く曲げる）、背部後面を床面に垂直にし、枕を使う。","insertion":"Jacoby線から数えてT10棘突起を同定し、その約3cm外側（ベッド側）から刺入。頭尾方向は皮膚面にほぼ垂直、内外側方向はまっすぐ真前方かわずか内方（上方）へ進める。","activation":"天井側（検査対側）の上肢を肘を伸ばして同側の耳につけ、検者が上腕後面に手をあてて後方へ反らしてもらうと、ベッド側のPSMを賦活できる。","notes":["安静時は身体を揺すって全身の力を抜かせ、天井側の上肢を身体の前方にだらんと垂らさせるとよい。"]},"clinical":["ALSの診断で第一に重要。脱神経の出現率は高いが、完全な安静が取りにくく線維束自発電位を認識できることは多くない。胸髄領域は1筋で下位運動ニューロン障害を診断できるが、R-EEC・Awaji基準とも脱神経と随意収縮時所見の両方が必要。","異常があればALSの可能性が高く診断的価値は高いが、大きな姿勢変換が必要で痛みも強いとされ、筆者はあまり好まない。","筆者はT10（安静が取りやすい印象）で行うが、T6などで行う場合もある。","筋炎でも傍脊柱筋が唯一の異常となることがあり、その場合は胸部PSMを選ぶとよい。","腰部傍脊柱筋は神経根症の診断に使われることもあるが、高齢健常者でも脱神経が出るとの報告（反対意見もある）があり、筆者は行っていない。"],"page":147,"rootSrc":"見出し","nk":"dr","nshort":"後枝","bookPage":143},{"id":"iliopsoas","kind":"muscle","ja":"腸腰筋（大腰筋＋腸骨筋）","en":"Iliopsoas (Psoas major + Iliacus)","abbr":"","region":"股関節・大腿","roots":{"L3":2,"L4":2},"rootText":"L3,L4","nerve":"大腿神経、腰神経根","action":"股関節屈曲","mmt":{"position":"仰臥位で股・膝関節とも90度屈曲。「足を自分の方に引っ張って」と指示し股屈曲の力を入れて保持させる。","fixation":"被検者の体重が固定の役割を果たす。","technique":"前腕屈側（または手）を大腿遠位前面に当てて股伸展方向に押し、肢位をbreakできるかを見る。MMT3の有無は端座位で大腿を持ち上げられるかで判定。","grading":"仰臥位と端座位の併用で5・4・3を評価。2は仰臥位でおおよそ評価可能（側臥位なら正確）。股屈曲位では筋腹を触れにくく0と1の区別は困難。","pitfalls":["大腰筋と腸骨筋は分けず腸腰筋として一括評価する。","端座位での評価は上半身の固定が不十分で軽微な低下を見逃す。仰臥位なら体重で固定され5かどうかの判定が正確になる。","軽微な低下が疑われるときは股屈曲を120度程度の鈍角にするとモーメントが弱まり検出しやすい。","伸展位から下肢を持ち上げる方法は大腿直筋の作用が優位で腸腰筋の評価に不適。健常者でもbreakされやすい。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、股関節伸展。","insertion":"上前腸骨棘から遠位内側へ向かう縫工筋・大腿直筋の筋腹、大腿動脈の拍動、鼠径靱帯のラインの三者で囲まれる三角形の中央。股・膝を軽く屈曲させて収縮を確認し、針をあまり傾けずに刺入。","activation":"股・膝関節を軽く屈曲してもらう。安静時は下肢を自然な軽度外旋位にすると弛緩が得られる。","notes":["頭側にずれると腹腔内、内側に寄ると大腿神経・大腿動脈に入る。遠位に放散する強い痛みは大腿神経の可能性があり針を戻す。","初心者は危険を恐れて尾側・外側に寄りすぎ、縫工筋や大腿直筋を検査してしまいがち。三角形と底の収縮を確実に同定する。","正常でも複合反復放電（CRD）がみられることがある。"]},"clinical":["成書の多くはL2〜L3支配とするが、著者らの検討ではL4が主でL3が次ぐ。L4障害で明確な筋力低下をきたす。","筋炎で早期から筋力低下をきたす筋の一つで、Fib/PSWの検出感度は四肢筋で最も高い印象。上腕二頭筋で陰性なら次に腸腰筋を検査する。","錐体路障害で下肢で最も早く筋力低下をきたす筋（母趾伸展とほぼ同等の感度）。下肢筋力低下が中枢性か下位運動ニューロン性かの鑑別に針筋電図が役立つことがある。"],"page":149,"headText":"L3,L4","rootSrc":"表","nk":"fem","short":"腸腰筋","nshort":"大腿","bookPage":145},{"id":"gluteus_maximus","kind":"muscle","ja":"大殿筋","en":"Gluteus maximus","abbr":"GMax","region":"股関節・大腿","roots":{"L5":1,"S1":2,"S2":1},"rootText":"S1,(L5,S2)","nerve":"下殿神経","action":"股関節伸展","mmt":{"position":"方法1：仰臥位、股・膝伸展位で「足をベッドに押し付けて」と指示し保持。方法2：仰臥位、股関節135度程度屈曲・膝屈曲で足をベッドにつけ、股を伸展する力を入れて保持。","fixation":"非検査手で骨盤の上前腸骨棘付近を強く押さえる。","technique":"前腕屈側を膝の後面に当てて持ち上げ、各肢位をbreakできるかを見る（両方法共通）。","grading":"5・4は評価できるが、他はおおよその目安。2と3の区別はできない。","pitfalls":["方法1は感度が低い。方法2では多くの健常者が検者に勝って股を伸展してしまい肢位保持自体が難しいが、方法1でbreakできない軽度低下を拾えることがあるので方法1→2の順に試す。","成書の腹臥位で下肢を後方に挙上する方法は非生理的で健常者でもbreakされやすく、体位変換も要するため著者は用いない。","Danielsの、方法1の肢位で被検者の身体全体を持ち上げて股が曲がらないか（体重をGMaxで支えられるか）を見る方法も良い方法で、併用してよい。","著者の方法でも軽度の低下は検出できず感度は高くない。仰臥位でできることと、正常者で必ずbreakされないことを優先した方法である。"]},"normalMayBreak":false,"emg":{"position":"腹臥位。","insertion":"下肢全体を後方に持ち上げてもらい、殿部に同定される筋腹に刺入。","activation":"股関節を軽く後方に伸展して下肢を持ち上げる。安静時は腹臥位のまま全身の力を抜く。","notes":[]},"clinical":["錐体路障害では下肢で最も筋力低下をきたしにくい。腸腰筋がMMT1〜2でもGMaxは5のことがあり、完全麻痺の回復過程でも最初に動き始める。","S1中心とされるが、S1障害でも筋力低下はほとんどなく針筋電図変化も軽い。多髄節支配の可能性があり、針筋電図の有用性は高くない。","錐体路性・髄節性の障害で低下しにくく、ミオパチーでもジストロフィノパチーを除けば障害されにくい（筋炎でも腸腰筋より少ない）。","一方ヒステリー性麻痺ではほとんどの例で低下する（Hoover徴候もこれを利用）。著者の方法でGMaxの低下を認めたら高い確率でヒステリー性麻痺を疑う。"],"page":154,"headText":"(L5,S1)","rootSrc":"表","nk":"ig","nshort":"下殿","bookPage":150},{"id":"gluteus_medius","kind":"muscle","ja":"中殿筋","en":"Gluteus medius","abbr":"GMed","region":"股関節・大腿","roots":{"L5":3,"S1":1},"rootText":"L5,(S1)","nerve":"上殿神経","action":"股関節外転","mmt":{"position":"仰臥位、膝伸展で両下肢を各15度程度外転、内外旋中間位（極端な外旋位を避ける）。「両足を開いて」と指示し保持。","fixation":"両下肢同時なら左右が互いに固定となる。一側ずつ行う場合は対側下肢を固定。","technique":"両手を両下腿遠位の外果付近に当て、内転方向に押して肢位をbreakできるかを見る。","grading":"5・4・2・1・0を正確に評価できる。この方法では2と3の区別はない。","pitfalls":["GMedが弱い人は下肢を外旋して外転しようとする（大腿直筋などで代償できる）。内外旋中間位を保つ。","MMT3は側臥位で評価できるが、体位変換が必要なので著者は通常行わない。"]},"normalMayBreak":false,"emg":{"position":"仰臥位。","insertion":"下肢全体を外転させると腸骨稜から大転子へ延びる筋腹が同定できる。腸骨稜から数cm遠位、体の前後径中央〜やや後方寄りで刺入。","activation":"対側の手を大腿遠位〜膝外側に当て、股関節を軽く外転させる。安静時は全身の力を抜く。","notes":[]},"clinical":["錐体路障害では比較的早期に低下し、感度は腸腰筋・足趾伸筋に次ぐ印象。","L5支配だが総腓骨神経支配でない最近位の筋。下垂足例で筋力低下があればL5障害を示唆する重要所見。ただしL5による下垂足でもGMed低下は約半数で、正常でもL5障害は否定できない（その場合TFLの針筋電図が重要）。","針筋電図ではパンツを下ろす必要があるため、著者は主にTFLを検査する。","一側性または左右差のある下肢外転の低下があれば、器質性麻痺とヒステリー性麻痺の鑑別にSonoo外転試験を用いることができる。"],"page":158,"headText":"L5,S1","rootSrc":"表","nk":"sg","nshort":"上殿","bookPage":154},{"id":"tensor_fasciae_latae","kind":"muscle","ja":"大腿筋膜張筋","en":"Tensor fasciae latae","abbr":"TFL","region":"股関節・大腿","roots":{"L4":1,"L5":3},"rootText":"L5,(L4)","nerve":"上殿神経","action":"股関節外転","mmt":{"position":"中殿筋で調べる下肢外転に含まれ、独立した評価はできない。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位。","insertion":"起始は上前腸骨棘から後方7〜8cmの腸骨稜。外転させて、そこから尾側へ約15cm伸びる筋腹（遠位は腸脛靱帯に移行、大転子のやや前方近位）を同定し中央に刺入。萎縮が強ければ想定される部位に刺入。","activation":"対側の手を大腿遠位〜膝外側に当て、股関節を軽く外転させる。","notes":[]},"clinical":["中殿筋と並びL5だが総腓骨神経支配でない最近位の筋。パンツを下ろさず尾側から到達できるので、著者は針筋電図でTFLを好んで用いる。","下垂足をきたすL5障害例では、外転筋力低下が明らかでなくてもTFLの針筋電図はほとんどで高度の変化を示し、有用性が非常に高い。"],"page":160,"headText":"L5","rootSrc":"表","nk":"sg","nshort":"上殿","bookPage":156},{"id":"hip_adductors","kind":"movement","ja":"内転筋群（股関節内転）","en":"Hip (leg) adductors","abbr":"","region":"股関節・大腿","roots":{"L2":2,"L3":2,"L4":2},"rootText":"L2,L3,L4","nerve":"閉鎖神経","action":"股関節内転（大内転筋・長内転筋・短内転筋・恥骨筋・薄筋など）","mmt":{"position":"仰臥位、股・膝伸展で両下肢を内転して付けた位置。「両足を閉じて」と指示し保持。","fixation":"","technique":"両手を両下腿遠位の内果付近に当て、外転方向に力を加えてbreakできるかを見る。MMT2は適度な外転位から正中まで内転できるかで判定。","grading":"5・4・2・1・0を正確に評価できる。2と3の区別はない。","pitfalls":["必要に応じて一側ずつ検査してもよい。","MMT3は側臥位で評価できなくはないが、過内転の非生理的動作になるため著者は行わない。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":["各構成筋の項で記載。"]},"clinical":["錐体路障害では筋力低下をきたしにくい。","高位腰髄の髄節性障害は少ないため障害されにくい。内転＝外転、あるいは内転＞外転の低下はヒステリー性筋力低下の特徴。","筋疾患ではGNEミオパチー（DMRV）で早期に障害される。"],"page":162,"headText":"L2,L3,L4（大内転筋はより広汎）","rootSrc":"見出し","nk":"obt","short":"内転筋群","nshort":"閉鎖","bookPage":158},{"id":"adductor_longus","kind":"muscle","ja":"長内転筋","en":"Adductor longus","abbr":"AL","region":"股関節・大腿","roots":{"L2":1,"L3":2,"L4":1},"rootText":"L3,(L2,L4)","nerve":"閉鎖神経","action":"股関節内転","mmt":{"position":"下肢内転に含まれ、独立した評価はできない。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位、股関節軽度外転。","insertion":"軽度外転位から内転方向に力を入れさせ、大腿近位1/3より近位で、薄筋の前方を恥骨部から外側尾側へ斜めに走る索状の筋腹に刺入。","activation":"対側の手を大腿遠位〜膝内側に当て、軽く内転させる。安静時は下肢全体の力を抜く。","notes":[]},"clinical":["薄筋と並び、閉鎖神経支配筋で針筋電図評価が可能な数少ない筋。純粋な内転筋では唯一。","DMRVなど内転筋群の障害が強い全身疾患で評価が役立つことがある。"],"page":164,"headText":"L2,L3,L4","rootSrc":"表","nk":"obt","nshort":"閉鎖","bookPage":160},{"id":"adductor_magnus","kind":"muscle","ja":"大内転筋","en":"Adductor magnus","abbr":"","region":"股関節・大腿","roots":{"L2":2,"L3":2,"L4":2,"L5":2,"S1":2},"rootText":"L2,L3,L4,L5,S1","nerve":"閉鎖神経、坐骨神経","action":"股関節内転","mmt":{"position":"下肢内転に含まれ、独立した評価はできない。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"","insertion":"大腿中央の高さで、薄筋の後方・半膜様筋の前方の隙間の表層に位置し、検査は可能。","activation":"","notes":["下記の理由で実際に行うことは少ない。"]},"clinical":["閉鎖神経と坐骨神経の二重支配とされ筋節も明確でなく、局在診断上の意義は乏しい。"],"page":166,"headText":"L2,L3,L4,L5,S1","rootSrc":"見出し","nk":"obt","nshort":"閉鎖","bookPage":162},{"id":"sartorius","kind":"muscle","ja":"縫工筋","en":"Sartorius","abbr":"","region":"股関節・大腿","roots":{"L2":3,"L3":1},"rootText":"L2,(L3)","nerve":"大腿神経","action":"股関節屈曲・外旋位で下肢を前方に挙上","mmt":{"position":"分離しての評価は困難。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位。","insertion":"股関節軽度屈曲・外旋、膝軽度屈曲位で下肢を天井側へ挙上させると、上前腸骨棘から脛骨内側顆（鵞足）へ大腿前面を斜めに横切る幅数cmの筋腹が同定でき、これに刺入。","activation":"同肢位のまま下肢を天井側へ軽く挙上する力を入れる。安静時はその肢位で力を抜く。","notes":[]},"clinical":["L2支配が主体と思われ、著者が筋節の経験を持つ下肢筋で最も上位の髄節。この点で有用性があるかもしれない。"],"page":168,"headText":"L2,L3","rootSrc":"表","nk":"fem","nshort":"大腿","bookPage":164},{"id":"quadriceps","kind":"movement","ja":"大腿四頭筋（膝関節伸展）","en":"Quadriceps femoris","abbr":"QF","region":"股関節・大腿","roots":{"L3":3,"L4":3},"rootText":"L3,L4","nerve":"大腿神経","action":"膝関節伸展（大腿直筋・内側広筋・外側広筋・中間広筋）","mmt":{"position":"仰臥位、股関節30〜45度屈曲。「膝をピーンと伸ばして、膝から下を持ち上げて」と指示し、膝をわずかに屈曲した伸展位で保持。","fixation":"非検査側前腕の屈側を膝の後面に当て、空中でしっかり支える（固定手に強い下向きの力がかかる）。","technique":"検査手を下腿遠位前面に当てて押し下げ、伸展位をbreakできるかを見る。","grading":"5・4・3を正確に評価できる。2は側臥位が必要で面倒。筋腹は容易に触れるので1と0の区別が可能。","pitfalls":["完全伸展ではロックがかかるため、わずかな屈曲位で検査する。","強い筋なので伸展位では軽度低下を見逃す。膝を60度（さらに感度を上げるなら90度）屈曲位にすると検出しやすく、左右同じ角度で比べる。","著者は伸展位ではbreakされず60度屈曲位でbreakされる場合をMMT4+としている。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":["各構成筋の項で記載。"]},"clinical":["抗重力筋で、錐体路障害では筋力低下をきたしにくい。","封入体筋炎、ジストロフィノパチー（Duchenne型・Becker型）では早期から低下するが、GNEミオパチー（DMRV）では保たれることがよく知られる。"],"page":170,"headText":"L3,L4","rootSrc":"見出し","nk":"fem","short":"大腿四頭筋","nshort":"大腿","bookPage":166},{"id":"rectus_femoris","kind":"muscle","ja":"大腿直筋","en":"Rectus femoris","abbr":"RF","region":"股関節・大腿","roots":{"L3":1,"L4":3},"rootText":"L4,(L3)","nerve":"大腿神経","action":"膝関節伸展（大腿四頭筋で記載）。下前腸骨棘から起こる2関節筋で、伸展位から膝を伸ばしたまま股をわずかに挙上する時に主に働く","mmt":{"position":"大腿四頭筋で記載。分離しての評価は行っていない。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位、股・膝関節とも伸展。","insertion":"膝伸展のまま下肢を挙上させると、下前腸骨棘から膝蓋骨へ向かう幅4〜5cmの筋腹が触れる。大腿中央よりやや近位で、筋腹の内外側中央に刺入。","activation":"膝後面に手を置き「足をベッドに押し付けて」、または「膝を伸ばしたまま下肢を持ち上げて」と指示。不十分なら膝下に適当な高さの枕を入れて「膝をピーンと伸ばして」と指示。","notes":["ベッドに押し付ける方法では十分強い収縮が得られないことがあり、その場合は枕を置く方法をとる。","枕法では下腿前面からの抵抗と同時に下腿後面も支え、力が抜けた時に膝が急に屈曲しないよう等尺性を保つ。やや硬い筋なので針の曲がりに注意。","QFに共通して随意収縮MUPはやや大きく、神経原性変化と紛らわしいことがある。"]},"clinical":["QFの中では比較的わかりやすく、検査によく用いられる。","QFのうちL4支配が強いと考えられる。"],"page":172,"headText":"L3,L4","rootSrc":"表","nk":"fem","nshort":"大腿","bookPage":168},{"id":"vastus_medialis","kind":"muscle","ja":"内側広筋","en":"Vastus medialis","abbr":"VM","region":"股関節・大腿","roots":{"L3":3,"L4":1},"rootText":"L3,(L4)","nerve":"大腿神経","action":"膝関節伸展（大腿四頭筋で記載）。RF以外の3筋は1関節筋","mmt":{"position":"大腿四頭筋で記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位、股・膝関節とも伸展。","insertion":"膝後面に手を入れて下肢をベッドに押し付けさせる（または伸展挙上）と膝蓋骨上端の数cm近位内側に筋腹が盛り上がる。膝蓋骨上端から約5cm近位（大腿の遠位1/4付近）の筋腹中央に刺入。","activation":"膝後面に手を置き「足をベッドに押し付けて」と指示。不十分なら枕を置いて「膝をピーンと伸ばして」。","notes":["注意点はRFと共通。QF中で最も遠位にあり、ズボンをめくって検査しやすい。","安静時活動（特に線維束自発電位）は筋の内側寄り、しっかりしたMUPは外側寄り（RFに近い側）で得られやすい。針先の向きを使い分ける。","筋の揺らぎが残る時は下肢全体を内外旋するように揺すると弛緩する。"]},"clinical":["著者らはALSの評価筋として好んで用いる。線維束自発電位の出現頻度も高い。","QFのうちL3支配が強いと考えられる。"],"page":174,"headText":"L3,L4","rootSrc":"表","nk":"fem","nshort":"大腿","bookPage":170},{"id":"vastus_lateralis","kind":"muscle","ja":"外側広筋","en":"Vastus lateralis","abbr":"VL","region":"股関節・大腿","roots":{"L3":2,"L4":1},"rootText":"L3,(L4)","nerve":"大腿神経","action":"膝関節伸展（大腿四頭筋で記載）。1関節筋","mmt":{"position":"大腿四頭筋で記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位、股・膝関節とも伸展。","insertion":"膝後面に手を入れて下肢をベッドに押し付けさせると、大腿前面外側に広く盛り上がる筋腹の中央（大腿全長のほぼ中央の高さ）に刺入。","activation":"膝後面に手を置き「足をベッドに押し付けて」と指示。不十分なら枕を置いて「膝をピーンと伸ばして」。","notes":["注意点はRFと共通。"]},"clinical":["大きい筋で筋生検の好適筋。全身性ミオパチーで生検との対応を見る場合に選ぶ。同一筋で両方行う時は膝蓋骨上端からの距離を決め、針操作はそれより遠位、生検はそれより近位とする。","筋節については確実なデータを持っていない。"],"page":176,"headText":"(L3,L4)","rootSrc":"表","nk":"fem","nshort":"大腿","bookPage":172},{"id":"hamstrings","kind":"movement","ja":"大腿屈筋群（膝関節屈曲）","en":"Hamstrings (knee flexors)","abbr":"","region":"股関節・大腿","roots":{"L5":3,"S1":3},"rootText":"L5,S1","nerve":"脛骨神経（半腱様筋・半膜様筋・大腿二頭筋長頭）、総腓骨神経（大腿二頭筋短頭）、閉鎖神経（薄筋）","action":"膝関節屈曲。大腿二頭筋短頭以外は骨盤から下腿に至る2関節筋、短頭のみ膝だけをまたぐ1関節筋（半腱様筋・半膜様筋・大腿二頭筋長短頭・薄筋。厳密なhamstringsは薄筋を除く4筋）","mmt":{"position":"仰臥位、股関節90度・膝関節90度屈曲。「膝を曲げて」と指示し保持。","fixation":"非検査側の手で膝をつかんで固定。","technique":"前腕遠位屈側を下腿遠位後面に当てて押し上げ、膝90度屈曲位をbreakできるかを見る。","grading":"5・4・1は評価できる。2は側臥位にしないと正確には困難で、おおよそのgradingとなる。","pitfalls":["MMT3評価のための腹臥位・股伸展での膝屈曲は2関節筋が力を発揮できず短頭のみの評価になり、正常者でもbreakされない肢位を見つけにくい。","軽度低下の検出には膝70度程度のわずかに鈍角の屈曲位で試すとよいことがある。左右対称の肢位で行う。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":["各構成筋の項で記載。"]},"clinical":["錐体路障害で比較的障害されやすいが、腸腰筋・母趾背屈ほどではない。","髄節性病変ではL5単独障害でほとんど低下せず、L5/S1の2髄節が障害されて初めて低下する。"],"page":178,"headText":"L5,S1（薄筋は主にL3）","rootSrc":"見出し","nk":"sci","short":"大腿屈筋群","nshort":"坐骨","bookPage":174},{"id":"semitendinosus","kind":"muscle","ja":"半腱様筋","en":"Semitendinosus","abbr":"ST","region":"股関節・大腿","roots":{"L5":3,"S1":1},"rootText":"L5,(S1)","nerve":"脛骨神経","action":"膝関節屈曲（大腿屈筋群で記載）","mmt":{"position":"大腿屈筋群（膝屈曲）で記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"腹臥位、股関節伸展、膝60〜90度屈曲位。","insertion":"膝を曲げる力を入れさせ、膝窩内側から近位へ幅約3cmの索状に硬く延びる筋腹を同定し、大腿中央付近の高さで刺入。","activation":"安静時は膝伸展で力を抜く。随意収縮時は針を一旦皮下まで抜き、膝60〜90度屈曲位で再同定して刺入。下腿を保持して「膝を曲げて」と指示。","notes":["名前の通り腱かと思う硬さだが、普通に筋腹である。","安静時（伸展位）と随意収縮時（屈曲位）で肢位が変わるため、断裂防止に一旦皮下まで抜く。収縮中も下腿を保持し急な伸展を防いで等尺性を保つ。"]},"clinical":["大腿屈筋群のうちL5支配の筋で、L5神経根症と腓骨神経麻痺の鑑別に役立つ筋の一つ。"],"page":180,"headText":"L5,S1","rootSrc":"表","nk":"sci","nshort":"坐骨","bookPage":176},{"id":"semimembranosus","kind":"muscle","ja":"半膜様筋","en":"Semimembranosus","abbr":"","region":"股関節・大腿","roots":{"L5":3,"S1":1},"rootText":"L5,(S1)","nerve":"脛骨神経","action":"膝関節屈曲（大腿屈筋群で記載）","mmt":{"position":"大腿屈筋群（膝屈曲）で記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"","insertion":"大腿中央の高さでSTの内側に位置する。","activation":"","notes":["STと同じ意義と考えられ、同定しやすいSTを通常検査するため、著者は検査経験がほとんどない。"]},"clinical":["筋節はSTと同じくL5中心と思われるが確証はない。"],"page":180,"headText":"要確認（見出しに筋節記載なし。本文ではSTと同じL5中心と思われるが確証はないとされる）","rootSrc":"表","nk":"sci","nshort":"坐骨","bookPage":176},{"id":"biceps_femoris_long","kind":"muscle","ja":"大腿二頭筋長頭","en":"Biceps femoris, long head","abbr":"BFLH","region":"股関節・大腿","roots":{"L5":1,"S1":3,"S2":1},"rootText":"S1,(L5,S2)","nerve":"脛骨神経","action":"膝関節屈曲（大腿屈筋群で記載）","mmt":{"position":"大腿屈筋群（膝屈曲）で記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"腹臥位、股関節伸展、膝関節わずかに屈曲。","insertion":"膝を曲げる力を入れさせ、腓骨頭から近位へ伸びる腱とその延長上、ST筋腹の外側にある幅4〜5cmの索状の筋腹を同定し、大腿中央付近で刺入。","activation":"安静時は膝伸展で力を抜く。随意収縮時は針を一旦皮下まで抜き、膝を30度程度屈曲させて再刺入。下腿を保持して「膝を曲げて」と指示。","notes":["STは膝90度近く曲げた方が同定しやすいが、BFLHはわずかに曲げた肢位の方が同定しやすい。"]},"clinical":["大腿屈筋群のうちS1支配の筋。"],"page":182,"headText":"L5,S1","rootSrc":"表","nk":"sci","nshort":"坐骨","bookPage":178},{"id":"biceps_femoris_short","kind":"muscle","ja":"大腿二頭筋短頭","en":"Biceps femoris, short head","abbr":"BFSH","region":"股関節・大腿","roots":{"L5":1,"S1":3,"S2":1},"rootText":"S1,(L5,S2)","nerve":"総腓骨神経","action":"膝関節屈曲（大腿屈筋群で記載）","mmt":{"position":"大腿屈筋群（膝屈曲）で記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"腹臥位、股関節伸展、膝関節わずかに屈曲。","insertion":"筋腹を直接触れるのは難しい。膝窩中央から約5cm近位で同定できるBFLH腱に接して、わずか（1〜2cm以内）内側に刺入。","activation":"下腿を保持して「膝を曲げて」と指示し、膝を30度程度屈曲させる。","notes":["筋腹はBFLH腱の外側にもあるが、内側の方が幅が広く安心して検査できる。"]},"clinical":["大腿屈筋群で唯一の総腓骨神経支配として下垂足の局在診断に有用と記載されることが多いが、主にS1支配で、L5障害では正常か所見は軽度。","「TA異常・BFSH正常」は腓骨頭部の腓骨神経麻痺とL5神経根症の両方に共通し、これで腓骨頭部病変と局在すると誤りになりやすい。","TFLなど、より近位のL5筋が正常と証明できて初めて、BFSHの所見から坐骨神経〜総腓骨神経走行中の局在診断が可能になる。"],"page":184,"headText":"L5,S1","rootSrc":"表","nk":"sci","nshort":"坐骨","bookPage":180},{"id":"gracilis","kind":"muscle","ja":"薄筋","en":"Gracilis","abbr":"","region":"股関節・大腿","roots":{"L2":1,"L3":3,"L4":3},"rootText":"L3,L4,(L2)","nerve":"閉鎖神経","action":"膝関節屈曲（大腿屈筋群で記載）","mmt":{"position":"大腿屈筋群（膝屈曲）で記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"腹臥位または仰臥位。","insertion":"膝を曲げる力を入れさせて脛骨内側顆から近位に伸びるSTの硬い筋腹を同定し、その前方を同じく脛骨内側顆から恥骨へ向かう幅約3cmの長い索状の筋腹に、大腿中央の高さで刺入。","activation":"下腿を保持して「膝を曲げて」と指示し、膝をわずかに屈曲させる。仰臥位では股関節も少し屈曲が必要。","notes":["腹臥位の方が全容が見えて容易だが、仰臥位でも大腿内側面で検査可能。他の屈筋群に続けるなら腹臥位、大腿四頭筋に続けるなら仰臥位のままがよい。","膝を大きく曲げなければ、安静時から随意収縮時に皮下まで抜く必要はない場合もある。","最表層の細長い索状物として触れる。後方の半膜様筋・ST、前方の縫工筋（鵞足を形成）も同定し、確実に薄筋に刺す。"]},"clinical":["屈筋群に含まれるが、L5/S1支配の他筋とは筋節が全く異なる。hamstrings異常を確認後、薄筋が完全に正常なら腰仙部の髄節性障害（または坐骨神経障害）が明確になる。","L3障害か大腿神経障害かの鑑別にも用いうる。"],"page":186,"headText":"L2,L3","rootSrc":"表","nk":"obt","nshort":"閉鎖","bookPage":182},{"id":"tibialis_anterior","kind":"muscle","ja":"前脛骨筋","en":"Tibialis anterior","abbr":"TA","region":"下腿・足","roots":{"L4":2,"L5":3},"rootText":"L5＋L4","nerve":"深腓骨神経","action":"足関節背屈、背屈位での内反","mmt":{"position":"仰臥位、股・膝伸展。「足首を上に反らして」と指示し、足関節最大背屈位を保持。","fixation":"被検者の体重が固定となるが、非検査手で下腿を握っておくとよい。","technique":"検査手を足背に当てて底屈方向に押し、最大背屈位をbreakできるかを見る。","grading":"5・4・2・1を正確に評価できる。足関節より遠位の運動では重力効果がないため、3を除いたgradingとする（Danielsでも重力効果のない筋として記載）。","pitfalls":["最大背屈位のTAは相当強く、軽度低下を見逃しうる。最大背屈前の中間位ならより軽度の低下を検出できる可能性があるが、著者は行っていない。"]},"normalMayBreak":false,"emg":{"position":"仰臥位。","insertion":"足関節を背屈させると脛骨縁外側に幅3〜4cmの筋腹が盛り上がる。最も盛り上がった部分、筋腹全長の近位1/3付近に刺入（もう2〜3cm近位でもよい）。","activation":"非検査手で足を持ち「足首を上に反らして」と指示。力が抜けた時の大きな底屈を防ぐため、足底側にも手をかけておく。安静時は自然な背屈位で力を抜く。","notes":["硬い筋なので等尺性を保ち、筋断裂・針の曲がりを防ぐ。","加齢に伴う潜在性の変化で神経原性変化が出やすく、軽度〜中等度の神経原性変化は病的と判断できないことがある。","GcMHほどではないが、正常でも線維束自発電位が出うる筋とされる。"]},"clinical":["TAの麻痺で下垂足をきたす。原因は総・深腓骨神経麻痺、L5神経根障害のほか、坐骨神経麻痺、仙骨神経叢障害、ミオパチー、ALS、錐体路障害（典型的ではないが円蓋部病変では起こりうる）など。","最も多いL5神経根障害と腓骨神経麻痺の鑑別は、総腓骨神経支配以外のL5筋や大腿二頭筋短頭の項を参照。","ミオパチーではDMRV（GNEミオパチー）で早期に障害されることが有名だが、下腿屈筋や近位筋から始まる例もある。","L5支配が中心と考えられるが、他のL5筋よりやや上位で、L5障害なのにTAの麻痺が他筋より軽い例が時にある。","錐体路障害で障害されやすいとされるが、多くは腸腰筋・大腿外転・大腿屈筋より後に障害される。「錐体路障害は遠位筋優位」は下肢では必ずしも成り立たない。","ALSでよく選ばれる被検筋。VMに比べFib/PSWは出やすいが線維束自発電位は出にくく、不規則な線維自発電位（irregular fibrillation potential）がしばしばみられる。"],"page":188,"headText":"L4,L5","rootSrc":"表","nk":"dp","nshort":"深腓骨","bookPage":184},{"id":"toe_extensors","kind":"movement","ja":"足趾背屈（長趾伸筋・短趾伸筋）","en":"Toe extensors","abbr":"","region":"下腿・足","roots":{"L5":3},"rootText":"L5","nerve":"深腓骨神経","action":"足趾の背屈","mmt":{"position":"仰臥位、股・膝伸展、足関節軽度背屈位。「足の指を上に（自分の頭の方に）反らして」と指示し、足趾最大背屈位を保持。","fixation":"非検査手で足部を保持。","technique":"検査手の指1本を第2〜5趾の趾背に当てて底屈方向に押し、主に中足趾節関節の最大背屈位をbreakできるかを見る。","grading":"重力なしのgrading。0と1の区別には下腿前面での長趾伸筋筋腹の同定が必要。","pitfalls":["長趾伸筋と短趾伸筋の作用は分離できないので、toe extensorsとして総称する。","健常者でもbreakされる人が、多くはないが存在する。"]},"normalMayBreak":true,"emg":{"position":"","insertion":"","activation":"","notes":["各筋の項で記載。"]},"clinical":["TAと同様、L5障害でも総・深腓骨神経麻痺でも障害される。","錐体路障害ではTAより高頻度に低下するが、母趾背屈ほどではない。"],"page":192,"headText":"L5","rootSrc":"見出し","nk":"dp","short":"足趾背屈","nshort":"深腓骨","bookPage":188},{"id":"extensor_digitorum_longus","kind":"muscle","ja":"長趾伸筋","en":"Extensor digitorum longus","abbr":"EDL","region":"下腿・足","roots":{"L5":3},"rootText":"L5","nerve":"深腓骨神経","action":"足趾背屈。末節に終止するが、実際にはMP・PIP・DIP関節をまたいで足趾全体を背屈させる","mmt":{"position":"足趾背屈で記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位。","insertion":"まず足全体を背屈させてTA筋腹を同定し、次に足趾の背屈・底屈を繰り返させると、TAの外側に接して動く幅3cm弱の筋腹がわかる。TA刺入点より遠位、下腿中央〜やや遠位で刺入。","activation":"非検査手で足趾を持ち「足の指を反らして」と指示。安静時は足趾・足関節を含め力を抜く。","notes":["TAより触れにくく、被検者もTAと分離して動かしにくい。TAの外側・長腓骨筋の前方にあり、近位部は両筋に覆われるので下腿中央付近が到達しやすい。"]},"clinical":["TAと区別して評価する必要は少ないが、TAにL4の関与が大きくL5障害で足趾背屈の低下が目立つ場合にはEDLを検査してもよい。"],"page":194,"headText":"L5","rootSrc":"表","nk":"dp","nshort":"深腓骨","bookPage":190},{"id":"extensor_digitorum_brevis","kind":"muscle","ja":"短趾伸筋","en":"Extensor digitorum brevis","abbr":"EDB","region":"下腿・足","roots":{"L5":3,"S1":1},"rootText":"L5,(S1)","nerve":"深腓骨神経（および副深腓骨神経）","action":"足趾背屈。中節に終止するが、実際の足趾背屈はEDLのみで可能","mmt":{"position":"足趾背屈で記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位。","insertion":"足趾を背屈させ、足背で小趾へのEDL腱（および第三腓骨筋腱）の外側に盛り上がる筋腹に刺入。","activation":"通常の弛緩で安静時、足趾背屈で随意収縮を記録。","notes":["痛みがかなり強い。"]},"clinical":["深腓骨神経のNCSに用いられるが変異の大きい筋で、欠如する健常者もいる。正座による圧迫で潜在性に障害されやすいとの意見もあるが、振幅の変異は欧米人でも大きい。","健常者でも陽性鋭波・線維束自発電位や随意収縮の変化がかなりみられ、TAと分離評価する必要も少ないため、針筋電図をわざわざ行うことは少ない。","2〜3割の健常者で副深腓骨神経（浅腓骨神経の分枝）による支配があり、局在診断で念頭に置く。","前足根管症候群の客観的診断には、EDB記録の深腓骨神経遠位潜時延長に加え、EDBの針筋電図が有用との主張がある（健常者では線維自発電位はみられないとの報告もある）。"],"page":196,"headText":"L5","rootSrc":"表","nk":"dp","short":"短趾伸筋","nshort":"深腓骨","bookPage":192},{"id":"big_toe_extensors","kind":"movement","ja":"母趾背屈（長母趾伸筋・短母趾伸筋）","en":"Big toe extensors (EHL, EHB)","abbr":"","region":"下腿・足","roots":{"L5":3,"S1":1},"rootText":"L5,(S1)","nerve":"深腓骨神経","action":"母趾の背屈（主に長母趾伸筋 EHL によると考えられる）","mmt":{"position":"仰臥位、股・膝伸展、足関節軽度背屈位。「足の親指を上に反らして」と指示し、母趾最大背屈位を保持。","fixation":"非検査手で足部を保持。","technique":"検査手の示指を母趾IP関節部（基節遠位の背側）に当てて底屈方向に押し、MP関節の最大背屈位をbreakできるかを見る。","grading":"重力なしのgrading。EHL筋腹は通常触れないので0と1の区別もできない。","pitfalls":["EHLはIP・MP両関節を伸展でき、EHLとEHBの作用は分離困難。著者はMP関節の伸展を評価しbig toe extensorsと総称する（主にEHLの評価）。Haraらも同意見。","生理的にもbreakされる人が、多くはないが存在する。"]},"normalMayBreak":true,"emg":{"position":"","insertion":"","activation":"","notes":["EHLは下腿遠位の深部にあり痛みも強いため、著者はほとんど行わない。方法は成書を参照。"]},"clinical":["TAと同様、L5障害でも総・深腓骨神経麻痺でも障害される。","錐体路障害では腸腰筋と並ぶか、それ以上に最も高頻度に低下する筋で、評価が重要。","固有足筋を除き下肢で筋腹が最も遠位にあるため、距離依存性の多発ニューロパチーでは固有足筋に次いで早期に低下し、母趾背屈不能が初発症状となることも多い。"],"page":198,"headText":"L5","rootSrc":"表","an":true,"rec":true,"nk":"dp","short":"母趾背屈","nshort":"深腓骨","bookPage":194},{"id":"fibular_muscles","kind":"movement","ja":"腓骨筋群（足の外反）","en":"Fibular (peroneal) muscles","abbr":"","region":"下腿・足","roots":{"L5":3},"rootText":"L5","nerve":"浅腓骨神経","action":"足の外反（長腓骨筋・短腓骨筋）","mmt":{"position":"仰臥位、股・膝伸展、足関節背屈位。「足を外側に反らすように」と指示し、背屈・最大外反位を保持。","fixation":"非検査手で下腿遠位部をつかんで保持。","technique":"検査手で足の外側をつかんで内反方向に力を加え、最大外反位をbreakできるかを見る。","grading":"重力なしのgrading。","pitfalls":["長腓骨筋と短腓骨筋の作用は分離して評価できない。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":["各筋の項で記載。"]},"clinical":["下垂足例で、TAなど深腓骨神経支配筋は低下し腓骨筋群は保たれるという解離があれば深腓骨神経麻痺と診断できるが、そのような例は多くない。"],"page":200,"headText":"L5","rootSrc":"見出し","nk":"sp","short":"腓骨筋群","nshort":"浅腓骨","bookPage":196},{"id":"fibularis_longus","kind":"muscle","ja":"長腓骨筋","en":"Fibularis (peroneus) longus","abbr":"FL","region":"下腿・足","roots":{"L5":3,"S1":1},"rootText":"L5,(S1)","nerve":"浅腓骨神経","action":"足の外反","mmt":{"position":"腓骨筋群で記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位。","insertion":"足を外反させ、腓骨頭から遠位に向かう幅2〜3cmの筋腹を同定。腓骨頭から少なくとも5〜6cm遠位、下腿の近位1/4〜1/3の高さで刺入。","activation":"非検査手で足を持ち「足を外側に反らすように」と指示。安静時は下肢を軽い外旋位にすると最も力が抜ける。","notes":["すぐ後方に腓腹筋外側頭があるので間違えない。","近位に寄りすぎると腓骨頭の遠位を回る総腓骨神経を傷つける可能性がある。"]},"clinical":["臨床的意義は腓骨筋群のMMTと同じ。","短腓骨筋（FB）は神経・筋節ともFLと同じで独立評価の意味はない。腓腹神経と同時に採取する神経筋生検があり、その所見との比較目的でFBの針筋電図に意義があるかもしれないが研究はほとんどない。"],"page":202,"headText":"L5","rootSrc":"表","nk":"sp","nshort":"浅腓骨","bookPage":198},{"id":"triceps_surae","kind":"movement","ja":"下腿三頭筋（足関節底屈）","en":"Triceps surae","abbr":"","region":"下腿・足","roots":{"L5":2,"S1":3},"rootText":"S1＋L5","nerve":"脛骨神経","action":"足関節底屈（腓腹筋内側頭・外側頭、ヒラメ筋）。腓腹筋は膝・足関節をまたぐ2関節筋、ヒラメ筋は1関節筋","mmt":{"position":"仰臥位、股・膝伸展。「足を下にぎゅっと踏みつけて」と指示し、足関節最大底屈位を保持。","fixation":"非検査手で下腿遠位部を保持。","technique":"検査手を足底に当てて背屈方向に強く力を加え、最大底屈位をbreakできるかを見る。","grading":"重力なしのgrading。","pitfalls":["Danielsの立位でのかかと上げ（MMT3）や片足つま先立ち25回（MMT5）とは全く異なる。この定義は下腿三頭筋だけ特殊で、MMT5の動作は健常者にも容易でない（回数も版で変動）。","膝伸展での最大底屈位保持は非生理的な動作で、ある程度の低下なら検出できる。軽度低下をどうしても見たい時はつま先立ちなどDanielsの方法を援用してよい。","中間位〜背屈位の方が鋭敏に思えるが、そうではないと著者は感じている。慣れれば最大底屈位で比較的軽度の低下も検出可能。","腓腹筋とヒラメ筋を区別した評価は行っていない。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":["各筋の項で記載。"]},"clinical":["抗重力筋で、錐体路障害ではかなり高度の麻痺になるまで保たれる。","S1障害で明確に低下するほぼ唯一の筋（他は固有足筋）。S1神経根症では下腿三頭筋の肥大やCK上昇を示すことがあり、筋生検で炎症様所見がみられることさえある。","ミオパチーでは三好型遠位型筋ジストロフィー（ジスフェルリノパチー）で早期から低下する。"],"page":204,"headText":"L5,S1","rootSrc":"見出し","nk":"tib","short":"下腿三頭筋","nshort":"脛骨","bookPage":200},{"id":"gastrocnemius_medial","kind":"muscle","ja":"腓腹筋内側頭","en":"Gastrocnemius, medial head","abbr":"GcMH","region":"下腿・足","roots":{"L5":1,"S1":3},"rootText":"S1,(L5)","nerve":"脛骨神経","action":"足関節底屈（＋膝関節屈曲）","mmt":{"position":"下腿三頭筋で記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位、股・膝伸展、下肢をわずかに外旋、足関節は底背屈中間位程度。","insertion":"足関節を底屈させると下腿三頭筋が盛り上がる。仰臥位でも前面から認識できる内側頭筋腹の中央、下腿近位1/3付近の高さで刺入。","activation":"非検査手の母指を母趾球基部、示指を第1中足骨頭付近の足背にかけ、「足を下にぎゅっと踏みつけて」と指示（検者の指に強い力がかかる）。安静時は軽い外旋位で力を抜く。","notes":["それでも最大収縮を得るのは容易でなく、弱い段階の動員パターンやMUP形態を主に評価する。","神経原性変化があると思われてもMUP高振幅化が明確でない（低振幅になることもある）ことがあり、詳細な評価に適さない。筋生検でも避けるのが一般的。","正常でも線維束自発電位がみられうるとされ、ALSの評価筋としても適切でない。","腓腹筋外側頭（GcLH、腹臥位が必要）やヒラメ筋も検査は難しくないが、GcMHと分けて検査する意義は乏しく、著者はあまり行わない。"]},"clinical":[],"page":206,"headText":"L5,S1","rootSrc":"表","nk":"tib","short":"腓腹筋内側頭","nshort":"脛骨","bookPage":202},{"id":"tibialis_posterior","kind":"muscle","ja":"後脛骨筋","en":"Tibialis posterior","abbr":"TP","region":"下腿・足","roots":{"L5":3,"S1":1},"rootText":"L5,(S1)","nerve":"脛骨神経","action":"足関節底屈位での足関節内反","mmt":{"position":"仰臥位、股・膝伸展、足関節底屈位で「足首を下に踏んだまま足を内側に反らすように」と指示し、最大内反位を保持。","fixation":"非検査手で下腿遠位をつかんで保持。","technique":"検査手を足の内側やや足底寄りに当て、外反〜やや背屈方向に力を加えて最大内反位をbreakできるかを見る。","grading":"重力なしのgrading。","pitfalls":["背屈位での内反はTAでも可能なので、十分な底屈位で検査することが重要。","心持ち後方から前外方に持ち上げるように力を加えると、背屈と内反を同時に行うTAでは抵抗できない動作となり、TPのみの評価に役立つ。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、MMTとほぼ同じ肢位だが最大位まではもっていかない。下肢は軽い外旋位。","insertion":"内果下端から約8cm上方、脛骨内側縁の約1cm後方から、下腿の冠状面に平行・頭尾方向に垂直にまっすぐ進める。通常2〜3cmで到達し、軽い内反で確認。","activation":"非検査手で足を持ち「足首を下に踏んだまま足を内側に反らすように」と指示。強く力を入れさせると等尺性が崩れるので弱めにとどめ、足部を十分保持する。","notes":["深部まで針を進めるので等尺性の維持に十分注意する。","経路の近くにFDL筋腹、脛骨神経、後脛骨動脈がある。放散痛や出血があれば直ちに針を戻して対処する。","FDL筋腹を貫通することが多く、同意義のFDLの検査が優先される。"]},"clinical":["総腓骨神経支配でないL5筋の代表で、筋力低下の有無は下垂足の鑑別で極めて重要。正確な方法でMMTを行う。","半腱様筋（半膜様筋）や中殿筋も同じL5筋だが低下を呈さないことが多い（中殿筋は半数程度、大腿屈筋群はほぼ正常）。TPは下垂足を呈するほどのL5障害では必ず低下するので有用性が高い。","針筋電図はやや深部で手軽でなく、手前にありほぼ同意義のFDLで行えば十分なことがほとんど。"],"page":208,"headText":"L5","rootSrc":"表","nk":"tib","nshort":"脛骨","bookPage":204},{"id":"flexor_digitorum_longus","kind":"muscle","ja":"長趾屈筋","en":"Flexor digitorum longus","abbr":"FDL","region":"下腿・足","roots":{"L5":3,"S1":1},"rootText":"L5,(S1)","nerve":"脛骨神経","action":"足趾の遠位趾節間（DIP）関節、すなわち末節の屈曲","mmt":{"position":"仰臥位、股・膝伸展、足関節背屈位で「足の指を下に曲げて」と指示し、基節〜末節の最大屈曲位を保持。","fixation":"非検査手で足関節を背屈位に保ち、その母指と示指以下で底屈した基節〜中節をしっかり挟む。","technique":"検査手の指を足趾末節の底側に当ててDIP関節を伸展方向に押し、末節の最大底屈位をbreakできるかを見る。第2・3趾が検査しやすい。","grading":"重力なしのgrading。細かいgradingは難しい。FDL筋腹を触れれば1と0も区別できる。","pitfalls":["足関節背屈位に保持することが重要。底屈位では十分な力が入らないことがある。","健常者でもbreakされる人が時にいる。","どれかの足趾だけ十分な力が入る場合は、最も力の入る趾で評価すればよい。","検査中に足底筋や下腿三頭筋がつる（有痛性筋痙攣）ことがあり、休んで解除してから再施行する（他の足趾屈筋・下腿三頭筋・TPでも同様）。"]},"normalMayBreak":true,"emg":{"position":"仰臥位、足関節は自然な背屈位、下肢は軽い外旋位。","insertion":"足趾を底屈させると下腿遠位1/4付近で脛骨内側縁の後方に幅約1cmの筋腹がわかる。内果下端から約8cm上方、脛骨内側縁の約1cm後方（TPと同じ刺入点）から筋腹へ刺入。","activation":"非検査手で足〜足趾を保持して「足の指を下に曲げて」と指示。","notes":["筋腹の横断面は小さいので奥に行きすぎない。針を遠位から近位へ斜めにするとサンプル長を確保できる。","やや前方に脛骨神経・後脛骨動脈がある。放散痛や出血があれば直ちに針を戻して対処する。"]},"clinical":["TPと同じく脛骨神経支配のL5筋で、下垂足の鑑別に有用。生理的breakがある点は左右比較で補い、TPと併せてルーチンに評価するとよい（臨床的有用性はTPに劣るかもしれない）。","表層にありTPよりはるかに容易に検査できるので、脛骨神経支配L5筋の針筋電図ではまずFDLを用い、判断がつかない時のみTPを考慮する。"],"page":211,"headText":"L5,S1","rootSrc":"表","nk":"tib","nshort":"脛骨","bookPage":207},{"id":"flexor_digitorum_brevis","kind":"muscle","ja":"短趾屈筋・固有足筋","en":"Flexor digitorum brevis, intrinsic foot muscles","abbr":"FDB","region":"下腿・足","roots":{"S1":3,"S2":1},"rootText":"S1,(S2)","nerve":"脛骨神経","action":"足趾PIP関節（中節）の屈曲。実際にはMP関節（基節）屈曲にも関与し、主にMP関節での作用を評価。足底方形筋・虫様筋・FDLなども関与するが、便宜上まとめてFDBと呼ぶ","mmt":{"position":"仰臥位、股・膝伸展、足関節背屈位で「足の指を下に曲げて」と指示し、基節〜末節の最大屈曲位を保持。","fixation":"非検査手で足をつかんで背屈位にし、足底側から中足骨を含めてしっかり保持。","technique":"検査手の指を第2〜5趾の基節〜中節の丸く曲がった底側に当ててMP関節を伸展方向に押し、基節の最大底屈位をbreakできるかを見る。","grading":"重力なしのgrading。筋腹は触れないので0と1の区別はできない。","pitfalls":["FDL同様、足関節背屈位の方が十分な力が入りやすい。","健常者でもbreakされる、あるいはMP関節最大屈曲位まで随意的に曲げられない人がいるので左右比較が必要。"]},"normalMayBreak":true,"emg":{"position":"","insertion":"","activation":"","notes":["足底深部で刺入が極めて痛いため、通常は検査しない。"]},"clinical":["手指ではFDPが強いとFDSの低下検出は難しいが、足趾ではFDLが強くてもこの方法でFDB（と他の固有足筋）の低下を検出できる。","人体で最も長い運動神経軸索に支配され、距離依存性の多発ニューロパチーで最初に障害される。CMTの槌状趾・凹足はその表れ。動作障害や自覚症状にならないので、MMTで低下を検出できれば診断的意義が大きい。","筋節はS2以下とする説もあるが、著者は下腿三頭筋と同様S1主体と考える。S1（L5/S1）障害、特に見逃されやすい上部円錐部の障害が槌状趾をきたし、CMTなど末梢神経障害と誤られることがある。"],"page":214,"headText":"S1,S2","rootSrc":"見出し","nk":"tib","short":"短趾屈筋","nshort":"脛骨","bookPage":210},{"id":"flexor_hallucis_longus","kind":"muscle","ja":"長母趾屈筋","en":"Flexor hallucis longus","abbr":"FHL","region":"下腿・足","roots":{"L5":3,"S1":1},"rootText":"L5,(S1)","nerve":"脛骨神経","action":"母趾の趾節間（IP）関節、すなわち末節の屈曲","mmt":{"position":"仰臥位、股・膝伸展、足関節背屈位で「足の親指（の先）を下に曲げて」と指示し、基節と末節の最大屈曲位を保持。","fixation":"非検査手を足底側から当てて足関節を背屈位に保ち、底屈した基節を母指と示指以下でしっかり挟む。","technique":"検査手の示指を母趾末節の底側に当ててIP関節を伸展方向に押し、末節の最大底屈位をbreakできるかを見る。","grading":"重力なしのgrading。筋腹は触れないので0と1の区別はできない。","pitfalls":["足関節背屈位の保持がFHLでは特に重要。底屈位では多くの人が十分な力を入れられない（著者は以前、健常者でもbreakされやすいと記載していたが、背屈位保持でほとんどの健常者でbreakされなくなった）。","この方法でもbreakされる健常者が稀にいるが、FDLより少ない。","健常者でもごく稀に break されることがある（FDLより少ない）。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":["下腿遠位屈側の深部にあり痛みも強いとされ、著者は検査していない。必要時は成書参照。"]},"clinical":["意義はFDL・TPと同じで、脛骨神経支配のL5筋として重要。生理的breakが比較的少ないためFDLより有用かもしれない。"],"page":216,"headText":"L5,S1","rootSrc":"表","nk":"tib","nshort":"脛骨","bookPage":212},{"id":"flexor_hallucis_brevis","kind":"muscle","ja":"短母趾屈筋","en":"Flexor hallucis brevis","abbr":"FHB","region":"下腿・足","roots":{"S1":3,"S2":1},"rootText":"S1,(S2)","nerve":"脛骨神経","action":"母趾の中足趾節（MP）関節、すなわち基節の屈曲","mmt":{"position":"仰臥位、股・膝伸展、足関節背屈位で「足の親指を下に曲げて」と指示し、基節（と末節）の最大屈曲位を保持。","fixation":"非検査手で足をつかんで足関節背屈位とし、足底側から第1中足骨をしっかり保持。","technique":"検査手の示指を母趾基節の底側に当ててMP関節を伸展方向に押し、基節の最大底屈位をbreakできるかを見る。","grading":"重力なしのgrading。筋腹は触れられるので、0と1の区別も行おうと思えば可能。","pitfalls":["FHL同様、足関節背屈位の方が力が入りやすい。底屈位では足底筋の有痛性筋痙攣を誘発しやすい。","健常者でのbreakはほとんどない。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"母趾を底屈させると第1中足骨内縁の底側に筋腹を触れる。同じ価値をもつ筋として、NCSで使う母趾外転筋（abductor hallucis；AH）も検査可能。","activation":"","notes":["足底への刺入は極めて痛く、どうしても必要な時に限る。","特にAHでは健常者でもFib/PSWや線維束自発電位の出現が報告されており、FHBも同様の可能性が高い。","OCRテキストはp219の途中までで、それ以降（臨床的事項など）は未収録。"]},"clinical":[],"page":218,"headText":"S1,S2","rootSrc":"見出し","nk":"tib","nshort":"脛骨","bookPage":214}],"columns":[{"title":"コラム1 ALSの診断基準とALSの診断（1）","points":["代表的な基準に revised El Escorial（R-EEC）とAwaji基準がある。Awaji基準はR-EECの早期診断感度の低さを受けて作られ、線維束自発電位を線維自発電位/陽性鋭波と同等に扱い、LMN障害の臨床徴候と電気生理所見を相互に援用可能とした。","一方で Clinically probable-Laboratory supported を削除したため、UMN徴候が1領域しかない例が study eligible にならず、著者らの検討ではAwajiの感度はR-EECより低かった。","これを受けて、UMN 1領域でも Clinically probable としてよい updated Awaji 基準が提唱され、LMN基準を満たすのが楽になり針筋電図の施行筋数も節約できる。","それでも著者らのデータで study eligible は半数をやや超える程度で、UMN徴候を欠く進行性筋萎縮症（PMA）は診断できない。","これらは本来治験用の research criteria であり、満たさなければALSと診断できないわけではない。ただし治験に多くの患者を組み入れるため感度向上は引き続き望まれる。"],"page":37,"bookPage":33},{"title":"コラム2 ALSの診断基準とALSの診断（2）","points":["僧帽筋の針筋電図の安静時活動（Fib/PSWまたは線維束自発電位）は多施設研究でALSの感度63%、頸椎症との比較で特異度100%と高い診断力を示した。舌は安静がとりにくく安静時活動の検出率も低い。","僧帽筋は細胞体がC3〜5頸髄にあり厳密には頸髄領域の筋として扱うべきだが、R-EECやAwajiでは僧帽筋＋上肢1筋の異常で筋電図基準を満たせるため、特異度の高さと相まって有用。","僧帽筋RNSの漸減現象はALSとCSAの比較で特異度100%（感度51%）で、出ればALSを強く示唆する。上肢発症ALSで三角筋RNSの感度は100%で、上肢症状の患者で三角筋RNSが正常ならALSは否定的。","線維束自発電位はALS以外の神経原性疾患での出現頻度が低く、広汎・豊富な出現はALSを強く示唆する。著者らの検討では上腕三頭筋・僧帽筋・内側広筋・上腕二頭筋で出現頻度が高く、これらを中心に検査している。"],"page":58,"bookPage":54},{"title":"コラム3 電気診断検査の診療報酬","points":["日本の筋電図・神経伝導検査の診療報酬は欧米に比べ非常に低い。","神経伝導検査は長く一連250点だったが、2010年に1神経150点（上限4神経）、2014年に上限8神経、2018年に最初の1神経のみ200点へと増額された。","GBS患者で7神経の伝導検査を行うと、2010年以前3,900円、2010年7,400円、2014年12,300円、2018年12,800円。米国のある大学では同等の検査が約120,000円、欧州は約25,000〜30,000円で、2010年以前は米国の1/30、欧州の1/7だった。","米国の報酬が約半分になったとすれば、現在ようやく米国の1/5、欧州の1/2程度。技術料の典型であり、せめて欧州並みを目指すことが検査技能の維持・向上と医療の質向上につながると著者は述べる。"],"page":67,"bookPage":63},{"title":"コラム4 神経筋電気診断の専門性について","points":["針筋電図をローテーターの持ち回り、神経伝導検査やSEPを誰でもできる検査として運用する施設が多いと思われるが、それは大きな間違いだと著者は述べる。","臨床神経生理学を専門資格とする国は多く、米国ではAANEMが神経筋電気診断の資格を提供し、200件の筋電図レポート経験やビデオを用いた高度な試験が課される。","不十分な技能での検査や誤った解釈は誤った診療に直結し、神経診察の技能がない医師が神経疾患を診断するのと同レベルの行為である。","日本臨床神経生理学会には専門医・専門技術師制度がある。地域の中核病院には必ず神経筋電気診断医を置き、脳神経内科医5人に1人は筋電図の専門医がいる体制が望ましい。"],"page":77,"bookPage":73},{"title":"コラム5 神経痛性筋萎縮症の病変局在","points":["NAの病変部位を「腕神経叢」とするのは今や誤り。","1948年のParsonageとTurnerの原著では大多数が単ニューロパチーまたは多発性単ニューロパチーとされ、「腕神経叢障害」という言葉はない。腕神経叢説は1972年のMayo Clinicの brachial plexus neuropathy 報告（積極的な局在証拠はない）以降に広まった。","Englandらは一貫して病変局在は多発性単ニューロパチーと主張していた。","1996年にNaganoらが特発性前骨間神経麻痺で、前骨間神経より近位の正中神経本幹に砂時計様くびれを報告し、Nakamichiらは神経超音波で描出できることを示した。","2018年にSneagらは高解像度MRIでNA 27例を検討し、障害神経の大多数にくびれなどを認めたが腕神経叢の異常は3例のみで、いずれも末梢神経病変の近位進展だった。Ferranteは、NAの主病変は個々の末梢神経であると裏付けられたと評した。"],"page":83,"bookPage":79},{"title":"コラム6 神経痛性筋萎縮症と頸椎症性筋萎縮症の鑑別","points":["CSAは発症時の痛み、続く筋力低下・萎縮、運動優位などNAとの共通点が多く、両疾患の原著者もNAとCSA/神経根症の鑑別の難しさを述べている。NAは一般に予後良好だがCSAは予後不良例が多く、鑑別が重要。","検査では傍脊柱筋の脱神経の有無が重要だが、著者は詳細なMMTによる障害分布の検討が最も重要と強調する。CSAは正確に髄節性、NAは髄節性に合わない分布となる。","三角筋・棘下筋が障害され上腕二頭筋が完全に正常という所見は近位型CSAではあり得ず、NAを強く示唆する。","下垂指を呈する遠位型CSA（C8障害）は必ず同じC8の尺骨神経支配筋の障害を伴う。尺骨神経支配筋が完全に正常なら純粋な後骨間神経麻痺、即ちNAを示唆する。"],"page":91,"bookPage":87},{"title":"C8/T1筋節の問題（コラム7）","points":["Wilbournも1988年時点ではAPB・FDI・ADMの筋節をいずれもC8/T1とし、差をつけていなかった。","1993年に谷らは頸椎症の固有手筋萎縮が尺骨神経支配筋主体で正中神経支配筋はスペアされやすいと記載したが、前角細胞のトポグラフィーの差と考察し、筋節の差とは明言していない。","Cleveland Clinicグループは1995年の総説でT1-正中・C8-尺骨の関係に初めて触れ、1998年のTN-TOS等の検討を経て、APBは主にT1、FDI・ADMは主にC8という新説を提唱した。","筆者らは前腕筋でもPT/FCRを除く正中神経支配筋がT1、尺骨神経支配筋がC8主体であり、その関係は固有手筋より明確なことを示した。特にFDP1がT1、FDP4がC8である。","これは針筋電図ではなくMMTから得られた知見であり、神経診察だけからもまだ新しいことがわかる。"],"page":99,"bookPage":95},{"title":"封入体筋炎の針筋電図について（コラム8）","points":["IBMは高齢発症の慢性進行性筋疾患で、指屈筋とくにFDPと大腿四頭筋が強く障害される。ペットボトルが開けにくい、階段・床からの立ち上がりが困難といった症状が数年前からあることが多い。","IBMでは「神経原性変化の混入」がしばしば記載されてきた。筆者らの定量解析でも上腕二頭筋ではMUPの振幅・面積・Size Indexの増大など神経原性様の特徴しかなかった。","一方、著明な筋力低下を示すFDPでは低振幅MUPが明らかでミオパチーの所見であり、IBMの本質はミオパチーと結論している。","上腕二頭筋でも動員パターンは正常で、年単位の慢性経過の神経原性病態ではあり得ない所見であり、ミオパチーを支持する。高振幅～巨大MUPは慢性の筋原性疾患で普遍的に見られ、神経原性の根拠にはならない。","IBMとALSの鑑別は難しいと言われるが、高度に弱いFDPなどを調べれば所見は全く異なる。"],"page":103,"bookPage":99},{"title":"神経症候学とMRI（コラム9）","points":["脊椎MRIは高齢健常者でも高率に異常所見があり特異度が低い。「手のしびれ・脱力→頸椎MRIに所見→首が原因」という三段論法は成り立たない。","特に大脳皮質基底核症候群（CBS）は慢性進行性の上肢運動障害にしびれ感を伴うことがあり、頸椎症と誤られやすい。首・腰・肘部管の3カ所を手術済みのCBS例も経験している。","逆に神経症候から狙いをつけて見ると、それまで見逃されていた明確な椎間板ヘルニアが見つかることもしばしばある。","MRIがどれほど発達しても神経症候学の重要性は減じない。"],"page":111,"bookPage":107},{"title":"頸椎症性神経根症の診断（コラム10）","points":["頸椎症性脊髄症（CSM）で症候（分節性徴候と長経路徴候）とMRIが合致すれば、針筋電図は局在の傍証にしかならず行わないことが多い。微妙な例ではむしろSEPを積極的に用いる。","頸椎症性神経根症（CSR）でもSpurling徴候が明確で髄節に一致する感覚障害・筋力低下があり、画像で対応するヘルニアがあれば針筋電図を省くこともある。","症状はCSRらしいがMRIが明確でない例は針筋電図のよい適応で、髄節性＋傍脊柱筋の脱神経が示されるMRI negative・EMG positiveのCSRもある。","C5～T1全筋節のスクリーニングや6～8筋の検査は必ずしも必要なく、障害根と隣接根の一方、傍脊柱筋を調べて髄節性局在と脱神経を示せば十分で、施行筋数は3～4筋程度のことが多い。"],"page":121,"bookPage":117},{"title":"胸郭出口症候群（コラム11）","points":["広く診断され第一肋骨切除が行われてきたTOSについて、Wilbournはその多くの存在を疑問視し（disputed neurogenic TOS）、真の神経性TOS（TN-TOS）のみが確立した疾患概念と主張した。","TN-TOSは母指球萎縮を必発とする運動優位の慢性経過の疾患で、感覚障害は軽微だが、内側前腕皮神経（MAC）のSNAPはほとんどの例で消失しており、特徴的な伝導検査パターンで確定診断できる。","慢性の筋力低下例でMMTによりT1>C8の障害分布が示せればTN-TOSを疑え、MACのSNAP異常があれば（稀なT1優位CSAではなく）TN-TOSと診断できる。","非常に稀とされるが、診断されずに埋もれている例が多いと筆者らは考えている。","手術の絶対適応とされるが、痛み・しびれがなく経過の長い例は手術を希望しないことも多い。行う場合は第一肋骨切除は不要で、鎖骨上窩アプローチでの線維性索状物摘除のみの低侵襲手術で十分。"],"page":131,"bookPage":127},{"title":"筋炎の針筋電図：被検筋の選択","page":153,"points":["筋炎の筋力低下は頸部前屈と腸腰筋で最も鋭敏に検出できる。","針筋電図では安静時Fib/PSWと随意収縮時の筋原性変化が特徴で、Fib/PSWはほぼ必発。無症候性高CK血症やamyopathic DMとみられる例でも証明されることがある。","まず上腕二頭筋を検査する（筋力低下がなくてもFib/PSWが出ることが多く、生検筋としても最適）。陽性ならそこを生検筋として推奨し、通常1筋で終える。","上腕二頭筋で明確でなければ、四肢筋で最も感度が高いと考えられる腸腰筋を検査する。それも正常ならば傍脊柱筋（通常胸部）を調べるが、そこまで必要な例は多くない。","腸腰筋・傍脊柱筋は生検に向かないため、生検好適筋を探すには三角筋や大腿四頭筋（外側広筋・大腿直筋）を調べる。筋MRIも生検部位選択に使えるが非特異的所見に注意。"],"bookPage":149},{"title":"錐体路性の筋力低下分布","page":157,"points":["成書では上肢は伸筋優位・下肢は屈筋優位とされる程度だが、著者は錐体路障害の筋力低下分布は非常に定型的で、分布だけで錐体路性と診断できると考えている。","上肢では上肢前方挙上（三角筋前部）と掌側骨間筋が最も鋭敏で（中野今治の説）、次いでADM（生理的な弱さがあり左右比較が必要）、FDIやEDはその後。","下肢では腸腰筋＝母趾伸展＞下肢外転（他の足趾伸展もこのあたり）＞hamstrings＞TAの順に障害されやすい。平山は前脛骨筋も早期とするが、著者は最大背屈のみ見ているので感度が低い可能性はある。","拮抗する伸筋・抗重力筋群（大殿筋・内転筋群・大腿四頭筋・下腿三頭筋）は錐体路障害では簡単には低下せず、特に大殿筋は極めて障害されにくい。"],"bookPage":153},{"title":"縁取り空胞を伴う遠位型ミオパチー（DMRV／GNEミオパチー）","page":167,"points":["特徴的な筋力低下分布だけで容易に診断できる疾患。","最も特徴的なのは大腿部での大腿四頭筋と大腿屈筋群の解離（四頭筋が保たれ屈筋群が障害される）で、筋CTでも診断に役立つ。前脛骨筋＞下腿三頭筋の障害も知られるが、明確でない例もある。","大腿内転筋群も早期から強く障害され、開脚し、四頭筋に頼って腰椎を前弯させ腹を突き出すような独特の歩き方（「雄大な歩き方」、ふんぞり返った歩き方）になる。","四頭筋と屈筋群・内転筋群の解離は下腿がほとんど障害されない近位型でも同様にみられ、普遍的な特徴。","胸鎖乳突筋・頸部前屈が早期から障害されるのも、多くの筋ジストロフィーと異なる特徴（筋強直性ジストロフィーとは共通）。","早期にはCMTなどと誤診されやすい。治療導入の可能性も高く、臨床特徴を理解して早期診断を心がける。"],"bookPage":163},{"title":"下垂足の鑑別","page":191,"points":["下垂足は前脛骨筋の筋力低下で生じる。最初のポイントは下腿三頭筋も障害されているか否か。","下腿三頭筋も障害されていれば、CMT、ALS、坐骨神経やL5/S1の障害など下肢遠位筋を広く侵す疾患を考える。DMRVも下垂足をきたすので、神経原性か筋原性かの判定にTAの針筋電図が役立つ。","下腿三頭筋が保たれTAのみ障害される代表は腓骨神経麻痺とL5神経根症。","両者の鑑別には、L5筋節だが腓骨神経支配でない筋（脛骨神経支配の後脛骨筋・長趾屈筋・長母趾屈筋、半腱様筋・半膜様筋、上殿神経支配の中殿筋・大腿筋膜張筋）の筋力低下の有無を見る。","腓骨神経麻痺の証明には神経伝導検査が有用で、ルーチンのEDB記録ではなくTAで記録するとよい。","針筋電図では上記の筋を調べ、著者はFDL（TPより表層で刺しやすい）とTFLの2筋を検査している。","大腿二頭筋短頭（BFSH）は成書で重要とされるがS1支配で、BFSH正常だから病変はそれより遠位と結論するのは誤り。L5障害でも同じ所見になりうる。"],"bookPage":187}],"nerves":[{"key":"xi","name":"副神経（脊髄副神経）","short":"副神経","path":"脳神経XI（上位頸髄由来の脊髄根）"},{"key":"dsc","name":"肩甲背神経","short":"肩甲背","path":"C5神経根から直接分枝（神経叢より近位）"},{"key":"lt","name":"長胸神経","short":"長胸","path":"C5〜C7神経根から直接分枝（神経叢より近位）"},{"key":"ssc","name":"肩甲上神経","short":"肩甲上","path":"上神経幹から分枝"},{"key":"td","name":"胸背神経","short":"胸背","path":"後神経束から分枝"},{"key":"ax","name":"腋窩神経","short":"腋窩","path":"後神経束から分枝"},{"key":"mc","name":"筋皮神経","short":"筋皮","path":"外側神経束から分枝"},{"key":"rad","name":"橈骨神経（後骨間神経を含む）","short":"橈骨","path":"後神経束の続き。回外筋を貫いた後が後骨間神経"},{"key":"med","name":"正中神経（前骨間神経を含む）","short":"正中","path":"外側・内側神経束から。前腕で前骨間神経を分枝"},{"key":"uln","name":"尺骨神経","short":"尺骨","path":"内側神経束から"},{"key":"cx","name":"頸神経（前枝・副神経など）","short":"頸部","path":""},{"key":"dr","name":"脊髄神経後枝","short":"後枝","path":"各髄節の後枝（神経叢を通らない）"},{"key":"fem","name":"大腿神経（腰神経叢）","short":"大腿","path":"腰神経叢（L2〜L4）。大腰筋は腰神経根から直接"},{"key":"obt","name":"閉鎖神経","short":"閉鎖","path":"腰神経叢（L2〜L4）"},{"key":"sg","name":"上殿神経","short":"上殿","path":"仙骨神経叢（L4〜S1）"},{"key":"ig","name":"下殿神経","short":"下殿","path":"仙骨神経叢（L5〜S2）"},{"key":"sci","name":"坐骨神経（大腿部の枝）","short":"坐骨","path":"仙骨神経叢。大腿で脛骨神経部と総腓骨神経部に分かれる"},{"key":"dp","name":"深腓骨神経","short":"深腓骨","path":"総腓骨神経（腓骨頭）から"},{"k s","fibularis_longus","gastrocnemius_medial","tibialis_posterior","flexor_digitorum_longus","flexor_hallucis_longus","flexor_digitorum_brevis","flexor_hallucis_brevis"],"core":["semitendinosus","biceps_femoris_long","biceps_femoris_short","tibialis_anterior","gastrocnemius_medial","tibialis_posterior"],"note":"坐骨神経障害では腓骨神経部が強く障害されやすい"},{"name":"総腓骨神経（腓骨頭）","kind":"末梢神経","aff":["tibialis_anterior","extensor_digitorum_longus","big_toe_extensors","extensor_digitorum_brevis","fibularis_longus"],"note":"後脛骨筋・長趾屈筋・中殿筋・大腿筋膜張筋・半腱様筋が正常なら合う。大腿二頭筋短頭はS1主体なので、正常でもL5障害を否定できない"},{"name":"深腓骨神経","kind":"末梢神経","aff":["tibialis_anterior","extensor_digitorum_longus","big_toe_extensors","extensor_digitorum_brevis"],"note":"長腓骨筋（足の外反）は保たれる"},{"name":"脛骨神経（膝窩以下）","kind":"末梢神経","aff":["gastrocnemius_medial","tibialis_posterior","flexor_digitorum_longus","flexor_hallucis_longus","flexor_digitorum_brevis","flexor_hallucis_brevis"]},{"name":"足根管（足底神経）","kind":"末梢神経","aff":["flexor_digitorum_brevis","flexor_hallucis_brevis"],"note":"固有足筋の針筋電図の価値は十分に証明されていない"}],"general":[{"title":"MMTの原則（本書の考え方）","points":["1回に1関節だけを調べる。そのために近位の身体部分を検者の反対の手でしっかり固定する（例：上腕二頭筋は上腕遠位を押さえる）。固定しないと、前鋸筋や三角筋前部の低下で上腕二頭筋が弱く見える。","break test で判定する。決めた検査肢位を保持させ、検者の抵抗で肢位が崩れる（break される）かを見る。検者と被検者の「力比べ」（active resistance test）にしない。","抵抗は被検者の力に合わせて徐々に最大まで強める。急に強い力を加えると、筋力が十分でも負けてしまう。","「健常成人では決して break されない検査肢位」を使うのが要。腸腰筋と大腿屈筋群は仰臥位で股・膝90度屈曲位、大殿筋は仰臥位の軽度屈曲位から伸展させる。","頸部前屈は示指1本で抵抗する。手内筋は2関節をまたがない位置（短母指外転筋はMP関節上、第一背側骨間筋・小指外転筋はPIP関節）に示指で抵抗する。","上肢は座位、下肢は仰臥位でまとめて診る（腱反射と同じ流れ）。頸部前屈は仰臥位、後屈は座位。"]},{"title":"グレーディング","html":"<table class=\"gr\"><tr><th>5</th><td>正常。本書の検査肢位で break されない</td></tr><tr><th>4</th><td>抵抗に抗して動かせるが break される（＋／−で細分）</td></tr><tr><th>3</th><td>重力に抗して全可動域を動かせる</td></tr><tr><th>2</th><td>重力を除けば動かせる</td></tr><tr><th>1</th><td>収縮を触れる・見るが関節は動かない</td></tr><tr><th>0</th><td>収縮なし</td></tr></table>","points":["本書では各グレードに＋／−を付けて細かくつける。4+の基準：最大筋力を出せる肢位では break されないが、わざと不利な肢位（筋の作用が弱くなる肢位）では break される。","3を正しく評価できるのは少数の筋（頸部前屈・三角筋・上腕二頭筋・腸腰筋・大腿四頭筋など）。それ以外の多くの筋では3を評価せず、2の次を4（2+の次を4−）とする。公式記録が必要なら2+や4−を「推定3」としてよい。","手指・足趾・手関節は重さが軽く、重力の有無で2と3はほとんど変わらない。","下腿三頭筋をかかと上げ回数で判定する方法（Daniels）は根拠が乏しく、本書では採らない。他の筋と同じく仰臥位で評価する。","MMTの記録には、どの手技・評価法によるかを明記する。"]},{"title":"信頼性と思い込み","points":["同じ検者の再現性は高く、経過の追跡に向く（誤差はおおむね±1段階、4と4+程度）。","診断の見込みを先に持つとMMTが歪む。例：両母指球萎縮から手根管症候群を疑い短母指外転筋を4+/4とつけたが、伝導検査は正常で、見直すと5/5だった。他の検査で裏付けが得られないときは、MMTを素直に取り直す。"]},{"title":"筋節の考え方","points":["筋節表は文献間で無視できない不一致がある。短母指外転筋はかつてC6/7とされたが、現在はC8/T1（T1主体）が主流。","本書の筋節表：前腕でも、円回内筋・橈側手根屈筋を除く正中神経支配筋はT1、尺骨神経支配筋はC8が主体。深指屈筋は示指がT1、小指がC8。","個人差は全体が半髄節上下にずれる（prefixed／postfixed）程度で、筋どうしの関係は崩れないと考えられる。"]}],"myoNotes":["濃い色＝主たる支配、中間色・淡い色＝副次的な支配。上肢・下肢の表は本書の表3・表4（色の濃淡）を写したもの。","表に載っていない筋（肘筋、母指対立筋、母指内転筋、掌側骨間筋、虫様筋、短趾屈筋、短母趾屈筋など）は各筋の見出しの記載（太字＝主）による。","深指屈筋は示指・中指（前骨間神経、T1主体）と環指・小指（尺骨神経、C8）に分けて示した。","単一根の障害では、複数の根から主に支配される筋（上腕二頭筋、上腕三頭筋など）は軽い低下にとどまることがある。"]};

$("#innMyo").addEventListener("click",e=>{const b=e.target.closest("[data-go2]");if(b)openSheet(b.dataset.go2);});

/* ---------- 3 記録 ---------- */
const GRADES=["0","1","2-","2","2+","3-","3","3+","4-","4","4+","5-","5"];
function gval(g){if(g==null||g===""||g==="NT")return null;const n=parseFloat(g);let v=isNaN(n)?null:n;if(v==null)return null;if(/\+$/.test(g))v+=0.33;if(/-$/.test(g))v-=0.33;return v;}
function gcls(g){const v=gval(g);if(v==null)return g==="NT"?"set":"";if(v>=5)return "set";if(v>=4-0.34)return "wk";return "sv";}
function recIds(){return st.set==="ul"?D.recUL:st.set==="ll"?D.recLL:D.recUL.concat(D.recLL,M.filter(m=>(isAn(m)||m.rec)&&!D.recUL.includes(m.id)&&!D.recLL.includes(m.id)).map(m=>m.id));}
function renderRec(){
  $$("#setSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.set===st.set?"true":"false"));
  let h="",last="";
  recIds().forEach(id=>{const m=BY[id];if(!m)return;const r=st.rec[id]||{};
    if(m.region!==last){h+=`<div class="grp-h">${esc(m.region)}</div>`;last=m.region;}
    h+=`<div class="rrow"><button class="nm" data-go3="${id}">${esc(m.short||m.ja)}<small>${esc(rootsOf(m,3).join("・"))}　${esc(m.nshort||m.nerve)}</small></button><button class="gbtn ${gcls(r.R)}" data-pg="${id}|R">${gradeLabel(r.R)}</button><button class="gbtn ${gcls(r.L)}" data-pg="${id}|L">${gradeLabel(r.L)}</button></div>`;});
  $("#recList").innerHTML=h;
}
$("#setSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.set=b.dataset.set;save();renderRec();});
$("#recList").addEventListener("click",e=>{const n=e.target.closest("[data-go3]");if(n){openSheet(n.dataset.go3);return;}const p=e.target.closest("[data-pg]");if(p){const [id,s]=p.dataset.pg.split("|");openPicker(id,s,p);}});
let pk=null;
function openPicker(id,side,btn){
  pk={id,side,btn};const m=BY[id];const cur=(st.rec[id]||{})[side];
  $("#pkTitle").textContent=`${m.short||m.ja}　${side==="R"?"右":"左"}`;
  $("#pkGrid").innerHTML=GRADES.map(g=>`<button data-g="${g}" class="${cur===g?"cur":""}">${g}</button>`).join("")+`<button data-g="NT" class="wide ${cur==="NT"?"cur":""}">評価不能</button><button data-g="" class="wide">消去</button><button data-g="=" class="wide">反対側と同じ</button>`;
  $("#pkNote").textContent=m.normalMayBreak?"この筋は健常者でも break され得る。左右差を重視。":"5＝本書の検査肢位で break されない。4+＝最大筋力の肢位では保てるが、わざと不利な肢位では break される。";
  $("#picker").classList.add("open");
}
$("#pkClose").addEventListener("click",()=>$("#picker").classList.remove("open"));
$("#pkGrid").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!pk)return;let g=b.dataset.g;const r=st.rec[pk.id]||(st.rec[pk.id]={});
  if(g==="="){g=r[pk.side==="R"?"L":"R"]||"";}
  if(g==="")delete r[pk.side];else r[pk.side]=g;
  if(!r.R&&!r.L)delete st.rec[pk.id];
  save();$("#picker").classList.remove("open");
  if(pk.btn){pk.btn.textContent=gradeLabel(g||null);pk.btn.className="gbtn "+gcls(g);}
  renderRec();
});
$("#allFive").addEventListener("click",()=>{recIds().forEach(id=>{const r=st.rec[id]||(st.rec[id]={});if(!r.R)r.R="5";if(!r.L)r.L="5";});save();renderRec();toast("未入力を両側5にしました");});
$("#clearRec").addEventListener("click",()=>{if(!confirm("記録をすべて消去しますか？"))return;st.rec={};save();renderRec();toast("消去しました");});

/* ---------- 4 局在解析 ---------- */
$("#sideSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.side=b.dataset.side;save();renderLoc();});
function classify(side){const W=[],N=[];Object.keys(st.rec).forEach(id=>{const m=BY[id];if(!m||!isAn(m))return;const v=gval(st.rec[id][side]);if(v==null)return;(v<5?W:N).push(id);});return {W,N};}
function nm(id){return BY[id]?(BY[id].short||BY[id].ja):id;}
function evalSet(aff,W,N,core,cw){
  const A=new Set(aff), C=new Set(core||aff);
  const ex=W.filter(x=>A.has(x)), un=W.filter(x=>!A.has(x)), cf=N.filter(x=>C.has(x));
  return {ex,un,cf,score:ex.length-un.length-(cw==null?1.5:cw)*cf.length};
}
function mainRoots(m){const ks=rootsOf(m);if(!ks.length)return [];const mx=Math.max(...ks.map(k=>m.roots[k]));return ks.filter(k=>m.roots[k]===mx);}
const RGROUPS=[["C5"],["C5","C6"],["C6"],["C6","C7"],["C7"],["C7","C8"],["C8"],["C8","T1"],["T1"],["L2"],["L2","L3"],["L3"],["L3","L4"],["L4"],["L4","L5"],["L5"],["L5","S1"],["S1"],["S1","S2"]];
function rootCands(W,N){
  return RGROUPS.map(g=>{
    const aff=M.filter(m=>isAn(m)&&g.some(r=>m.roots&&m.roots[r])).map(m=>m.id);
    const core=M.filter(m=>isAn(m)&&mainRoots(m).length&&mainRoots(m).every(r=>g.includes(r))).map(m=>m.id);
    const e=evalSet(aff,W,N,core,0.5); const exW=e.ex.reduce((s,id)=>s+Math.max(...g.map(r=>BY[id].roots[r]||0))/3,0); e.score+=exW-e.ex.length; e.strong=e.ex.some(id=>Math.max(...g.map(r=>BY[id].roots[r]||0))>=2); e.name=g.join("・")+" 神経根"; e.kind="神経根（筋節）"; if(g.length>1)e.score-=0.5; return e;
  });
}
function lesionCands(W,N){return D.lesions.map(l=>{const e=evalSet(l.aff,W,N,l.core||l.aff);e.name=l.name;e.kind=l.kind;e.note=l.note;e.spare=l.spare;if(l.spare){const sp=W.filter(x=>l.spare.includes(x));e.un=e.un;}return e;});}
function patterns(){
  const out=[];const g=(id,s)=>gval((st.rec[id]||{})[s]);
  PATTERNS.forEach(p=>{try{const r=p(g);if(r)(Array.isArray(r)?r:[r]).forEach(x=>out.push(x));}catch(e){}});
  return out;
}
function candHtml(c,top){
  return `<div class="cand ${top?"top":""}"><div class="ch"><b>${esc(c.name)}</b><span class="mu" style="font-size:12px">${esc(c.kind)}</span><span class="sc">説明 ${c.ex.length}／合わない ${c.cf.length}</span></div>`+
  `<div class="ln"><em class="ok">説明できる低下：</em>${c.ex.map(nm).map(esc).join("、")||"なし"}</div>`+
  (c.un.length?`<div class="ln"><em class="mu">説明できない低下：</em>${c.un.map(nm).map(esc).join("、")}</div>`:"")+
  (c.cf.length?`<div class="ln"><em class="ng">${c.kind.startsWith("神経根")?"主にこの根の筋で正常なもの":"正常なのに合わない筋"}：</em>${c.cf.map(nm).map(esc).join("、")}</div>`:"")+
  (c.note?`<div class="ln mu">${esc(c.note)}</div>`:"")+`</div>`;
}
function renderLoc(){
  $$("#sideSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.side===st.side?"true":"false"));
  const s=st.side, {W,N}=classify(s);
  let h="";
  const pats=patterns();
  if(pats.length) h+=`<div class="card"><h2>分布のパターン（両側の記録から）</h2>${pats.map(p=>`<div class="pat">${p}</div>`).join("")}</div>`;
  h+=`<div class="card"><h2>${s==="R"?"右":"左"}：入力 ${W.length+N.length} 筋（低下 ${W.length}・正常 ${N.length}）</h2>`;
  if(!W.length){h+=`<p class="empty">${s==="R"?"右":"左"}に5未満の筋がありません。記録タブでグレードを入れてください。</p></div>`;$("#locOut").innerHTML=h;renderTxt();return;}
  h+=`<div class="ln" style="font-size:14px"><b>低下：</b>${W.map(id=>esc(nm(id))+" "+esc(st.rec[id][s])).join("、")}</div>`;
  h+=`<p class="hint">候補は「弱い筋をどれだけ説明できるか」と「正常な筋と矛盾しないか」で並べた目安。正常筋の入力が多いほど絞り込める。</p></div>`;
  const srt=(a,b)=>b.score-a.score||a.cf.length-b.cf.length;
  const rcA=rootCands(W,N).filter(c=>c.ex.length&&c.strong).sort(srt), lcA=lesionCands(W,N).filter(c=>c.ex.length).sort(srt);
  const rc=rcA.slice(0,4), lc=lcA.slice(0,5);
  const best=rcA.concat(lcA).sort(srt).slice(0,3);
  h+=`<div class="card"><h2>まず考える候補</h2>${best.map((c,i)=>candHtml(c,i===0)).join("")}</div>`;
  h+=`<div class="card"><h2>末梢神経・神経叢の候補</h2>${lc.map(c=>candHtml(c,false)).join("")||'<p class="empty">該当なし</p>'}</div>`;
  h+=`<div class="card"><h2>神経根（筋節）の候補</h2>${rc.map(c=>candHtml(c,false)).join("")||'<p class="empty">該当なし</p>'}<p class="hint">筋節は本書の筋節表（各筋の見出し）による。単一根障害では、複数の根から主に支配される筋は軽い低下にとどまることが多い。</p></div>`;
  $("#locOut").innerHTML=h; renderTxt();
}
function renderTxt(){
  const ids=Object.keys(st.rec).filter(id=>BY[id]&&(st.rec[id].R||st.rec[id].L));
  const order=D.recUL.concat(D.recLL); ids.sort((a,b)=>(order.indexOf(a)+1||999)-(order.indexOf(b)+1||999));
  let t="MMT（右/左）\n"+ids.map(id=>`${nm(id)} ${st.rec[id].R||"-"}/${st.rec[id].L||"-"}`).join("\n");
  const pats=patterns(); if(pats.length) t+="\n\n分布："+pats.map(p=>p.replace(/<[^>]+>/g,"")).join(" / ");
  $("#txtOut").value=ids.length?t:"";
}
$("#copyTxt").addEventListener("click",async()=>{renderTxt();const v=$("#txtOut").value;if(!v){toast("記録がありません");return;}try{await navigator.clipboard.writeText(v);toast("コピーしました");}catch(e){$("#txtOut").select();document.execCommand&&document.execCommand("copy");toast("コピーしました");}});

/* ---------- 5 総論 ---------- */
function renderGen(){
  let h="";
  D.general.forEach(c=>{h+=`<div class="card"><h2>${esc(c.title)}</h2>`;if(c.html)h+=c.html;if(c.points)h+=`<ul class="pts">${c.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`;h+=`</div>`;});
  const nb=M.filter(m=>m.normalMayBreak);

  if(D.columns&&D.columns.length){h+=`<div class="card"><h2>コラムの要点</h2>`;D.columns.forEach(c=>{h+=`<details class="emg"><summary>${esc(c.title)}</summary><ul class="pts">${c.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul><p class="src">本書 p.${c.bookPage}</p></details>`;});h+=`</div>`;}
  h+=`<div class="card"><h2>出典・注意</h2><ul class="pts"><li>園生雅弘『MMT・針筋電図ガイドブック』中外医学社, 2018（手持ちPDF）。各筋の手技・筋節・神経・臨床的事項は同書の要約。</li><li>神経の枝分かれの順と本書に項目のない筋は、『末梢神経と筋のみかた』（MRC『Aids to the Examination of the Peripheral Nervous System』第5版の日本語版, 診断と治療社）で確認した一般的な解剖による。</li><li>局在解析は候補を絞るための補助。診断は診察全体と電気生理検査で行う。</li><li>入力は端末内にのみ保存。患者個人情報は入力しない。</li></ul>
  <div class="row-btn" style="margin-top:8px;align-items:center"><span class="mu" style="font-size:13px">アプリの版：<b>${APP_VERSION}</b></span><button class="btn sm" id="forceUpdate">最新版に更新</button></div></div>`;
  $("#genOut").innerHTML=h;
  $("#genOut").addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)openSheet(g.dataset.go);});
  $("#forceUpdate").addEventListener("click",async()=>{toast("最新版を確認しています…");try{if("serviceWorker" in navigator){const r=await navigator.serviceWorker.getRegistration("../");if(r)await r.update();}}catch(e){}try{await fetch(location.href,{cache:"reload"});}catch(e){toast("通信できないため更新を確認できません");return;}setTimeout(()=>location.reload(),800);});
}

renderList();renderTree();renderMyo();renderRec();renderGen();
})();

</script>
