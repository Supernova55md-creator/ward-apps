<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MMTナビ</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6B4FA0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MMTナビ">
<style>
/* 片手で使う病棟ツール：上に要約、下にタブ。紫＝MMTナビの基調色 */
:root{
  --bg:#F5F4F8; --surface:#FFFFFF; --ink:#1E1B2B; --muted:#5E5A6E; --line:#E1DDEA;
  --accent:#6B4FA0; --accent-strong:#4B3478; --accent-soft:#EEE8F7;
  --main:#6B4FA0; --mid:#A08BC8; --minor:#DDD3EE;
  --ok:#2E7D4F; --ok-soft:#E5F3EA; --warn:#B45309; --warn-soft:#FDEEDC; --crit:#B42318; --crit-soft:#FDE7E5;
  --font-body:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --font-num:ui-monospace,"SFMono-Regular","Menlo","Roboto Mono",monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15131B; --surface:#1F1C27; --ink:#ECE9F2; --muted:#A7A1B6; --line:#332F3F;
    --accent:#B69AF0; --accent-strong:#CDB8F7; --accent-soft:#2E2540;
    --main:#B69AF0; --mid:#7F68AE; --minor:#4A3F63;
    --ok:#5CC48A; --ok-soft:#173326; --warn:#F0A35A; --warn-soft:#3A2614; --crit:#F27A6E; --crit-soft:#3D1C1A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--accent-strong)}
.app{max-width:680px;margin:0 auto;min-height:100%;padding:0 calc(14px + env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:50%;border:5px solid var(--accent);flex:none}
.brand h1{font-size:19px;font-weight:900}
.brand small{color:var(--muted);font-size:11px;margin-left:auto;text-align:right;line-height:1.3}
section.view{display:none;padding-top:12px}
section.view.active{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.card h2{font-size:16px;font-weight:800;margin-bottom:8px}
.card h3{font-size:14px;font-weight:800;margin:10px 0 4px;color:var(--accent-strong)}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 13px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
.btn.danger{color:var(--crit)}
.row-btn{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
input[type=search],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-height:44px}
textarea{font-family:var(--font-num);font-size:13px;min-height:120px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:13px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{font:inherit;font-size:14px;border:0;background:var(--surface);color:var(--muted);padding:9px 4px;cursor:pointer;min-height:42px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:800}
/* 筋リスト */
.mlist{list-style:none;margin:0;padding:0}
.mlist li{border-bottom:1px solid var(--line)}
.mlist li:last-child{border-bottom:0}
.mrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;background:none;border:0;color:var(--ink);padding:10px 2px;cursor:pointer;min-height:52px}
.mrow .nm{font-weight:700;font-size:15px;line-height:1.35}
.mrow .sub{font-size:12px;color:var(--muted);display:block;font-weight:400}
.mrow .rt{margin-left:auto;display:flex;gap:3px;flex:none}
.rb{font-family:var(--font-num);font-size:11px;padding:1px 5px;border-radius:5px;background:var(--minor);color:var(--ink)}
.rb.m{background:var(--main);color:#fff;font-weight:700}
.rb.m2{background:var(--mid);color:#fff}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.tag.mv{background:var(--accent-soft);color:var(--accent-strong)}
.tag.nb{background:var(--warn-soft);color:var(--warn)}
.grp-h{font-size:12px;font-weight:800;color:var(--muted);margin:14px 2px 2px;letter-spacing:.04em}
.count{font-size:12px;color:var(--muted);margin:6px 2px 0}
/* 詳細シート */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.sheet.open{display:block}
.sheet .in{max-width:680px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:6px 0 8px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:10px}
.sheet-h h2{font-size:18px;font-weight:900;line-height:1.3}
.sheet-h .en{display:block;font-size:12px;color:var(--muted);font-weight:400}
.sheet-h .btn{margin-left:auto;flex:none}
.kv{display:grid;grid-template-columns:4.6em 1fr;gap:4px 10px;font-size:15px}
.kv dt{color:var(--muted);font-size:13px;padding-top:2px}
.kv dd{margin:0}
.rootbar{display:grid;gap:3px;margin:6px 0 2px}
.rootbar span{font-family:var(--font-num);font-size:12px;text-align:center;border-radius:6px;padding:3px 0;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.rootbar span.m{background:var(--main);color:#fff;border-color:var(--main);font-weight:800}
.rootbar span.s{background:var(--minor);color:var(--ink);border-color:var(--minor)}
.rootbar span.s2{background:var(--mid);color:#fff;border-color:var(--mid)}
.step{display:grid;grid-template-columns:3.6em 1fr;gap:6px;padding:7px 0;border-top:1px dashed var(--line);font-size:15px}
.step:first-of-type{border-top:0}
.step b{font-size:13px;color:var(--accent-strong)}
ul.pts{margin:4px 0 0;padding-left:1.2em}
ul.pts li+li{margin-top:4px}
.warnbox{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:6px;padding:8px 10px;font-size:14px;margin:8px 0}
details.emg summary{cursor:pointer;font-weight:800;color:var(--accent-strong);min-height:36px;display:flex;align-items:center}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.links button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 9px;cursor:pointer;min-height:34px}
.gradebox{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.src{font-size:12px;color:var(--muted);margin-top:8px}
/* 神経支配 */
.ntree .nerve{margin-bottom:10px}
.ntree .nh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ntree .nh b{font-size:15px}
.ntree .nh span{font-size:12px;color:var(--muted)}
.ntree ol{margin:6px 0 0;padding:0;list-style:none;border-left:3px solid var(--accent-soft);padding-left:10px}
.ntree li{padding:3px 0}
.ntree li.br{font-size:12px;font-weight:800;color:var(--muted);padding-top:6px}
.ntree li button{font:inherit;font-size:15px;background:none;border:0;color:var(--ink);padding:4px 0;cursor:pointer;text-align:left;display:flex;gap:6px;align-items:center;width:100%;min-height:36px}
.ntree li button .rt{margin-left:auto;display:flex;gap:3px}
.mtab{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.mtab th,.mtab td{padding:4px 3px;border-bottom:1px solid var(--line)}
.mtab th{font-family:var(--font-num);color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--surface)}
.mtab td.n{white-space:nowrap;max-width:9.5em;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mtab td.nv{font-size:11px;color:var(--muted);white-space:nowrap}
.mtab td.c{width:2.3em;text-align:center}
.mtab td.c i{display:block;height:16px;border-radius:4px}
.mtab td.c i.m{background:var(--main)}
.mtab td.c i.s{background:var(--minor)}
.mtab td.c i.s2{background:var(--mid)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* 記録 */
.rec-h{display:grid;grid-template-columns:1fr 3.6em 3.6em;gap:6px;font-size:12px;color:var(--muted);font-weight:700;padding:0 2px 4px;text-align:center}
.rec-h span:first-child{text-align:left}
.rrow{display:grid;grid-template-columns:1fr 3.6em 3.6em;gap:6px;align-items:center;padding:4px 2px;border-bottom:1px solid var(--line)}
.rrow .nm{font-size:14px;font-weight:700;line-height:1.3;background:none;border:0;color:var(--ink);text-align:left;font-family:inherit;padding:4px 0;cursor:pointer}
.rrow .nm small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.gbtn{font-family:var(--font-num);font-size:16px;font-weight:800;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;min-height:42px;cursor:pointer}
.gbtn.set{color:var(--ink);background:var(--surface)}
.gbtn.wk{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.gbtn.sv{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.picker{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:10px calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:none}
.picker.open{display:block}
.picker .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:800;max-width:680px;margin-left:auto;margin-right:auto}
.picker .ph .btn{margin-left:auto}
.picker .pg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:680px;margin:0 auto}
.picker .pg button{font-family:var(--font-num);font-size:17px;font-weight:800;min-height:48px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;cursor:pointer}
.picker .pg button.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.picker .pg button.wide{grid-column:span 2;font-family:var(--font-body);font-size:14px}
.picker .pnote{font-size:12px;color:var(--muted);max-width:680px;margin:6px auto 0}
/* 解析 */
.cand{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.cand .ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cand .ch b{font-size:15px}
.cand .sc{margin-left:auto;font-family:var(--font-num);font-size:12px;color:var(--muted)}
.cand .ln{font-size:13px;margin-top:3px}
.cand .ln em{font-style:normal;font-weight:700}
.cand.top{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ok{color:var(--ok)} .ng{color:var(--crit)} .mu{color:var(--muted)}
.pat{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:8px 10px;font-size:14px;margin:8px 0}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}
table.gr{width:100%;border-collapse:collapse;font-size:14px}
table.gr th,table.gr td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.gr th{font-family:var(--font-num);width:3.2em;color:var(--accent-strong)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{font:inherit;font-size:11px;border:0;background:none;color:var(--muted);padding:8px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px}
nav.tabs button b{font-size:16px}
nav.tabs button[aria-selected="true"]{color:var(--accent-strong)}
nav.tabs button[aria-selected="true"] b{border-bottom:3px solid var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>MMTナビ</h1><small>徒手筋力テスト・神経支配<br>出典：園生『MMT・針筋電図ガイドブック』</small></div>
</header>

<!-- 1 筋 -->
<section class="view active" id="v-list">
  <input type="search" id="q" placeholder="筋名・略号・神経・作用で検索（例：APB、腓骨、外転）" autocomplete="off">
  <div class="chips" id="regChips" role="group" aria-label="部位"></div>
  <div class="filters">
    <select id="fRoot" aria-label="筋節で絞り込み"></select>
    <select id="fNerve" aria-label="末梢神経で絞り込み"></select>
  </div>
  <div class="count" id="cnt"></div>
  <div class="card" style="padding:4px 12px;margin-top:8px"><ul class="mlist" id="mlist"></ul></div>
</section>

<!-- 2 支配 -->
<section class="view" id="v-inn">
  <div class="seg" style="--n:2" role="group"><button data-im="tree" aria-pressed="true">末梢神経（近位→遠位）</button><button data-im="myo" aria-pressed="false">筋節表</button></div>
  <div id="innTree" class="ntree"></div>
  <div id="innMyo" class="hidden"></div>
</section>

<!-- 3 記録 -->
<section class="view" id="v-rec">
  <div class="seg" style="--n:3" role="group" id="setSeg"><button data-set="ul" aria-pressed="true">上肢</button><button data-set="ll" aria-pressed="false">頸部・下肢</button><button data-set="all" aria-pressed="false">全筋</button></div>
  <div class="card">
    <div class="rec-h"><span>筋（名前を押すと手技）</span><span>右</span><span>左</span></div>
    <div id="recList"></div>
    <p class="hint">グレードのボタンを押して選ぶ。未入力は判定に使わない。5未満を「筋力低下あり」、5を「正常」として局在タブで解析する。入力は端末内にのみ保存。</p>
    <div class="row-btn" style="margin-top:8px"><button class="btn sm" id="allFive">未入力を両側5にする</button><button class="btn sm danger" id="clearRec">記録を消去</button></div>
  </div>
</section>

<!-- 4 局在 -->
<section class="view" id="v-loc">
  <div class="seg" style="--n:2" role="group" id="sideSeg"><button data-side="R" aria-pressed="true">右</button><button data-side="L" aria-pressed="false">左</button></div>
  <div id="locOut"></div>
  <div class="card">
    <h2>記録の書き出し</h2>
    <div class="row-btn"><button class="btn primary" id="copyTxt">カルテ用テキストをコピー</button></div>
    <textarea id="txtOut" readonly style="margin-top:8px"></textarea>
  </div>
</section>

<!-- 5 総論 -->
<section class="view" id="v-gen">
  <div id="genOut"></div>
</section>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"><div class="in" id="sheetIn"></div></div>

<div class="picker" id="picker" role="dialog" aria-label="グレードを選ぶ">
  <div class="ph"><span id="pkTitle"></span><button class="btn sm" id="pkClose">閉じる</button></div>
  <div class="pg" id="pkGrid"></div>
  <div class="pnote" id="pkNote"></div>
</div>

<nav class="tabs" aria-label="画面切り替え"><div class="in" role="tablist">
  <button role="tab" data-v="v-list" aria-selected="true"><b>筋</b>手技</button>
  <button role="tab" data-v="v-inn" aria-selected="false"><b>支配</b>神経・筋節</button>
  <button role="tab" data-v="v-rec" aria-selected="false"><b>記録</b>MMT</button>
  <button role="tab" data-v="v-loc" aria-selected="false"><b>局在</b>解析</button>
  <button role="tab" data-v="v-gen" aria-selected="false"><b>総論</b>・出典</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const APP_VERSION="2026-11-08a";
/* 分布パターンの判定。g(id,side) はグレード数値（未入力は null）。本書の臨床的事項・コラムに基づく */
const PATTERNS=(function(){
  const S=[["R","右"],["L","左"]];
  const wk=(g,id,s)=>{const v=g(id,s);return v!=null&&v<5;};
  const nl=(g,id,s)=>{const v=g(id,s);return v!=null&&v>=5;};
  const any=(g,ids,s)=>ids.some(i=>wk(g,i,s));
  return [
  // 錐体路性分布
  function(g){const out=[];S.forEach(([s,lab])=>{
    if(wk(g,"deltoid_ant",s)&&nl(g,"biceps_brachii",s)&&!(wk(g,"deltoid_lat",s)&&wk(g,"infraspinatus",s)))
      out.push(`<b>${lab}上肢：錐体路性の分布に合う</b>（三角筋前部・掌側骨間筋が弱く、上腕二頭筋は保たれる）。上肢では三角筋前部と掌側骨間筋が最も鋭敏で、小指外転筋（左右比較）、第一背側骨間筋・指伸筋が続く。反射所見と合わせて判断。`);
    if(wk(g,"iliopsoas",s)&&(wk(g,"big_toe_extensors",s)||wk(g,"semitendinosus",s)||wk(g,"biceps_femoris_long",s)||wk(g,"gluteus_medius",s))&&nl(g,"gluteus_maximus",s)&&(nl(g,"vastus_medialis",s)||nl(g,"rectus_femoris",s)))
      out.push(`<b>${lab}下肢：錐体路性の分布に合う</b>（腸腰筋・母趾背屈が弱く、大殿筋・大腿四頭筋は保たれる）。下肢では腸腰筋＝母趾伸展＞股外転＞大腿屈筋群＞前脛骨筋の順に弱くなり、大殿筋は極めて保たれやすい。`);
  });return out;},
  // 近位筋優位・両側（筋疾患・神経筋接合部）
  function(g){
    const prox=["neck_flexion","deltoid_lat","deltoid_ant","biceps_brachii","iliopsoas","semitendinosus","gluteus_maximus"];
    const dist=["fdi","adm","apb","tibialis_anterior","gastrocnemius_medial","extensor_digitorum_brevis"];
    const bil=prox.filter(i=>i==="neck_flexion"?wk(g,i,"R")||wk(g,i,"L"):wk(g,i,"R")&&wk(g,i,"L"));
    const dn=dist.filter(i=>nl(g,i,"R")&&nl(g,i,"L"));

const D={"items":[{"id":"deltoid_lat","kind":"muscle","ja":"三角筋（外側筋束・肩峰部）","en":"Deltoid, acromial part","abbr":"","region":"肩甲帯・上腕","roots":{"C5":3,"C6":1},"rootText":"C5,(C6)","nerve":"腋窩神経","action":"肩関節外転","mmt":{"position":"座位。両上肢を横から水平位まで外転挙上して保持させる。","fixation":"両側同時なら検者の左右の力が拮抗して体幹は固定される。片側ずつなら非検査手を対側または同側の肩に当てて押さえる。","technique":"被検者の前方に立ち、両上腕遠位部に手を当てて下方へ押し下げ、break されるかを見る。肘は伸ばしたままでよい。","grading":"通常の方法で5・4・3を評価できる。水平位まで挙上できれば概ね3とみてよい。2の厳密な評価は仰臥位が必要で、座位では1+〜3-の間で適宜つける。座位で自力外転できる最大角度（肩甲の回旋を除いた肩関節での角度）を記録すると経過観察に便利。筋腹を触れやすく0と1の区別もできる。","pitfalls":["両側同時の検査で通常は十分だが、片側ずつでもよい。","前鋸筋の筋力低下があると肩甲骨が回旋して肢位が崩れ、三角筋が弱いように見える。非検査手で背側から肩甲骨を押さえて固定して検査するが、手技が難しく、この状況で三角筋の軽度低下を判定するのは困難。","下垂位から約15度までの初期外転（initial abduction）は主に棘上筋が担うとされる。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、上肢軽度外転位。","insertion":"肩峰の起始部と上腕骨付着部の中間点で、体の前後の中間（最外側）。触れる筋束のうち固く触れるものの中央に刺す。","activation":"上肢を30度程度外転した位置から、上腕遠位外側〜前腕に当てた検者の手に抗してさらに外転させる。","notes":["袖のたくし上げで足りることが多いが、腕が圧迫されないよう注意し、無理なら肩から脱いでもらう。","たくし上げ不十分で筋腹遠位端付近に刺さないよう、上腕骨付着部をきちんと同定して中間点を決める。"]},"clinical":["近位型頸椎症性筋萎縮症（proximal CSA、C5障害）の代表的罹患筋で、C5の示準筋となる。C5障害では三角筋と棘下筋が最も強く、次いで腕橈骨筋・上腕二頭筋が障害される。","三角筋≦上腕二頭筋の障害ならC6優位のC5/6障害を考える（C6単独障害では両筋とも通常低下しない）。ただしC5+C6障害でも多くは三角筋が最も強い。","急性の三角筋筋力低下の原因として、近位型CSA、神経痛性筋萎縮症（NA）、脳梗塞による isolated shoulder palsy がある。中枢性か末梢性かは急性期から針筋電図の動員パターンで鑑別できる。","三角筋CMAP振幅の健側比が近位型CSAの予後判定に使われ、健側の約1/4以上なら回復良好とされる。筋力低下に比してCMAPが保たれていれば伝導ブロックの関与が示唆され予後良好。","NAでは三角筋記録・腋窩刺激でErb点−腋窩間の伝導ブロックを証明できることがある。","ALSでも早期に障害され、小手筋も早期に侵されるため、三角筋＞上腕二頭筋/上腕三頭筋＜小手筋という分布がALSに特徴的（ただし著者はALSで三角筋の針筋電図をルーチンには行っていない）。","多発筋炎/皮膚筋炎・重症筋無力症でも障害されやすい。筋炎で上腕二頭筋にFib/PSWが出なければ三角筋を調べるのも一法で、生検筋にも使える。","顔面肩甲上腕型筋ジストロフィーの上肢挙上障害の主因は前鋸筋・僧帽筋による肩甲固定不良で、三角筋はあまり侵されない。肩甲固定下MMTで三角筋正常と分かることがあり、針筋電図で三角筋を調べても所見に乏しいことがある。"],"page":34,"headText":"C5,(C6)","rootSrc":"表","nk":"ax","short":"三角筋（外側）","nshort":"腋窩","bookPage":30},{"id":"deltoid_ant","kind":"muscle","ja":"三角筋（前部筋束・鎖骨部）","en":"Deltoid, clavicular part","abbr":"","region":"肩甲帯・上腕","roots":{"C5":3,"C6":1},"rootText":"C5,(C6)","nerve":"腋窩神経","action":"肩関節屈曲（前方挙上）","mmt":{"position":"座位。両上肢を前方へ水平位まで屈曲（前方挙上）して保持させる。","fixation":"座位では上半身の体重が固定となるが完全ではない。片側ずつなら非検査手を同側の肩に当てて体幹を固定する。","technique":"前方に立ち、両上腕遠位部に手を当てて下方に押し下げ、break されるかを見る。","grading":"外側筋束に準ずる。","pitfalls":["三角筋のMMTは通常外側筋束で十分で、前部筋束は臨床的理由がある時だけ調べる。","両側同時では体幹固定がやや不十分となり、完全に5かどうかは外側筋束より判断しにくい。","前鋸筋の筋力低下で肩甲骨が浮き上がると見かけ上三角筋が弱く見える。肩甲骨を背側から体幹に押さえて固定して検査する。この手技は外側筋束より容易で、偽の三角筋低下を見抜くのに向いている可能性がある。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、上肢内転位。","insertion":"固く触れる前部筋束の中央。","activation":"上腕遠位前面に検者の手を当て、上肢を屈曲（前方挙上）させる。","notes":["刺入部の露出は外側筋束と同様だが、肩から脱いでもらう方が容易なことが多い。"]},"clinical":["筋節・末梢神経支配は外側筋束と同じと考えられ、通常は外側筋束と別にMMT・針筋電図を行う必要はない。","錐体路障害では外側筋束より早期に筋力低下し、上肢で最も鋭敏に錐体路性低下を検出できる筋の一つ。上肢の軽微な錐体路徴候を見たい時に検査する価値があり、上肢Barré徴候の下降はこの筋の低下を見ているといえる。"],"page":38,"headText":"C5,(C6)","rootSrc":"表","nk":"ax","short":"三角筋（前部）","nshort":"腋窩","bookPage":34},{"id":"upper_trapezius","kind":"muscle","ja":"上部僧帽筋","en":"Upper trapezius","abbr":"UT","region":"肩甲帯・上腕","roots":{"C3":3,"C4":3,"C5":3},"rootText":"C3,C4,C5","nerve":"副神経脊髄根（いわゆる脊髄副神経 spinal accessory nerve）","action":"肩甲挙上","mmt":{"position":"座位。肩をすくめさせ、両肩を最大挙上位で保持させる。","fixation":"上半身の体重が固定の役目を果たす。","technique":"両手を両側僧帽筋外側部（肩峰の内側）に当てて押し下げ、break されるかを見る。","grading":"3の評価も可能。","pitfalls":["強い筋のため、多少の筋力低下があっても break できず、検出感度は低い。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、自然な肢位。","insertion":"肩を頭側へ挙上させて上部僧帽筋の筋腹を確認し、その内外側方向のほぼ中央〜やや内側寄りに刺入する。","activation":"肩を頭側へ挙上させ、肩に当てた検者の手で抵抗する。","notes":["安静時は首〜肩の力を抜かせ、随意活動が残れば肩を軽く揺すって脱力を促す。"]},"clinical":["脳神経支配筋と思われがちだが、細胞体は頸髄C3〜C5にあり、脊髄根が脊柱管内を上行して大後頭孔を通り延髄根と合流して副神経となり、頸静脈孔から出る。","このためALSの領域分類では脳神経筋でなく頸髄筋とすべきと著者は考える。頸椎症（CSA含む）では障害されにくく特に安静時活動は出ないため、UTの安静時活動は頸椎症を否定しALSを示唆する有力な所見となる。","舌や胸鎖乳突筋より安静を得やすい点も有用で、ALSでの線維束自発電位の出現頻度も高い部類。","反復神経刺激試験にもよく用いるが pseudofacilitation のアーチファクトが入りやすく、あらかじめ肩を受動的に挙上しておくとよい。UTの漸減現象はALSで頻度が高く、CSAでは見られないため、CSAとの鑑別でALSを強く示唆する。"],"page":40,"headText":"C3,C4,C5","rootSrc":"見出し","nk":"xi","short":"僧帽筋（上部）","nshort":"副神経","bookPage":36},{"id":"serratus_anterior","kind":"muscle","ja":"前鋸筋","en":"Serratus anterior","abbr":"SA","region":"肩甲帯・上腕","roots":{"C5":2,"C6":1,"C7":1},"rootText":"C5,(C6,C7)","nerve":"長胸神経","action":"肩甲骨の外転と上方回旋","mmt":{"position":"座位。上肢を90度前方挙上し肘を最大屈曲位として、肘を前方へ最大限突き出した位置で保持させる。","fixation":"非検査手を肩甲骨上でない背部に当て、検者の力で体幹ごと後ろへ押されるのに抵抗する。","technique":"検査手を肘に当てて後方へ押し、break されるかを見る。強い筋なので検者が体重をかけて身体ごと押す程度でないと軽度低下は検出できない。同時に背部の手で肩甲骨内側縁が浮き出ないか（翼状肩甲）を触れて確認する。","grading":"細かいgradingは困難。軽度でも肩甲骨内側縁の浮き出しがあれば筋力低下（MMT4）と判断する。","pitfalls":["肩関節は正確に90度屈曲とし、加える力も正確に水平後方とする。肩関節周囲筋の関与を防ぐため。","三角筋前部筋束が弱い患者（近位型CSA、NAなど）では、検者が肘をつかんで上腕を90度屈曲位に支えて三角筋を補いつつ前後方向の力だけを評価する。慣れれば可能。","肘伸展位で手掌を押させる・壁押しの方法は上腕三頭筋が正常であることが前提で、三頭筋が弱いと肘が曲がって評価しにくい。","Danielsの130度程度屈曲位で上腕を押し下げる方法は三角筋前部筋束の正常が前提で、近位型CSAやNAでは使えない。"]},"normalMayBreak":false,"emg":{"position":"仰臥位。上肢をベッドから垂直に天井方向へ伸ばす。筋の発達した人ではこれだけで鋸状の筋腹が見えることがある。","insertion":"広背筋前縁を同定し、その前方に出る肋骨の一つを示指・中指で挟んで肋間をブロックし、背側寄りの肋骨上の筋腹に刺入する。少しずつ進め、刺入時電位が出て tissue noise が消えればSAに入ったと判断する。","activation":"上肢全体を天井方向へ押し上げさせる。","notes":["肋間に進むと危険。呼吸性の周期的活動（肋間筋）が出たら針を引いて方向を見直す。","安静時は上肢を天井方向に伸ばしたまま肘を検者（または補助者）が保持すると力が抜ける。","軽く上肢を持ち上げさせて鋭いMUPが出ることを確認するとよい。"]},"clinical":["NAで高頻度に障害されるとされるが、わが国ではSA低下をきたす典型的なNAは多くない印象と著者は述べる。","頸椎症、特にCSAではまず障害されない。C5〜C7の広範な髄節障害でもなかなか筋力低下にならない（C7障害で翼状肩甲をきたすという報告はあるが著者は経験がない）。","翼状肩甲をきたすミオパチー（顔面肩甲上腕型筋ジストロフィーなど）では早期から低下する。リュックサック麻痺など長胸神経単ニューロパチーでも障害される。"],"page":42,"headText":"(C5,C6,C7) 要確認","rootSrc":"表","nk":"lt","nshort":"長胸","bookPage":38},{"id":"rhomboid_major","kind":"muscle","ja":"大菱形筋","en":"Rhomboid major","abbr":"RM","region":"肩甲帯・上腕","roots":{"C5":3},"rootText":"C5","nerve":"肩甲背神経","action":"肩甲骨の内転と下方回旋","mmt":{"position":"著者はMMTを行っていない（単独のMMTは不可能と考えている）。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"座位または側臥位。背部、肩甲骨下内側部を露出する。","insertion":"肩甲骨下角を検者の母指・示指で挟み、母指を内側縁に沿わせた先端部が刺入点。僧帽筋の筋腹を確認して避け、肩甲骨内側縁のすぐ内側でRMが皮下にある部位（聴診三角：肩甲骨内縁・僧帽筋外側縁・広背筋上縁に囲まれる）に刺す。","activation":"肘を曲げて肩関節を伸展（後方挙上）させ、「肘鉄を食らわす」ように肘に当てた検者の手を押させる。","notes":["僧帽筋に覆われていない部分で行う。RMが皮下にある範囲は狭く、内側下方に外れたり突き抜けたりすると肋間筋があり危険。呼吸性の周期的活動で気づける。"]},"clinical":["肩甲背神経はC5根から直接分岐し、純粋なC5支配筋で、腕神経叢で最も近位に分岐する神経の支配筋である。","このため本筋の障害は腕神経叢より近位の病変を示唆するが、同目的には頸部傍脊柱筋の方が明確に有用（障害があれば神経根〜前角を示唆）なので、RMを検査する必要は多くない。"],"page":46,"headText":"C5","rootSrc":"表","nk":"dsc","nshort":"肩甲背","bookPage":42},{"id":"infraspinatus","kind":"muscle","ja":"棘下筋","en":"Infraspinatus","abbr":"Isp","region":"肩甲帯・上腕","roots":{"C5":3,"C6":1},"rootText":"C5,(C6)","nerve":"肩甲上神経","action":"肩関節外旋","mmt":{"position":"座位。肘90度屈曲、上腕内転で肘を体幹に付け、前腕は回内外中間位〜回外位。肩を外旋させ、前腕を正面前方〜やや外方に保持させる。","fixation":"非検査手で上腕遠位〜肘部をつかみ、体幹に押し付けるように固定する。","technique":"検査手を前腕遠位の外側に当てて内旋方向に力を加え、break されるかを見る。","grading":"MMT3の正確な評価には姿勢変換が必要で面倒。","pitfalls":["C5障害では上腕二頭筋も弱く肘90度屈曲位を保てないことがある。その場合は検者の前腕で被検者の前腕を持ち上げて肘90度を保ちつつ肘部も固定する。","外旋には小円筋・三角筋後部筋束なども関与するため、Ispが極めて弱くても若干外旋できることがある。高度低下時は肩甲骨背面でIspの筋腹を触知して評価を併用する。"]},"normalMayBreak":false,"emg":{"position":"座位または側臥位。背部、肩甲棘下部を露出する。","insertion":"肩を外旋させて筋腹を確認し刺入する。肩甲棘より尾側の肩甲骨背面はほぼ全てIspに覆われるので同定は容易。","activation":"MMTと同じく、肘を曲げて肩を外旋する力を入れさせる。","notes":["肩甲骨から外れると肋間筋があり注意。収縮中に位置関係がずれて外れることもある。呼吸性の周期的活動で気づける。"]},"clinical":["近位型CSA（C5またはC5/6障害）では三角筋・上腕二頭筋・腕橈骨筋とともに必ず障害される。","NAでも高頻度に障害されるが、その場合は三角筋とIsp（＋前鋸筋）のみが侵され上腕二頭筋が保たれることが多い。","通常はMMTで障害の有無を評価でき、針筋電図が必要な場面は多くない。"],"page":48,"headText":"C5,(C6)","rootSrc":"表","nk":"ssc","nshort":"肩甲上","bookPage":44},{"id":"shoulder_internal_rotation","kind":"movement","ja":"肩関節内旋","en":"Shoulder internal rotation","abbr":"","region":"肩甲帯・上腕","roots":{},"rootText":"記載なし（複数筋）","nerve":"","action":"肩関節内旋（肩甲下筋・大胸筋・広背筋・大円筋・三角筋前部筋束など）","mmt":{"position":"座位。肘90度屈曲、上腕内転で肘を体幹に付け、前腕は回内外中間位〜回外位。肩を内旋させ、前腕を正面前方〜内方に保持させる。","fixation":"非検査手で上腕遠位〜肘部をつかんで保持する。","technique":"検査手を前腕遠位の内側に当てて外旋方向に力を加え、break されるかを見る。","grading":"MMT3の正確な評価には姿勢変換が必要で面倒。","pitfalls":["上腕二頭筋が弱い場合は、棘下筋と同様に前腕を持ち上げつつ肘部を固定する必要がある。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":[]},"clinical":["多数の筋が関与するため1〜2髄節の障害では弱くならず、C5〜C8やC6〜T1など多髄節の障害で初めて低下する。ALS、筋炎、CIDPなど全身の筋を侵す疾患では弱くなり得る。"],"page":51,"rootSrc":"見出し","nk":"","short":"肩関節内旋","bookPage":47},{"id":"latissimus_dorsi","kind":"muscle","ja":"広背筋","en":"Latissimus dorsi","abbr":"LD","region":"肩甲帯・上腕","roots":{"C6":1,"C7":3,"C8":1},"rootText":"C7,(C6,C8)","nerve":"胸背神経","action":"肩関節内転","mmt":{"position":"座位。肩関節90度外転でやや後方へ反らした（水平伸展）位置。肘は屈伸どちらでもよい。腕を下へ押し下げさせ、90度外転位を保持させる。","fixation":"検者の非検査側前腕を被検者の肩の上に置いて押さえる。","technique":"上腕の下面（内側）に検者の前腕〜肘を当てて上方（外転方向）へ力を加え、break されるかを見る。固定手には持ち上げる強い力がかかるので肩を上から強く押さえる。","grading":"MMT3の評価は不可能。","pitfalls":["強い筋で、検者が全身を使う感じで検査しないと軽度低下は検出できないことが多い。","外転位で前方に回した（水平屈曲）位置での内転は大胸筋が主となるため、やや後方へ反らした肢位で調べる。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"上記MMT手技で容易に同定できる筋腹を調べる（施行機会は多くない）。","activation":"","notes":[]},"clinical":["上腕三頭筋・橈側手根屈筋と並ぶC7支配筋。C7神経根症での感度は上腕三頭筋に劣るが特異度は高く、三頭筋と同時に低下していればC7障害を強く示唆する。","通常はMMTのみ。C7障害を証明したい時に針筋電図を加えてもよいが、傍脊柱筋で脱神経を捉えれば神経根症は証明できるので必須となることは少ない。"],"page":52,"headText":"C7","rootSrc":"表","nk":"td","nshort":"胸背","bookPage":48},{"id":"biceps_brachii","kind":"muscle","ja":"上腕二頭筋","en":"Biceps brachii","abbr":"BB","region":"肩甲帯・上腕","roots":{"C5":3,"C6":2},"rootText":"C5＋C6","nerve":"筋皮神経","action":"肘関節屈曲","mmt":{"position":"座位。上腕を体幹に付け、前腕最大回外位で肘90度屈曲位を保持させる。","fixation":"非検査手で上腕遠位部（肘関節のすぐ近位）をしっかり持って固定する。","technique":"検査手を前腕遠位屈側に当てて肘を伸ばす方向に力を加え、90度屈曲位が break されるかを見る。固定手には肘を後方へ押す強い力がかかる。","grading":"通常の方法で5・4・3を正確に評価できる。2の評価は肩90度外転位に検者が支え、前腕回外位のまま肘を屈曲できるかを見るがやや難しい（回外筋力も弱いと前腕が回内し、腕橈骨筋や前腕屈筋群で屈曲できてしまう）。","pitfalls":["肘のすぐ近位での固定が非常に重要。固定がないと三角筋前部筋束や前鋸筋の低下を上腕二頭筋の低下と見誤る。","二関節筋であり、肘屈曲角度だけでなく肩の屈曲角度でも筋長と最大筋力が変わるため、標準化した肢位で検査する。","強い筋なので軽度低下は見逃されやすい。検者の体重をかける、肘を90度より伸展位で調べるなどで検出できることがあるが、伸展位では筋力が急速に落ちるため左右で角度を厳密に揃える。","前腕回外位が最も純粋に上腕二頭筋を評価できる。中間位では腕橈骨筋、回内位では上腕筋の寄与が増すが、完全には分離できない。回内位では長橈側手根伸筋などでも多少屈曲できる。"]},"normalMayBreak":false,"emg":{"position":"仰臥位。安静時と随意収縮時で上肢の肢位が異なる。","insertion":"著者は短頭（内側の筋束）を好んで用いる。触知できる短頭の中央からやや遠位寄り。随意収縮時の至適刺入点は安静時より約3〜4cm近位にずれるため、通常刺し直しが必要。","activation":"肩軽度外転・内外旋中間位、肘90度屈曲・前腕回外位で力を入れさせる。手だけでは対抗できず、検者の前腕を引っ掛けるようにして抵抗することが多い。","notes":["安静時は上肢を体側のベッド上に置き、肩軽度外旋・肘ごく軽度屈曲・前腕回内位とすると力が抜けやすい。抜けなければ前腕遠位の下に枕を入れて肘をさらに屈曲させる（枕がない方がよいこともある）、揺する等で調整する。","随意収縮中は等尺性を保つことが特に重要。針を刺したまま肘が伸展すると強い痛みが生じ筋断裂の恐れがある。被検者が力を抜く瞬間に検者が前腕を保持して伸展を防ぐ。","別法として肘伸展位で前腕回外の力を入れさせる方法がある。弱収縮には十分で刺し直し不要のことが多いが、最大収縮は得にくく、断裂には同様に注意する。","短頭と長頭を区別せず筋腹全体の中央に刺すと頭間の結合組織に入りMUPが得にくい。","刺入点が遠位・内側に寄り過ぎると上腕筋に入る（支配はおそらく同じだが注意）。"]},"clinical":["上肢針筋電図の代表的被検筋で、ミオパチーや運動ニューロン疾患など全身性疾患で選ばれ、定量解析データも豊富。","筋節は三角筋よりやや低位でC5主体だがC6もかなり入る例があり、筋節の示準筋には向かない。近位型CSAでは三角筋＞上腕二頭筋の低下となるのが常で、C6単独障害では通常低下しない。","ALSでは初期の筋力低下は目立たないが、線維自発電位・線維束自発電位の検出頻度が高く有用。BBで複合反復発射（CRD）が豊富に出ることを特徴とするALS例もある。","筋炎でのFib/PSWの頻度が高く（上肢筋で最多とする研究もある）、生検にも適し、筋炎ではまず調べるべき筋。","健常者を含め筋生検所見が最もよく調べられた筋で、生検を考える時に比較目的で針筋電図をとるとよい。needle myopathy 回避のため対側を検査するのが一般的だが、左右差がある場合は同側で針筋電図は短頭、生検は長頭と使い分けることもできる。"],"page":54,"headText":"C5,C6","rootSrc":"表","nk":"mc","nshort":"筋皮","bookPage":50},{"id":"triceps_brachii","kind":"muscle","ja":"上腕三頭筋","en":"Triceps brachii","abbr":"TB","region":"肩甲帯・上腕","roots":{"C6":1,"C7":3,"C8":2},"rootText":"C7＋C8,(C6)","nerve":"橈骨神経","action":"肘関節伸展","mmt":{"position":"座位。肩軽度外転屈曲位、前腕回外位で、肘を軽度屈曲位（15〜60度）に保持して伸ばす力を入れさせる。","fixation":"非検査手で上腕遠位〜肘部をしっかり持って固定する。","technique":"検者の手〜前腕屈側を前腕遠位伸側に当てて肘を屈曲させる方向に力を加え、break されるかを見る。固定手には肩屈曲方向の強い力がかかる。","grading":"5・4・2・1は評価できるが、3は姿勢変換なしでは困難で、通常は3抜きのgradingとする。2は肩90度外転で肘の運動を水平面にし、屈曲位から全ROMで伸展できるかで評価する。","pitfalls":["肘完全伸展位ではロックがかかり実際以上に強く見え、検者の力が骨関節に負担をかけ危険なので避ける。","肘の屈曲角度で筋力が大きく変わり、伸展位ほど強く、屈曲するほど急速に弱くなる。","肘60度程度の中等度屈曲位で調べると軽度低下も検出できるが、左右の角度を正確に揃えることが極めて重要。90度程度まで曲げると健常者でも break される人が多い。"]},"normalMayBreak":false,"emg":{"position":"仰臥位。安静時と随意収縮時で肢位が大きく異なる。","insertion":"肘頭の近位約10cm、長頭の固く触れる筋腹、またはその前方の外側頭の筋腹。随意収縮に適した部分は安静時に分かりにくいので、随意収縮時は刺し直した方がよい。","activation":"上肢を体幹の上に乗せ、肘30〜45度程度の軽度屈曲位から伸ばさせる（前腕回外位がよい）。力が強いので検者の前腕で抵抗することが多い。","notes":["安静時は肩軽度外転、肘伸展〜わずか屈曲で体側にだらんと置く（前腕中間位か回内位）。刺入点がベッド面に近くなるので注意。","長頭・外側頭のどちらでもよく、頭間で筋節が異なる証拠はない。長頭は表面に腱膜様組織があり刺入抵抗がやや強いことがある。","近位に寄ると皮下組織が厚く筋腹が分かりにくく三角筋と紛らわしいので、筋腹中央よりやや遠位に刺す。"]},"clinical":["C7支配の代表筋で、C7筋節の示準筋。","C7は頸椎症で神経根症が最も多い髄節で、C5/6脊髄症も多いため、高齢者では無症候でも随意収縮で神経原性変化をしばしば認める（脱神経まではまずなく、線維自発電位があれば確実に異常）。病的か迷う時は潜在性変化の少ない橈側手根屈筋（FCR）を調べるとよい。","ALSでの線維束自発電位の出現頻度は代表的被検筋の中で最も高く、ALSの被検筋として有用。"],"page":59,"headText":"(C6),C7,C8","rootSrc":"表","nk":"rad","short":"上腕三頭筋","nshort":"橈骨","bookPage":55},{"id":"anconeus","kind":"muscle","ja":"肘筋","en":"Anconeus","abbr":"","region":"前腕","roots":{"C7":2},"rootText":"C7","nerve":"橈骨神経","action":"肘関節伸展","mmt":{"position":"単独のMMTは不可能。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位。上腕三頭筋に準じるが、安静時・随意収縮時の肢位変換は不要で、上肢をベッドに置いたまま施行できる。","insertion":"肘頭のやや遠位前方、上腕骨外側上顆と尺骨後縁に挟まれた三角形の筋腹の固く触れる部分。","activation":"肘関節を伸展させる。","notes":["安静時は肘を軽く曲げた自然な肢位。","刺入点が遠位前方に寄り過ぎると尺側手根伸筋に入る。"]},"clinical":["上腕三頭筋と同じ性質をもつ前腕の筋。","最も多い橈骨神経麻痺（Saturday night palsy）では、上腕三頭筋と同様に障害を免れる。","反復神経刺激試験に好んで用いる研究者もいる。"],"page":62,"headText":"(C7) 要確認","rootSrc":"見出し","nk":"rad","nshort":"橈骨","bookPage":58},{"id":"brachioradialis","kind":"muscle","ja":"腕橈骨筋","en":"Brachioradialis","abbr":"BR","region":"前腕","roots":{"C5":3,"C6":1},"rootText":"C5,(C6)","nerve":"橈骨神経","action":"肘関節屈曲（特に前腕回内外中間位）","mmt":{"position":"座位、肩内転位。前腕回内外中間位で肘90度屈曲位を保持させる。","fixation":"非検査手で上腕遠位部（肘のすぐ近位）をしっかり持って固定する。","technique":"検査手で前腕遠位部の橈側を持ち、肘を伸展する方向に力を加えて break されるかを見る。","grading":"上腕二頭筋との正確な分離は困難。通常の方法で5・4・3、肩90度外転位で2も一応評価できる。","pitfalls":["上腕二頭筋が正常だと腕橈骨筋に低下があっても検出は困難。手技中に筋のレリーフが浮き出るか、萎縮がないかを主に評価する。","逆に上腕二頭筋の方が弱い場合は正確に評価できるが、そうした疾患は多くない。"]},"normalMayBreak":false,"emg":{"position":"仰臥位。上肢を自然にベッドに置き、肘伸展〜軽度屈曲、前腕回内外中間位。","insertion":"中間位で肘を曲げる力を入れさせて筋腹を確認し、起始から数cmの固い筋腹に刺入する。","activation":"そのまま肘を軽く曲げる力を入れさせる。強い筋ではないので肘伸展に近い位置のまま検査できる。","notes":["安静時は前腕が回内・回外どちらにも倒れないよう前腕遠位を軽く保持する。","萎縮が強い場合、内側（尺側）にある円回内筋に刺入しないよう注意する。"]},"clinical":["成書ではC6支配（腕橈骨筋反射もC6）とされることが多いが、著者はC5＞C6で上腕二頭筋とほぼ同じか、わずかに頭側の筋節と考えている。","三角筋・棘下筋＞腕橈骨筋≧上腕二頭筋（上腕三頭筋正常）という分布は正確なC5ないしC5/6の髄節性障害で、近位型CSAに典型的。","三角筋＋棘下筋の障害はNAでもよく見られるが、上腕二頭筋や、上腕三頭筋を保って腕橈骨筋が侵される分布は末梢神経支配で説明しにくく、NAらしくない所見となる。","平山病の oblique atrophy で腕橈骨筋が保たれることは有名だが、より頻度の高い遠位型CSA（C8中心）でも筋節が全く異なるため障害を免れる。","橈骨神経麻痺（螺旋溝での Saturday night palsy など）では障害される最も近位の筋となる。"],"page":64,"headText":"C5,C6","rootSrc":"表","nk":"rad","nshort":"橈骨","bookPage":60},{"id":"wrist_extension","kind":"movement","ja":"手関節伸展（背屈）","en":"Wrist extensors","abbr":"","region":"前腕","roots":{},"rootText":"記載なし（複数筋）","nerve":"","action":"手関節伸展（背屈）：主にECRB/ECRL、ほかECU・EDなど","mmt":{"position":"座位。肘を曲げ指を握り、前腕回内位で手掌を下に向け、手関節最大伸展（背屈）位または中間位を保持させる。","fixation":"非検査手で前腕遠位部をしっかりつかんで固定する。","technique":"検査手を手背に当てて手関節屈曲方向に力を加え、break されるかを見る。","grading":"手部は軽く、MMT2と3にはほとんど差がない（真の2を見ることは極めて稀）ため、著者は通常3抜きのgradingをしている。厳密な2は被検側を上にした側臥位・前腕回内位で伸展できるかを見る。","pitfalls":["最大伸展位は前腕伸筋が最も強い肢位。これで break できなければ中間位（前腕と手背が同一平面）でも調べる。健常者は中間位でも break されず、軽度低下があると中間位で break される。角度を揃えた左右比較が有用。","最も作用が大きいのはECRB/ECRLで、この方法は主にECRB/ECRLを評価する。ECUが弱くても手背橈側寄りに力を加えればECRB/ECRLの正常を示せる。","ECUの分離評価は困難だが、ある程度は可能（尺側手根伸筋の項）。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":[]},"clinical":["この方法は主にECRB/ECRLを評価するのでC6筋節障害の指標となる。C6単独障害では筋力低下は手関節伸展と前腕回内のみに現れる。"],"page":68,"rootSrc":"見出し","nk":"rad","nshort":"橈骨","bookPage":64},{"id":"ecrb","kind":"muscle","ja":"短橈側手根伸筋","en":"Extensor carpi radialis brevis","abbr":"ECRB","region":"前腕","roots":{"C6":3,"C7":2},"rootText":"C6＋C7","nerve":"橈骨神経深枝（後骨間神経への移行前）","action":"手関節伸展（背屈）","mmt":{"position":"手関節伸展（背屈）の項に記載。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位。肘伸展、前腕回内位でベッド上に自然に置く。","insertion":"まず腕橈骨筋を同定し、その尺側に索状に固く触れるECRBを確認して、前腕近位1/3付近の筋腹に刺入する。","activation":"指を握って手関節を背屈させる。","notes":["前腕伸筋は完全に脱力しにくいことがあり、前腕全体を揺する、手関節をかなり強く他動的に掌屈位にするなどの工夫がいる。","きちんと同定した筋腹でも安静時から随意収縮に移るとずれることがしばしばある（皮膚と筋の位置関係の変化）。その場合は刺し直して最適な部位で随意収縮を記録する。"]},"clinical":["前腕伸筋の代表として被検筋によく選ばれる。ECRLとは筋節が若干異なる可能性があり、意識して使い分ける。","C6主体の支配である数少ない筋（もう一つは円回内筋）で、円回内筋とECRBに異常を証明すればC6障害を支持する。ECRLより筋節はやや低く、C7の寄与も若干あると思われる。","指伸筋以遠の後骨間神経支配筋はC8主体で筋節が全く異なる。ED以遠異常・ECRB正常でも後骨間神経麻痺とは言えず、頻度の高い遠位型CSAでも同じ所見となる。"],"page":70,"headText":"C6,C7","rootSrc":"表","nk":"rad","nshort":"橈骨","bookPage":66},{"id":"ecrl","kind":"muscle","ja":"長橈側手根伸筋","en":"Extensor carpi radialis longus","abbr":"ECRL","region":"前腕","roots":{"C5":2,"C6":2},"rootText":"C5,C6","nerve":"橈骨神経","action":"手関節伸展（背屈）及び橈屈、肘関節屈曲（前腕回内位）","mmt":{"position":"手関節伸展（背屈）の項に記載。","fixation":"","technique":"","grading":"","pitfalls":["上腕骨と第2中手骨底を結ぶ二関節筋で、前腕回内位ではこの筋だけで若干肘を屈曲できる点に注意。"]},"normalMayBreak":false,"emg":{"position":"ECRBと同じ。","insertion":"腕橈骨筋・ECRBを同定し、それを近位へたどって上腕骨外側上顆の前方、肘関節の高さ付近まで行くとECRLとなる。","activation":"ECRBと同じ（指を握って手関節背屈）。","notes":[]},"clinical":["意義はECRBと同様だが、おそらく筋節がやや高く、C5障害でも異常が出る。腕橈骨筋とECRBの中間的な高さとなる。"],"page":72,"headText":"C5,C6","rootSrc":"表","nk":"rad","nshort":"橈骨","bookPage":68},{"id":"extensor_digitorum","kind":"muscle","ja":"指伸筋","en":"Extensor digitorum (旧称 extensor digitorum communis; EDC)","abbr":"ED","region":"前腕","roots":{"C7":2,"C8":3},"rootText":"C8＋C7","nerve":"後骨間神経","action":"2〜5指の伸展（MP関節での伸展）","mmt":{"position":"肘を曲げ、前腕回内、手関節中間位で、MP関節以遠をピンと伸ばした最大伸展位を保持させる。","fixation":"非検査手で中手骨部分をつかんで固定する。","technique":"検者の示指1本を2〜5指のPIP関節またはそのわずか近位（基節遠位部）に当て、屈曲方向に力を加えて break されるかを見る。","grading":"手関節以遠の運動には重力の効果がないため、重力なしのgrading（3抜き）とする。","pitfalls":["強い筋ではなく、複数の指で押したりPIPより遠位に力を加えると健常者でも容易に break される。本法でもわずかに break される健常者がいるので左右差を見る。","PIP・DIP関節は虫様筋でも伸展できるため、PIP・DIPの伸展でEDを評価してはいけない。PIPより遠位に力を加えるのも誤り。","PIP・DIPを曲げて検査する方法はEDに力が入りにくく、よい方法とは思われない。","手関節肢位が特に重要。背屈位ではEDに力が入りにくく、掌屈位では多少低下していても伸展できる。著者は中間位を基本とし、最大背屈位をオプションで追加して両方記載する（推移の把握に役立つ）。","指ごとに障害程度が異なる疾患ではED1（示指）〜ED4（小指）と別々に記載する。"]},"normalMayBreak":true,"emg":{"position":"仰臥位。前腕回内位で肘・手関節・指までベッドに置く。","insertion":"腕橈骨筋・ECRBを同定し、その尺側がED。示指だけ伸展させてEDとECRBの境界を確認し、尺骨後縁との間をEDとECUで二分すると考える。そのうえで2〜5指全部を伸展させて筋腹を確認し、前腕中央〜近位1/3付近の固い筋腹に刺す（もう2〜4cm遠位でもよい）。","activation":"MP関節で指を伸展させる。","notes":["ECRB同様、力が抜けにくい人が時にいる。","随意収縮SFEMGでは疲労を防ぐため指を1本ずつ伸ばさせる。最も表層は尺側指への筋束なので、まず4・5指一緒の伸展で調べ、疲れたら中指の伸展に切り替える。","遠位型CSAや後骨間神経麻痺でEDが強く萎縮しECRBが保たれる時は、誤ってECRBに刺さることがある。臨床所見と対比すれば容易に気付ける。"]},"clinical":["ECRBと並ぶ前腕伸筋の代表的被検筋。痛みが比較的少なく、MUPにシャープに当たりやすい。","SFEMGでも古くから用いられ、正常値も出されている。","遠位型CSA（多くはC8神経根症）ではED中心に障害され下垂指（drop finger）を呈することからC8主体と考えられるが、明確なC7神経根症でも障害されることがあり、C7が寄与する例もある。","後骨間神経麻痺と遠位型CSA（C8障害）は類似するが、後者では①尺骨神経支配筋が必ず同時に障害され、②約半数で（ECRB・ECRL・腕橈骨筋を飛ばして）上腕三頭筋に筋力低下が出る。","①はMMTで第一背側骨間筋・小指外転筋の低下で判定できるが、EDが弱い時の判定には技術を要する。尺側手根屈筋障害による手関節掌屈低下はごく軽度。針筋電図では第一背側骨間筋や特に尺側手根屈筋に脱神経を伴う高度の神経原性変化が必ずあるので容易に診断できる。"],"page":74,"headText":"C7,C8","rootSrc":"表","nk":"rad","nshort":"橈骨","bookPage":70},{"id":"ecu","kind":"muscle","ja":"尺側手根伸筋","en":"Extensor carpi ulnaris","abbr":"ECU","region":"前腕","roots":{"C7":1,"C8":3},"rootText":"C8,(C7)","nerve":"後骨間神経","action":"手関節背屈","mmt":{"position":"手関節伸展（背屈）と同じ手技。","fixation":"手関節伸展（背屈）と同じ。","technique":"手背の尺側に検者の手を当てて被検者の背屈力に抵抗する。","grading":"ECRB/ECRLが正常な時に「弱い＝MMT4」と評価できるのみで、それより細かいgradingは困難。ECRB/ECRLも弱い時はgrading不可能。","pitfalls":["ECRB/ECRLとの完全な分離評価は難しい。"]},"normalMayBreak":false,"emg":{"position":"ECRBと同じ。","insertion":"腕橈骨筋・ECRB・EDと同定していき、残る尺骨後縁との間がECU。その最も固い筋腹に刺入する。","activation":"ECRBと同じ。","notes":[]},"clinical":["遠位型CSAや後骨間神経麻痺では、C6中心のECRB/ECRLは保たれ、後骨間神経支配でC8中心のECUが障害される。自発的に手関節を最大背屈させるだけで、患側で手の尺側の挙上が不十分な橈側偏位（radial deviation）を呈する。","筋節・末梢神経支配はEDと同じと思われ、分離して針筋電図を行う必要性は少ない。"],"page":78,"headText":"C7,C8","rootSrc":"表","nk":"rad","nshort":"橈骨","bookPage":74},{"id":"epb","kind":"muscle","ja":"短母指伸筋","en":"Extensor pollicis brevis","abbr":"EPB","region":"前腕","roots":{"C7":1,"C8":3,"T1":1},"rootText":"C8,(C7,T1)","nerve":"後骨間神経","action":"母指MP関節の伸展","mmt":{"position":"肘を曲げ、前腕回内外中間位、手関節中間位で、母指MP関節最大伸展位を保持させる。","fixation":"非検査手の母指と示指以下で第1中手骨部分をつかんで固定する。","technique":"検者の示指を母指基節遠位部に当て、MP関節屈曲方向に力を加えて break されるかを見る。","grading":"重力なしのgradingとなる。","pitfalls":["本法で break されるかどうかには個人差があり、break される場合はMMT4などと記載する。左右比較が重要。"]},"normalMayBreak":true,"emg":{"position":"仰臥位。前腕回内位で肘・手をベッドに置く。","insertion":"母指を伸展させ、手関節から5〜6cm程度近位のやや橈側、ED腱（他指の伸展で盛り上がる）の橈側に触れる筋腹に刺入する。","activation":"母指を伸展させる。EPB・EPL・APLを随意運動で分離するのは難しく、母指全体の伸展・外転で十分。","notes":["安静時は母指をMP関節で軽く屈曲させ脱力させる。","針が橈側に寄るとAPLに入る（支配はほぼ同じと思われ、臨床的意義に大差はないかもしれない）。","随意MUPが母指の伸展に連動して動員され、他指の伸展では動員されないことを確認する。","小さい筋なので深く刺し過ぎない。"]},"clinical":["橈骨−後骨間神経支配のC8筋としてC8示準筋に使える。示指伸筋も同目的に使えるが、著者の印象ではEPBの方がより純粋なC8筋（より尾側）。","遠位型CSAなどC8中心の障害は、指伸筋優位で下垂指を呈する型と尺骨神経支配小手筋優位の型に分かれる。後者で尺骨神経麻痺でなくC8障害であることをMMT・針筋電図で示すのに最も有用な筋の一つ。","長母指外転筋（APL）はEPBのさらに橈側近位にあり固く触れて同定しやすいが、意義はEPB/EPLと同じと考えられ、著者は分離評価も針筋電図もしていないため本書では割愛。"],"page":80,"headText":"C8","rootSrc":"表","nk":"rad","nshort":"橈骨","bookPage":76},{"id":"epl","kind":"muscle","ja":"長母指伸筋","en":"Extensor pollicis longus","abbr":"EPL","region":"前腕","roots":{"C7":1,"C8":3,"T1":1},"rootText":"C8,(C7,T1)","nerve":"後骨間神経","action":"母指IP関節の伸展","mmt":{"position":"肘を曲げ、前腕回内外中間位、手関節中間位、母指MP関節伸展位で、母指IP関節最大伸展位を保持させる。","fixation":"非検査手の母指と示指以下で母指基節をつかんで固定する。","technique":"検者の示指1本を母指末節に当て、IP関節屈曲方向に力を加えて break されるかを見る。","grading":"重力なしのgradingとなる。","pitfalls":["EPBと同様、本法で break されるかには個人差があり、左右比較が重要。"]},"normalMayBreak":true,"emg":{"position":"","insertion":"筋腹は前腕中央遠位寄り尺側、示指伸筋の近位にあるが、ECUに覆われ深くなるため針筋電図には適さない。","activation":"","notes":[]},"clinical":["MMTでの意義はEPBとほぼ同じ。"],"page":84,"headText":"C8 要確認（見出しOCR判読不良）","rootSrc":"表","nk":"rad","nshort":"橈骨","bookPage":80},{"id":"extensor_indicis","kind":"muscle","ja":"示指伸筋","en":"Extensor indicis (旧称 extensor indicis proprius; EIP)","abbr":"EI","region":"前腕","roots":{"C7":1,"C8":3},"rootText":"C8,(C7)","nerve":"後骨間神経","action":"示指の伸展","mmt":{"position":"EDと協働するため、分離したMMTは評価困難。","fixation":"","technique":"","grading":"","pitfalls":[]},"normalMayBreak":false,"emg":{"position":"仰臥位。前腕回内位で肘・手をベッドに置く。","insertion":"他指を屈曲したまま示指を伸展させ、手関節から4〜6cm程度近位で尺骨後縁とED腱に挟まれた前腕遠位尺側の筋腹を確認して刺入する。","activation":"示指を伸展させる。","notes":["安静時は示指をだらんとベッドに置かせる。"]},"clinical":["EPBと同様に後骨間神経の終枝でC8支配のため、C8示準筋の一つとして尺骨神経障害とC8障害の鑑別に使える。一般にはEIの方が有名だが、著者はEPBをよく用いる。","橈骨神経の運動神経伝導検査の記録筋としてよく知られる。"],"page":86,"headText":"C8 要確認（見出しOCR崩れ、本文の記載から判断）","rootSrc":"表","nk":"rad","nshort":"橈骨","bookPage":82},{"id":"pronator_teres","kind":"muscle","ja":"円回内筋","en":"Pronator teres","abbr":"PT","region":"前腕","roots":{"C6":3,"C7":1},"rootText":"C6,(C7)","nerve":"正中神経","action":"前腕回内","mmt":{"position":"座位。上腕を内転して肘を体幹に付け、肘90度屈曲で回内の力を入れさせ、前腕回内外中間位を保持させる。","fixation":"強い筋ではないので、被検者が上腕内転・肘を体幹に付ける姿勢を保つ力で通常固定となる。","technique":"①検者の両手で両前腕遠位部を持ち回外方向に力を加えて break を見る。②①で break されなければ、被検者の片手を検者の両手で持って両手で回外方向に力を加える。③MMT2以下は回外位から回内方向へ自力で動かせるかを見る。","grading":"重力なしのgradingとなる。","pitfalls":["回内の協働筋は方形回内筋（PQ）。著者の経験では肘屈曲位で主にPT、肘伸展・前腕回外位でPQが優位となり、ある程度区別できる（成書の「軽度屈曲位でPT、最大屈曲位でPQ」とは見解が異なる）。","①の方法では多少の低下は検出できない。②では検者の力が強く健常者でも break される人が出るため、左右比較が重要。"]},"normalMayBreak":true,"emg":{"position":"仰臥位。肘伸展、前腕軽度回内位でベッドに置く。","insertion":"まず腕橈骨筋を同定し、前腕を回内させて、肘窩の尺側から橈側へ斜めに走り腕橈骨筋の深部に隠れていくPTの筋腹を確認する（肘窩は橈側をBR、尺側をPTで区切られる三角形）。同定できる範囲でなるべく遠位、BRの下に隠れる直前の固い筋腹に刺す。","activation":"安静時の位置から前腕を回内する方向に力を入れさせる。","notes":["上腕骨内側上顆に近い近位部で刺す方法もあるが、多数の前腕屈筋が集まり分離同定が悪くなるため著者は用いない。","正中神経がPTを貫くため、近位に寄り過ぎると神経に当たる危険がある。手指への放散するしびれ・痛みがあれば申告させ、針を引き、必要ならより遠位に刺し直す。","PTは橈側手根屈筋（FCR）に接し、尺側に寄るとFCRを調べてしまう。肘窩へ落ち込む斜面に当たるPT橈側縁近くで、なるべく遠位に刺すと防げる。腱と見まがう硬く細い筋腹がPTのことがある。","C6障害やNAでPTが著明に萎縮しFCRが保たれる場合、FCR表面に紙のように薄いPTが張り付いた形となることがあり、正しく刺さると豊富な脱神経が見られる。"]},"clinical":["C7支配とする記載もあるがC6主体で、数少ないC6示準筋。C7の若干の関与はあり得るが、C5は決して入らないとされる。","このため近位型CSAなどでC5単独障害かC5/6障害かの鑑別に使える。","C6神経根症はPTとECRB（ECRL）程度しか障害せず、回内と手関節伸展がわずかに弱くなる（MMT4程度）だけで検出しにくいため、PTの針筋電図が診断に重要。","NAでもPTとFCRは高頻度に障害され、髄節性で説明できないPT/FCRの異常の合併はNAの診断を支持する。"],"page":88,"headText":"C6,C7","rootSrc":"表","nk":"med","nshort":"正中","bookPage":84},{"id":"wrist_flexion","kind":"movement","ja":"手関節屈曲（掌屈）","en":"Wrist flexors","abbr":"","region":"前腕","roots":{},"rootText":"記載なし（複数筋）","nerve":"","action":"手関節屈曲。FCR・FCUに加え長掌筋、FDS・FDPなど手指屈筋も協働する","mmt":{"position":"座位・肘屈曲・指は握る。前腕回外（手掌を天井）で「手首を自分の方に曲げて」と最大屈曲位を保持させる。あるいは前腕回内（手掌を床）で「手首を下に曲げて」と中間位を保持させる。","fixation":"非検査手で前腕遠位部をしっかりつかむ。","technique":"検査手を手の屈側にあて、手関節伸展方向へ力を加えて保持がbreakされるかを見る。","grading":"手部が軽く、MMT2と3にほとんど差がない（真の2をまず見ない）ため、筆者は3を抜いたgradingをしている。","pitfalls":["最大屈曲位は前腕屈筋群が最も強い肢位なので、ここでbreakできなければ前腕回内位にして手関節中間位（屈曲伸展0度）の保持を調べる。健常者はこの肢位でもbreakされず、軽度の筋力低下を検出できる。","中間位でのbreakの有無は手関節のわずかな角度で変わるので、左右で角度を揃えて比べる。","FCRとFCUはMMTで分離できない。"]},"normalMayBreak":false,"emg":{"position":"","insertion":"","activation":"","notes":["個別筋（FCR・FCU など）の項を参照。"]},"clinical":["FCRはC7支配だが、筆者の方法では単一根障害でC7よりC8障害で手関節屈曲が弱くなりやすく、T1障害でも弱くなることがある。FDS・FDP（示指・中指）・長掌筋などT1支配筋の寄与が大きいことを示唆する。"],"page":92,"rootSrc":"見出し","nk":"","bookPage":88},{"id":"fcr","kind":"muscle","ja":"橈側手根屈筋","en":"Flexor carpi radialis","abbr":"FCR","region":"前腕","roots":{"C6":1,"C7":3},"rootText":"C7,(C6)","nerve":"正中神経","action":"手関節屈曲","mmt":{"position":"手関節屈曲の項を参照。","fixation":"","technique":"","grading":"","pitfalls":["FCU・長掌筋などとMMTで分離はできない（手関節屈曲として評価）。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、肘伸展、前腕回内回外中間位でベッド上に置く。","insertion":"抵抗下に手関節を屈曲させ、前腕遠位正中に浮き出る2本の腱の橈側をFCR（尺側は長掌筋）と同定。FCR腱を上腕骨内側上顆の方へたどり、屈曲で盛り上がる筋腹（前腕近位1/4付近）に刺入。","activation":"手の屈側に検者の手を添え、それに抗して手関節を屈曲する力を入れてもらう。","notes":["抵抗なしで屈曲させると長掌筋腱が主に浮き、痩せた人ではその尺側にFDS腱も浮くため、この2本をFCR・PLと誤認しやすい。FCR腱は抵抗をかけて初めて浮き出ることが多い。","腱を近位にたどると一度連続性が途切れたように感じた後に筋腹が触れる。腱の延長～やや尺側で、抵抗下屈曲で最も盛り上がる部位を探す。","橈側からPT、FCR、PL、FDS（近位では深部）、FCUが密に並ぶので同定を誤らない。"]},"clinical":["C7支配の代表筋でC7示準筋になる。","C7神経根症ではTB・FCR（と広背筋）が代表的な障害筋で、TBとFCRに脱神経があればC7障害と考えてよい。脱神経の出現率はFCRの方がTBより高い印象で、TBで明確でなくても調べる価値がある。","TBは高齢健常者でも随意収縮時の潜在性変化が出やすいが、FCRではそれが少なく、変化が明確なら病的と言える。","神経痛性筋萎縮症（NA）でもPTとFCRは高頻度に障害される。","長掌筋（PL）は細く変異も多いため、筆者は針筋電図の対象にしない。筋節はFDSと同様T1とされる。"],"page":94,"headText":"C7","rootSrc":"表","nk":"med","nshort":"正中","bookPage":90},{"id":"fds","kind":"muscle","ja":"浅指屈筋","en":"Flexor digitorum superficialis","abbr":"FDS","region":"前腕","roots":{"T1":3},"rootText":"T1","nerve":"正中神経","action":"2～5指の近位指節間関節（PIP関節）の屈曲","mmt":{"position":"肘屈曲・前腕回外・手関節は自然な位置。「指を全部ぎゅっと握って、人差し指（小指）を曲げて」と指示し、MP・DIPも含めて屈曲させ、調べる指のPIP最大屈曲位を保持させる。","fixation":"非検査手の母指と他指で、調べる指の基節をしっかり保持する。","technique":"検査手の示指を中節屈側にあてPIP伸展方向へ力を加え、breakされるかを見る。2未満は基節を固定したままPIP伸展位から自力で曲げられるかを見る。","grading":"重力なしのgrading。","pitfalls":["本来は1指ずつ調べるべきで、筆者は調べやすい示指（FDS1）と小指（FDS4）を主に評価する。","FDPでもPIPは屈曲できるため、FDPが強ければFDSの低下はマスクされる。FDSの評価はFDPより強いグレードの場合にのみ意味がある（例：FDP 4ならFDSが5あるかだけがわかる）。","DIPを伸ばしたままPIPを曲げさせる方法は手技として容易でなく、FDSにも十分力が入らないことが多い。","実用上重要なのは「FDP弱・FDS強」の状況（前骨間神経麻痺の示指・中指、C8障害や尺骨神経障害の小指・環指、封入体筋炎など多くのミオパチー）で、上記の戦略で十分評価できる。","ヒステリー性麻痺では手指屈筋にgive-way weaknessが出やすく、FDS・FDP・MP屈曲をまとめた手指屈筋全体の評価がその判定に役立つ。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、肘伸展・前腕回外位でベッド上に置く。","insertion":"指を強く握らせ、手関節近位で長掌筋腱の尺側に出るFDS腱を同定し、PL腱とFCU腱に挟まれることを確認。腱を近位へたどり、前腕中央やや遠位～遠位1/3の範囲で触れる筋腹に刺入（それより近位ではPL・FCUの深部に隠れる）。","activation":"検者の対側の手の2～5指全部を握ってもらうと、等尺性を保ちやすくFDSに力が入りやすい。","notes":["筋腹の同定が不十分だと橈側のPLや尺側のFCUに刺入される。","動きが大きい筋なので等尺性維持が特に重要。収縮後に急に指を最大伸展すると強い痛みや筋断裂の恐れがある。"]},"clinical":["最も純粋なT1支配筋でT1示準筋として使える。同じT1支配のAPBの針筋電図は非常に痛いので、FDSの方が有用。","真の神経性胸郭出口症候群（TN-TOS）、稀なT1神経根症、T1まで及ぶ一部の遠位型CSA、平山病で障害される。","C8に限局することの多い遠位型CSAでは、隣接するFCUは強く障害されるのにFDSは針筋電図でもほぼ正常に保たれ、診断に非常に有用な所見となる。","C8障害でFCUが強く萎縮すると、FDSがかなり近位まで体表から触れるようになる（FCUの項のpitfall参照）。","ヒステリー性麻痺での指屈曲の弱さが中枢性筋力低下であることを示すのに、FDSの針筋電図（脱神経なし・poor activation）が有用。"],"page":96,"headText":"T1","rootSrc":"表","nk":"med","nshort":"正中","bookPage":92},{"id":"fcu","kind":"muscle","ja":"尺側手根屈筋","en":"Flexor carpi ulnaris","abbr":"FCU","region":"前腕","roots":{"C7":2,"C8":3},"rootText":"C8＋C7","nerve":"尺骨神経","action":"手関節屈曲、小指外転の協働筋","mmt":{"position":"手関節屈曲の項を参照。","fixation":"","technique":"","grading":"","pitfalls":["FCUのみを分離したMMT評価は困難。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、肘伸展、前腕回外位でベッド上に置く。","insertion":"指をパーに開いて小指を外転させると協働筋として索状に浮くFCU筋腹を同定（回外位で前腕内側縁、前後厚の中間）。抵抗下に手関節を屈曲させても同じ筋腹が浮くことを確認し、前腕近位1/4～1/3の高さで刺入。","activation":"指を握らせ、手の屈側に添えた検者の手に抗して手関節を屈曲させる。","notes":["刺入が近位すぎたり深すぎると尺骨神経に当たることがある。小指への放散するしびれ・痛みがあれば申告させ、針を引いてより遠位に刺し直す。","刺入点が橈側（前方）に寄るとFDS・FCRに、後方に寄るとFDP3/4に入る恐れがある。","遠位型CSAなどC8障害でFCUが高度萎縮しT1支配のFDSが保たれている場合、FCUのつもりでFDSを刺して正常と判断してしまうのは頻度の高いpitfall。FCU単独の筋力低下はMMTで捉えにくいため、なおさら問題になる。","その場合はFCU腱（完全麻痺でも硬い腱は触知可能）から上腕骨内側上顆へ引いた直線上、前腕近位付近で刺すと、豊富な脱神経電位が得られFCUに入ったと確認できる。"]},"clinical":["C8示準筋としてよく用いられるが、人によりC7支配も入る。外側神経束から尺骨神経に加わるC7由来の枝の存在で説明できる可能性がある。","遠位型CSAでは高頻度に障害され、高度脱神経を示すことが多い。下垂指を主徴とする遠位型CSAで、FCUの異常を示すことが後骨間神経麻痺ではなく髄節性C8障害であることの証明に役立つ。","肘部尺骨神経障害（UNE）では保たれることも多い。肘より上で分岐する枝によるとよく解釈されるが、神経内トポグラフィーや障害程度の問題とするデータもある。"],"page":100,"headText":"C7,C8","rootSrc":"表","nk":"uln","nshort":"尺骨","bookPage":96},{"id":"fdp","kind":"movement","ja":"深指屈筋","en":"Flexor digitorum profundus","abbr":"FDP","region":"前腕","roots":{"C8":3,"T1":3},"rootText":"C8,T1","nerve":"示指・中指＝正中神経（前骨間神経）、環指・小指＝尺骨神経（変異が多く、教科書的なパターンは少ないともされる）","action":"2～5指の遠位指節間関節（DIP関節）の屈曲","mmt":{"position":"肘屈曲・前腕回外・手関節は自然な位置。「指を全部ぎゅっと握って」と指示し、PIP・MPも含めて屈曲させ、調べる指のDIP最大屈曲位を保持させる。","fixation":"非検査手の母指と他指で、調べる指の中節より近位をしっかり保持する。","technique":"検査手の示指を末節屈側にあてDIP伸展方向へ力を加え、breakされるかを見る。2未満は中節を固定したままDIP伸展位から自力で曲げられるかを見る。","grading":"重力なしのgrading。","pitfalls":["1指ずつ調べるべきで、筆者は示指（FDP1）と小指（FDP4）を主に評価する。","PIP伸展位で調べる方法ではDIP屈曲に十分な力が入りにくい。MP・PIPもまとめて屈曲させる方が最大収縮を得られる。"]},"normalMayBreak":false,"emg":{"position":"仰臥位、肘をベッドについて90度以上屈曲、前腕は回外～回内回外中間位。検者の非検査手で前腕遠位をつかんで空中に保持する。","insertion":"尺側の指を小さく丸めるように強く握るのを繰り返させ、尺骨後縁の内側（前方）に浮き出るFDP3/4の筋腹を同定。肘頭から約10cm、前腕近位1/3の高さで刺入。起始に近く筋腹の動きは小さいので、針先の傾きは原則と逆でも差し支えない。","activation":"自分で尺側の指を握らせるか、検者の指1本を尺側指の屈側にあてて握らせる。","notes":["表在で調べやすいのは尺骨神経支配のFDP3/4。正中神経支配のFDP1/2はFDP3/4を貫いた深部にあり、深さと痛みから容易ではない。","針が前方に寄るとFCUに入る。","近位すぎると尺骨神経に当たることがあり、小指への放散痛に注意する。肘からある程度遠位に刺せば避けられる。","IBMなどのミオパチーで高度萎縮し筋腹が同定しにくい時は、尺骨後縁から1cm程度前方を中心に萎縮筋腹が残っていることが多い。"]},"clinical":["示指・中指は正中-前骨間神経、環指・小指は尺骨神経支配で、その解離は末梢神経障害を示唆するとされるが、特に中指・環指で変異が大きい。前骨間神経麻痺でもFPLとFDP1のみ障害される例が多い。変異の少ないFDP1とFDP4を主に調べるのが推奨される。","筆者らは筋力評価からFDP1は主にT1、FDP4は主にC8支配であることを示した。FDP1/FDP4の解離は髄節性障害でも生じ、TN-TOS（T1主体）ではFDP1優位、遠位型CSA（C8主体）ではFDP4優位に障害される。","封入体筋炎（IBM）ではFDPが選択的に強く障害される。他筋では高振幅MUPが主体となり神経原性と誤られやすいが、FDP3/4では著明な低振幅MUPが主体でミオパチーと容易に診断できる。","FDPの強い障害はIBMに限らず、筋強直性ジストロフィーやBecker型筋ジストロフィーなど他の多くのミオパチーでも見られる。"],"page":104,"headText":"示指（FDP1）＝T1，小指（F
