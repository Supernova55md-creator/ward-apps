<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MMTナビ（図入り）パスワード付きファイルの作成</title>
<style>
body{margin:0;font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;background:#F5F4F8;color:#1E1B2B}
.box{max-width:560px;margin:40px auto;background:#fff;border:1px solid #E1DDEA;border-radius:14px;padding:22px 24px}
h1{font-size:19px;margin:0 0 8px;color:#4B3478}
p,li{font-size:14px;line-height:1.7}
label{display:block;font-size:13px;color:#5E5A6E;margin-top:12px}
input{font:inherit;font-size:16px;width:100%;box-sizing:border-box;padding:10px;border:1px solid #CFC8DD;border-radius:9px}
button{font:inherit;font-size:15px;font-weight:700;margin-top:16px;padding:11px 18px;border:0;border-radius:9px;background:#6B4FA0;color:#fff;cursor:pointer}
button:disabled{opacity:.5}
#msg{font-size:14px;margin-top:12px;white-space:pre-wrap}
code{background:#F1EEF7;padding:1px 5px;border-radius:4px}
</style></head><body>
<div class="box">
<h1>MMTナビ（図入り）を作る</h1>
<p>MRC『末梢神経と筋のみかた』の図を内蔵したMMTナビを、パスワードで暗号化した1つのHTMLにします。パスワードはこのMacの中だけで使い、どこにも送りません。</p>
<ul>
<li>パスワードは12文字以上。忘れると開けません（作り直しはこのページでできます）。</li>
<li>保存先は <code>Dropbox/20_武蔵野日赤/院内申請（USB持ち込み）/2_USBに入れるファイル</code>、ファイル名は <code>__FNAME__</code> にしてください。</li>
<li>このページ自体は図が暗号化されていない元データです。院内には持ち込まないでください。</li>
</ul>
<label>パスワード<input type="password" id="p1" autocomplete="new-password"></label>
<label>もう一度<input type="password" id="p2" autocomplete="new-password"></label>
<button id="go">作成して保存</button>
<div id="msg" role="status"></div>
</div>
<script>
const FNAME="__FNAME__";
const PAYLOAD="__PAYLOAD__";
const LOADER=__LOADER__;
const b64=u8=>{let s="";const C=0x8000;for(let i=0;i<u8.length;i+=C)s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));return btoa(s);};
const msg=t=>document.getElementById("msg").textContent=t;
document.getElementById("go").addEventListener("click",async()=>{
  const p1=document.getElementById("p1").value,p2=document.getElementById("p2").value;
  if(p1.length<12){msg("パスワードは12文字以上にしてください。");return;}
  if(p1!==p2){msg("2回の入力が一致しません。");return;}
  const go=document.getElementById("go");go.disabled=true;msg("暗号化しています…（数秒）");
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p1),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt"]);
    const pt=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,pt));
    const out=LOADER.replace("__SALT__",b64(salt)).replace("__IV__",b64(iv)).replace("__CT__",b64(ct));
    const blob=new Blob([out],{type:"text/html"});
    document.getElementById("p1").value="";document.getElementById("p2").value="";
    if(window.showSaveFilePicker){
      try{const h=await showSaveFilePicker({suggestedName:FNAME,types:[{description:"HTML",accept:{"text/html":[".html"]}}]});const w=await h.createWritable();await w.write(blob);await w.close();msg("保存しました（"+(blob.size/1048576).toFixed(1)+"MB）。院内の端末で開き、パスワードで開けることを確かめてください。");go.disabled=false;return;}
      catch(e){if(e&&e.name==="AbortError"){msg("保存を取り消しました。");go.disabled=false;return;}}
    }
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=FNAME;document.body.appendChild(a);a.click();
    msg("ダウンロードしました（"+(blob.size/1048576).toFixed(1)+"MB）。ダウンロードフォルダから 2_USBに入れるファイル に移してください。");go.disabled=false;
  }catch(e){msg("作成できませんでした："+(e&&e.message||e));go.disabled=false;}
});
</script>
</body></html>
